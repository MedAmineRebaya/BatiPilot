<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14395C">
<title>BâtiPilot — Gestion de chantiers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== css/style.css ===== */
/* =========================================================
   BâtiPilot — Design system
   Palette « chantier » : bleu nuit béton + orange signalisation
   Typo : Barlow Semi Condensed (titres / données) + Inter (texte)
   ========================================================= */

:root{
  /* --- Couleurs de marque --- */
  --ink:        #0E2233;
  --navy:       #14395C;
  --navy-700:   #0F2C47;
  --navy-600:   #1C5583;
  --navy-050:   #E8F0F7;
  --orange:     #E4651A;
  --orange-600: #C4530F;
  --orange-050: #FDF0E7;

  /* --- Surfaces --- */
  --bg:         #EEF2F6;
  --surface:    #FFFFFF;
  --surface-2:  #F7F9FC;
  --surface-3:  #EDF1F6;
  --border:     #DFE6EE;
  --border-2:   #C7D3E0;

  /* --- Texte --- */
  --text:       #10263A;
  --text-2:     #34506B;
  --muted:      #5C7186;
  --faint:      #8698A9;
  --on-dark:    #E7EEF5;

  /* --- Statuts --- */
  --ok:         #17845A;  --ok-bg:   #E4F4EC;
  --warn:       #B26A05;  --warn-bg: #FBF0DC;
  --danger:     #C42B2B;  --danger-bg:#FBE7E7;
  --info:       #1C6FA8;  --info-bg: #E4F0F9;
  --neutral:    #5C7186;  --neutral-bg:#EAEFF4;

  /* --- Formes --- */
  --r-sm: 8px;
  --r:    12px;
  --r-lg: 16px;
  --r-pill: 999px;

  --shadow-1: 0 1px 2px rgba(14,34,51,.06), 0 1px 1px rgba(14,34,51,.04);
  --shadow-2: 0 2px 4px rgba(14,34,51,.06), 0 12px 28px -18px rgba(14,34,51,.35);
  --shadow-3: 0 24px 60px -20px rgba(14,34,51,.45);

  /* --- Métriques tactiles --- */
  --tap: 48px;
  --sidebar-w: 264px;
  --sidebar-w-min: 84px;
  --topbar-h: 74px;
  --gap: 18px;
  --pad: 22px;

  /* --- Ruban de signalisation (élément signature) --- */
  --hazard: repeating-linear-gradient(135deg,
            var(--orange) 0 10px, #F6A15E 10px 20px);
}

*,*::before,*::after{ box-sizing:border-box; }

html,body{ height:100%; }
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}

h1,h2,h3,h4,h5{
  font-family:"Barlow Semi Condensed","Inter",sans-serif;
  margin:0; font-weight:600; letter-spacing:.2px; color:var(--ink);
}
h1{ font-size:24px; line-height:1.15; }
h2{ font-size:21px; }
h3{ font-size:18px; }
p{ margin:0; }
a{ color:var(--navy-600); }

button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
::placeholder{ color:var(--faint); }

:focus-visible{ outline:3px solid var(--navy-600); outline-offset:2px; border-radius:6px; }

.num{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }

/* Barre de défilement discrète mais tactile */
*::-webkit-scrollbar{ width:12px; height:12px; }
*::-webkit-scrollbar-thumb{ background:#C3D0DD; border-radius:99px; border:3px solid transparent; background-clip:content-box; }
*::-webkit-scrollbar-track{ background:transparent; }

/* =========================================================
   1. STRUCTURE
   ========================================================= */
.app{
  display:grid;
  grid-template-columns:var(--sidebar-w) 1fr;
  height:100dvh;
  overflow:hidden;
}
.app.is-collapsed{ grid-template-columns:var(--sidebar-w-min) 1fr; }

.main{ display:flex; flex-direction:column; min-width:0; height:100dvh; }

.view{
  flex:1; overflow-y:auto; overflow-x:hidden;
  padding:var(--pad);
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
}
.view:focus{ outline:none; }

/* =========================================================
   2. MENU LATÉRAL
   ========================================================= */
.sidebar{
  background:linear-gradient(180deg,var(--navy) 0%, var(--navy-700) 100%);
  color:var(--on-dark);
  display:flex; flex-direction:column;
  min-width:0;
  position:relative;
  z-index:40;
}
.sidebar__brand{
  display:flex; align-items:center; gap:12px;
  height:var(--topbar-h); padding:0 14px 0 18px;
  border-bottom:1px solid rgba(255,255,255,.10);
}
.brand__mark{
  width:40px; height:40px; flex:none; border-radius:11px;
  background:var(--orange); color:#fff;
  display:grid; place-items:center;
  box-shadow:0 4px 12px -4px rgba(228,101,26,.7);
}
.brand__text{ display:flex; flex-direction:column; min-width:0; }
.brand__name{
  font-family:"Barlow Semi Condensed",sans-serif; font-weight:700;
  font-size:21px; letter-spacing:.4px; color:#fff; line-height:1.1;
}
.brand__sub{ font-size:11px; color:rgba(231,238,245,.6); letter-spacing:.3px; }

.sidebar__toggle{
  margin-left:auto; width:38px; height:38px; flex:none;
  border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.06);
  border-radius:10px; color:#fff; display:grid; place-items:center;
  transition:background .15s;
}
.sidebar__toggle:hover{ background:rgba(255,255,255,.14); }

.nav{ flex:1; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:3px; }
.nav__group{
  font-size:10.5px; letter-spacing:1.4px; text-transform:uppercase;
  color:rgba(231,238,245,.42); padding:16px 12px 7px; font-weight:600;
}
.nav__item{
  display:flex; align-items:center; gap:13px;
  min-height:var(--tap); padding:0 13px;
  border:0; background:transparent; color:rgba(231,238,245,.82);
  border-radius:11px; width:100%; text-align:left;
  font-size:15px; font-weight:500; position:relative;
  transition:background .14s, color .14s;
}
.nav__item svg{ flex:none; }
.nav__item:hover{ background:rgba(255,255,255,.09); color:#fff; }
.nav__item.is-active{ background:rgba(255,255,255,.14); color:#fff; font-weight:600; }
.nav__item.is-active::before{
  content:""; position:absolute; left:-12px; top:9px; bottom:9px; width:4px;
  background:var(--orange); border-radius:0 4px 4px 0;
}
.nav__label{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nav__pill{
  margin-left:auto; background:var(--orange); color:#fff;
  font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:var(--r-pill);
  font-variant-numeric:tabular-nums;
}
.nav__pill--muted{ background:rgba(255,255,255,.18); }

.sidebar__foot{ padding:12px; border-top:1px solid rgba(255,255,255,.10); }
.sync{ display:flex; gap:10px; align-items:center; padding:10px 12px; border-radius:10px; background:rgba(255,255,255,.06); }
.sync__dot{ width:9px; height:9px; border-radius:50%; background:#4ADE80; flex:none; box-shadow:0 0 0 4px rgba(74,222,128,.18); }
.sync__text{ font-size:12px; color:rgba(231,238,245,.75); line-height:1.35; }
.sync__text small{ color:rgba(231,238,245,.45); }

/* Mode réduit */
.app.is-collapsed .brand__text,
.app.is-collapsed .nav__label,
.app.is-collapsed .nav__group,
.app.is-collapsed .sync__text,
.app.is-collapsed .nav__pill{ display:none; }
.app.is-collapsed .sidebar__brand{ padding:0 12px; justify-content:center; }
.app.is-collapsed .sidebar__toggle{ display:none; }
.app.is-collapsed .nav__item{ justify-content:center; padding:0; }
.app.is-collapsed .sync{ justify-content:center; }

.sidebar__scrim{
  position:fixed; inset:0; background:rgba(14,34,51,.45); z-index:35;
  backdrop-filter:blur(2px);
}

/* =========================================================
   3. BARRE SUPÉRIEURE
   ========================================================= */
.topbar{
  height:var(--topbar-h); flex:none;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:16px;
  padding:0 var(--pad);
  z-index:20;
}
.topbar__burger{ display:none; }
.topbar__title{ min-width:0; }
.topbar__title h1{ font-size:22px; }
.topbar__title p{ font-size:12.5px; color:var(--muted); margin-top:1px; }

.topbar__search{ margin-left:auto; position:relative; width:min(380px,34vw); }
.topbar__search input{
  width:100%; height:46px; border-radius:var(--r);
  border:1px solid var(--border); background:var(--surface-2);
  padding:0 14px 0 44px; font-size:14.5px;
  transition:border-color .15s, background .15s;
}
.topbar__search input:focus{ background:#fff; border-color:var(--navy-600); outline:none; box-shadow:0 0 0 3px var(--navy-050); }
.topbar__search-ico{ position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--faint); display:flex; }
.topbar__search input::-webkit-search-cancel-button{ -webkit-appearance:none; }

.omnibox{
  position:absolute; top:calc(100% + 8px); left:0; right:0;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r); box-shadow:var(--shadow-3);
  max-height:420px; overflow-y:auto; z-index:60; padding:6px;
}
.omnibox__group{ font-size:10.5px; letter-spacing:1.2px; text-transform:uppercase; color:var(--faint); padding:12px 12px 6px; font-weight:600; }
.omnibox__item{
  display:flex; align-items:center; gap:12px; width:100%;
  min-height:52px; padding:8px 12px; border:0; background:transparent;
  border-radius:var(--r-sm); text-align:left;
}
.omnibox__item:hover{ background:var(--surface-3); }
.omnibox__item strong{ font-size:14.5px; font-weight:600; display:block; }
.omnibox__item small{ color:var(--muted); font-size:12.5px; }

.topbar__actions{ display:flex; align-items:center; gap:10px; }

.icon-btn{
  width:46px; height:46px; flex:none; border-radius:var(--r);
  border:1px solid var(--border); background:var(--surface);
  display:grid; place-items:center; color:var(--navy);
  position:relative; transition:background .15s, border-color .15s;
}
.icon-btn:hover{ background:var(--surface-3); }
.icon-btn--lg{ width:48px; height:48px; }
.icon-btn--ghost{ border-color:transparent; background:transparent; }
.badge-count{
  position:absolute; top:-5px; right:-5px; min-width:21px; height:21px;
  padding:0 5px; border-radius:var(--r-pill); background:var(--danger); color:#fff;
  font-size:11.5px; font-weight:700; display:grid; place-items:center;
  border:2px solid var(--surface); font-variant-numeric:tabular-nums;
}

.userchip{
  display:flex; align-items:center; gap:10px; height:48px;
  padding:0 12px 0 8px; border-radius:var(--r);
  border:1px solid var(--border); background:var(--surface);
}
.userchip:hover{ background:var(--surface-3); }
.avatar{
  width:34px; height:34px; border-radius:10px; flex:none;
  background:var(--navy); color:#fff; display:grid; place-items:center;
  font-family:"Barlow Semi Condensed",sans-serif; font-weight:700; font-size:14.5px; letter-spacing:.5px;
}
.avatar--lg{ width:56px; height:56px; border-radius:14px; font-size:20px; }
.avatar--orange{ background:var(--orange); }
.avatar--soft{ background:var(--navy-050); color:var(--navy); }
.userchip__text{ display:flex; flex-direction:column; line-height:1.2; text-align:left; }
.userchip__text strong{ font-size:13.5px; font-weight:600; }
.userchip__text small{ font-size:11.5px; color:var(--muted); }
.userchip__caret{ color:var(--faint); display:flex; }

/* =========================================================
   4. COMPOSANTS GÉNÉRIQUES
   ========================================================= */
.card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-lg); box-shadow:var(--shadow-1);
}
.card__head{
  display:flex; align-items:center; gap:14px;
  padding:16px 18px; border-bottom:1px solid var(--border);
}
.card__head h2,.card__head h3{ font-size:17px; }
.card__head .spacer{ margin-left:auto; }
.card__body{ padding:18px; }
.card__body--flush{ padding:0; }
.card__foot{ padding:12px 18px; border-top:1px solid var(--border); background:var(--surface-2); border-radius:0 0 var(--r-lg) var(--r-lg); }

.section-title{
  display:flex; align-items:center; gap:12px; margin:0 0 14px;
}
.section-title h2{ font-size:19px; }
.section-title .spacer{ margin-left:auto; }
.eyebrow{
  font-family:"Barlow Semi Condensed",sans-serif;
  font-size:11.5px; letter-spacing:1.6px; text-transform:uppercase;
  color:var(--faint); font-weight:600;
}

/* Boutons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:9px;
  min-height:var(--tap); padding:0 18px; border-radius:var(--r);
  border:1px solid var(--border); background:var(--surface); color:var(--text);
  font-size:15px; font-weight:600; white-space:nowrap;
  transition:background .15s, border-color .15s, transform .06s;
}
.btn:active{ transform:translateY(1px); }
.btn:hover{ background:var(--surface-3); }
.btn--primary{ background:var(--navy); border-color:var(--navy); color:#fff; }
.btn--primary:hover{ background:var(--navy-600); }
.btn--accent{ background:var(--orange); border-color:var(--orange); color:#fff; }
.btn--accent:hover{ background:var(--orange-600); }
.btn--danger{ background:var(--danger); border-color:var(--danger); color:#fff; }
.btn--danger:hover{ filter:brightness(1.08); }
.btn--ghost{ background:transparent; border-color:transparent; }
.btn--ghost:hover{ background:var(--surface-3); }
.btn--sm{ min-height:40px; padding:0 14px; font-size:14px; }
.btn--block{ width:100%; }
.btn[disabled]{ opacity:.5; pointer-events:none; }

/* Segmented control (vues Jour/Semaine/Mois, Kanban/Liste) */
.segmented{
  display:inline-flex; background:var(--surface-3); border-radius:var(--r);
  padding:4px; gap:4px; border:1px solid var(--border);
}
.segmented button{
  min-height:40px; padding:0 16px; border:0; background:transparent;
  border-radius:9px; font-size:14px; font-weight:600; color:var(--muted);
  display:inline-flex; align-items:center; gap:8px;
}
.segmented button.is-active{ background:var(--surface); color:var(--navy); box-shadow:var(--shadow-1); }

/* Filtres (chips) */
.chips{ display:flex; gap:9px; flex-wrap:wrap; }
.chip{
  min-height:44px; padding:0 16px; border-radius:var(--r-pill);
  border:1px solid var(--border); background:var(--surface);
  font-size:14px; font-weight:600; color:var(--muted);
  display:inline-flex; align-items:center; gap:8px;
}
.chip:hover{ border-color:var(--border-2); }
.chip.is-active{ background:var(--navy); border-color:var(--navy); color:#fff; }
.chip__n{
  font-size:12px; padding:1px 7px; border-radius:var(--r-pill);
  background:var(--surface-3); color:var(--muted); font-variant-numeric:tabular-nums;
}
.chip.is-active .chip__n{ background:rgba(255,255,255,.22); color:#fff; }

/* Barre d'outils de page */
.toolbar{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  margin-bottom:var(--gap);
}
.toolbar .spacer{ margin-left:auto; }
.search-field{ position:relative; flex:1 1 260px; max-width:420px; }
.search-field input{
  width:100%; height:var(--tap); border-radius:var(--r);
  border:1px solid var(--border); background:var(--surface);
  padding:0 14px 0 44px; font-size:15px;
}
.search-field input:focus{ outline:none; border-color:var(--navy-600); box-shadow:0 0 0 3px var(--navy-050); }
.search-field .ico{ position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--faint); display:flex; }

/* Badges de statut */
.badge{
  display:inline-flex; align-items:center; gap:6px;
  padding:5px 11px; border-radius:var(--r-pill);
  font-size:12.5px; font-weight:700; letter-spacing:.2px; white-space:nowrap;
  background:var(--neutral-bg); color:var(--neutral);
}
.badge::before{ content:""; width:7px; height:7px; border-radius:50%; background:currentColor; }
.badge--ok{ background:var(--ok-bg); color:var(--ok); }
.badge--warn{ background:var(--warn-bg); color:var(--warn); }
.badge--danger{ background:var(--danger-bg); color:var(--danger); }
.badge--info{ background:var(--info-bg); color:var(--info); }
.badge--plain::before{ display:none; }

.tag{
  display:inline-flex; align-items:center; gap:6px; padding:4px 10px;
  border-radius:var(--r-sm); background:var(--surface-3); color:var(--muted);
  font-size:12.5px; font-weight:600;
}

/* Barres de progression */
.pbar{ height:10px; border-radius:99px; background:var(--surface-3); overflow:hidden; }
.pbar__fill{ height:100%; border-radius:99px; background:var(--navy-600); transition:width .5s cubic-bezier(.2,.7,.3,1); }
.pbar--thin{ height:7px; }
.pbar__fill--ok{ background:var(--ok); }
.pbar__fill--warn{ background:var(--warn); }
.pbar__fill--danger{ background:var(--danger); }
.pbar__fill--accent{ background:var(--orange); }
.pbar-row{ display:flex; align-items:center; gap:12px; }
.pbar-row .pbar{ flex:1; }
.pbar-row b{ font-size:14px; min-width:44px; text-align:right; font-variant-numeric:tabular-nums; }

/* Tableaux — lignes hautes, tactiles */
.table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
table.tbl{ width:100%; border-collapse:collapse; min-width:640px; }
table.tbl th{
  font-family:"Barlow Semi Condensed",sans-serif;
  text-align:left; font-size:12.5px; letter-spacing:1px; text-transform:uppercase;
  color:var(--muted); font-weight:600; padding:12px 16px;
  background:var(--surface-2); border-bottom:1px solid var(--border); white-space:nowrap;
}
table.tbl td{ padding:14px 16px; border-bottom:1px solid var(--border); font-size:14.5px; vertical-align:middle; }
table.tbl tbody tr{ min-height:60px; }
table.tbl tbody tr.is-clickable:hover{ background:var(--navy-050); cursor:pointer; }
table.tbl tbody tr:last-child td{ border-bottom:0; }
table.tbl .cell-main{ font-weight:600; color:var(--ink); }
table.tbl .cell-sub{ font-size:12.5px; color:var(--muted); }
.t-right{ text-align:right; }
.t-center{ text-align:center; }

/* Liste titre + sous-titre avec pastille */
.idcell{ display:flex; align-items:center; gap:12px; }
.idcell__txt{ min-width:0; }

/* Formulaires */
.form-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
.field{ display:flex; flex-direction:column; gap:7px; min-width:0; }
.field--full{ grid-column:1 / -1; }
.field label{ font-size:13px; font-weight:600; color:var(--muted); }
.field input,.field select,.field textarea{
  min-height:var(--tap); border-radius:var(--r); border:1px solid var(--border);
  background:var(--surface); padding:10px 14px; font-size:15px; width:100%;
}
.field select{ appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%235C7186' stroke-width='2' stroke-linecap='round'><path d='m6 9 6 6 6-6'/></svg>"); background-repeat:no-repeat; background-position:right 12px center; padding-right:40px; }
.field textarea{ min-height:96px; resize:vertical; }
.field input:focus,.field select:focus,.field textarea:focus{ outline:none; border-color:var(--navy-600); box-shadow:0 0 0 3px var(--navy-050); }
.field__hint{ font-size:12px; color:var(--faint); }
.field.has-error input,.field.has-error select{ border-color:var(--danger); }
.field__err{ font-size:12.5px; color:var(--danger); font-weight:600; }

/* Modales */
.modal-scrim{
  position:fixed; inset:0; background:rgba(14,34,51,.5); backdrop-filter:blur(3px);
  z-index:100; display:flex; align-items:center; justify-content:center; padding:24px;
  animation:fade .18s ease-out;
}
.modal{
  background:var(--surface); border-radius:18px; box-shadow:var(--shadow-3);
  width:min(760px,100%); max-height:min(88dvh,900px); display:flex; flex-direction:column;
  animation:pop .22s cubic-bezier(.2,.8,.3,1);
}
.modal--wide{ width:min(1040px,100%); }
.modal--sm{ width:min(520px,100%); }
.modal__head{
  display:flex; align-items:center; gap:14px; padding:18px 20px;
  border-bottom:1px solid var(--border);
}
.modal__head h2{ font-size:20px; }
.modal__head .sub{ font-size:13px; color:var(--muted); margin-top:2px; }
.modal__body{ padding:20px; overflow-y:auto; }
.modal__foot{
  padding:14px 20px; border-top:1px solid var(--border);
  display:flex; gap:12px; justify-content:flex-end; background:var(--surface-2);
  border-radius:0 0 18px 18px; flex-wrap:wrap;
}
@keyframes fade{ from{ opacity:0 } }
@keyframes pop{ from{ opacity:0; transform:translateY(14px) scale(.98) } }

/* Popover (notifications, menu profil) */
.popover{
  position:fixed; z-index:90; background:var(--surface);
  border:1px solid var(--border); border-radius:var(--r-lg);

/* =========================================================

.pick{ border:1px solid var(--border); border-radius:var(--r); background:var(--surface-2); padding:14px; }

.pick__meta{ font-size:12.5px; color:var(--muted); margin-top:2px; }

.pick__empty{ padding:22px; text-align:center; color:var(--muted); font-size:13.5px; }

.att-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; }
.att{
  border:1px solid var(--border); border-radius:var(--r); background:var(--surface);

}
.att__thumb{
  height:118px; background:var(--surface-3); display:grid; place-items:center;

}

.att__thumb--plan{ background:var(--navy-050); color:var(--navy-600); }
.att__thumb--photo{ background:var(--orange-050); color:var(--orange-600); }
.att__body{ padding:11px 12px; flex:1; }
.att__name{ font-size:13.5px; font-weight:600; line-height:1.3; word-break:break-word; }
.att__meta{ font-size:12px; color:var(--muted); margin-top:5px; }
.att__foot{ display:flex; gap:8px; padding:0 12px 12px; }
.att__kind{
  position:absolute; top:8px; left:8px; background:rgba(14,34,51,.78); color:#fff;
  font-size:11px; font-weight:700; letter-spacing:.6px; text-transform:uppercase;
  padding:3px 8px; border-radius:var(--r-pill);

.capture-row{ display:flex; gap:10px; flex-wrap:wrap; }

@media (max-width:1080px){

  font:inherit; font-size:14px; color:var(--ink);
}
.input--flat:hover{ border-color:var(--border); }
.input--flat:focus{ outline:none; background:#fff; border-color:var(--navy-600); box-shadow:0 0 0 3px var(--navy-050); }
.money--sm{ font-size:19px; color:var(--orange); }

/* =========================================================
   FOURNISSEURS
   ========================================================= */
.sup-contact{
  display:flex; flex-wrap:wrap; gap:8px 18px; margin:12px 0 2px;
  font-size:13.5px; color:var(--text-2);
}
.sup-contact span{ display:inline-flex; align-items:center; gap:6px; }
.sup-contact svg{ color:var(--faint); }

.sup-featured{
  margin:12px 0 2px; padding:11px 12px;
  background:var(--orange-050); border:1px solid #F3CDB2; border-radius:var(--r);
}
.sup-featured .eyebrow{ display:flex; align-items:center; gap:5px; color:var(--orange-600); }
.sup-featured__row{
  display:flex; align-items:center; gap:9px; font-size:13.5px;
  padding:3px 0; color:var(--ink);
}
.sup-featured__row span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sup-dot{ width:8px; height:8px; border-radius:50%; flex:none; background:var(--ok); }
.sup-dot--faible{ background:var(--warn); }
.sup-dot--rupture{ background:var(--danger); }

/* Évaluation en étoiles */
.rating{ display:inline-flex; align-items:center; gap:2px; }
.rating i{ display:inline-flex; color:var(--border-2); }
.rating i.is-on{ color:var(--orange); }
.rating i.is-on svg{ fill:currentColor; }
.rating b{ margin-left:6px; font-size:13px; color:var(--text-2); }

   ========================================================= */

          projectId: w.projectId, in: null, out: null, breakMin: 0, hours: 0,
          status: 'absent', note: ABSENCE_REASONS[absentIdx.size % 5] || 'Absence non justifiée'
        };
      }
      const inMin = 7 * 60 + Math.round(rnd() * 30 - 10);               // 06:50 → 07:20
      const outMin = 15 * 60 + 50 + Math.round(rnd() * 30);             // 15:50 → 16:20
      const breakMin = 75 + Math.round(rnd() * 3) * 5;                  // 75 → 90 min (déjeuner)
      return {
        id: `PTG-${date}-${w.id}`, date, workerId: w.id, worker: w.name, trade: w.trade,
        projectId: w.projectId,
        in: inMin, out: outMin, breakMin,
        hours: (outMin - inMin - breakMin) / 60,
        status: inMin > 7 * 60 + 15 ? 'retard' : 'present',
        note: inMin > 7 * 60 + 15 ? 'Arrivée tardive' : ''
      };
    });

    // Calage sur le total attendu, réparti sur l'ensemble des présents
    if (targetHours) {
      const present = rows.filter(r => r.status !== 'absent');
      const sum = present.reduce((s, r) => s + r.hours, 0);
      const perWorker = Math.round((targetHours - sum) * 60 / present.length);
      present.forEach(r => {
        r.out += perWorker;
        r.hours = (r.out - r.in - r.breakMin) / 60;
      });
      const last = present[present.length - 1];
      const rest = targetHours - present.reduce((s, r) => s + r.hours, 0);
      last.out += Math.round(rest * 60);
      last.hours = (last.out - last.in - last.breakMin) / 60;
    }
    return rows;
  }

  const timesheetCache = {};
  function timesheets(date) {

     ========================================================= */

  const PERSIST_KEYS = [
    'user', 'clients', 'projects', 'workers', 'articles', 'tasks',
    'expenses', 'notifications', 'activity', 'taskCatalog',
    'attachments', 'quotes', 'projectMaterials', 'suppliers'
  ];

  function serializeDB() {
    const snapshot = {};
    PERSIST_KEYS.forEach(k => {
      if (ERP.DB[k] !== undefined) snapshot[k] = ERP.DB[k];
    });
    // Cache des pointages (objets mutables générés à la volée)
    snapshot._timesheetCache = {};
    Object.keys(timesheetCache).forEach(date => {
      snapshot._timesheetCache[date] = timesheetCache[date];
    });
    snapshot.today = ERP.DB.today;
    return snapshot;
  }

  function saveDB() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(serializeDB()));
    } catch (e) {
      console.warn('[BâtiPilot] Impossible d\'enregistrer les données', e);
    }
  }

  function loadDB() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      const snapshot = JSON.parse(raw);
      if (!snapshot || typeof snapshot !== 'object') return false;

      PERSIST_KEYS.forEach(k => {
        if (snapshot[k] !== undefined) ERP.DB[k] = snapshot[k];
      });
      if (snapshot.today) ERP.DB.today = snapshot.today;

      // Restaurer le cache des pointages
      if (snapshot._timesheetCache) {
        Object.keys(timesheetCache).forEach(k => delete timesheetCache[k]);
        Object.assign(timesheetCache, snapshot._timesheetCache);
      }

      // Recalculer le nombre d'ouvriers planifiés aujourd'hui
      const RUNNING = ['PRJ-001', 'PRJ-002', 'PRJ-003', 'PRJ-004', 'PRJ-006', 'PRJ-007'];
      ERP.DB.scheduledToday = (ERP.DB.workers || []).filter(w => RUNNING.includes(w.projectId)).length;

      console.info('%cBâtiPilot', 'font:600 14px Barlow Semi Condensed;color:#E4651A',
        '— données restaurées depuis localStorage');
      return true;
    } catch (e) {
      console.warn('[BâtiPilot] Impossible de restaurer les données', e);
      return false;
    }
  }

  function clearDB() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
  }

  // Exposer pour l'API et les paramètres
  ERP.DB.save = saveDB;
  ERP.DB.load = loadDB;
  ERP.DB.clear = clearDB;
  ERP.DB._storageKey = STORAGE_KEY;

  // Restauration automatique au démarrage
  loadDB();
})(window.ERP);

</script>
<script>
/* ===== js/api.js ===== */
/* =========================================================
   BâtiPilot — Couche d'accès aux données
   ---------------------------------------------------------
   Toutes les pages passent par ERP.Api et n'accèdent JAMAIS
   directement à ERP.DB. Pour brancher un vrai backend :
       ERP.Api.config.mode    = 'http';
       ERP.Api.config.baseUrl = 'https://api.monerp.tn/v1';
       ERP.Api.config.token   = '<jwt>';
   Les signatures des méthodes ne changent pas.
   ========================================================= */
window.ERP = window.ERP || {};

(function (ERP) {
  'use strict';

  const DB = ERP.DB;
  const dt = ERP.dt;

  const config = {
    mode: 'mock',                 // 'mock' | 'http' — mock = localStorage
    baseUrl: '/api/v1',
    token: null,
    latency: 90                   // simule le réseau : ressenti réaliste
  };

  /** Force le stockage navigateur (ignore le serveur JSON). */
  function useLocalStorage() {
    config.mode = 'mock';
    config.token = null;
    try { localStorage.removeItem('batipilot-api'); } catch (_) {}
  }

  const wait = (ms) => new Promise(r => setTimeout(r, ms));
  const clone = (v) => JSON.parse(JSON.stringify(v));

  /** Persiste l'état courant dans localStorage (démo / tests). */
  function persist() {
    if (ERP.DB && typeof ERP.DB.save === 'function') ERP.DB.save();
  }

  /* --- Point d'entrée unique : à remplacer par fetch() côté HTTP --- */
  async function request(resource, { method = 'GET', params = null, body = null } = {}) {
    if (config.mode === 'http') {
      // baseUrl absolue (http://localhost:3001/api/v1) ou relative
      const base = config.baseUrl.replace(/\/$/, '');
      let url;
      if (/^https?:\/\//i.test(base)) {
        url = new URL(base + resource);
      } else {
        url = new URL(base + resource, location.origin);
      }
      if (params) Object.entries(params).forEach(([k, v]) => v != null && url.searchParams.set(k, v));
      const res = await fetch(url.toString(), {
        method,
        headers: {
          'Content-Type': 'application/json',
          ...(config.token ? { Authorization: 'Bearer ' + config.token } : {})
        },
        body: body ? JSON.stringify(body) : undefined
      });
      if (!res.ok) {
        let detail = res.statusText;
        try { const j = await res.json(); if (j && j.error) detail = j.error; } catch (_) {}
        throw new Error(`${res.status} ${detail}`);
      }
      if (res.status === 204) return null;
      const ct = res.headers.get('content-type') || '';
      return ct.includes('json') ? res.json() : null;
    }
    await wait(config.latency);
    return mock(resource, method, params, body);
  }

  /* =======================================================
     Sélecteurs / calculs métier
     ======================================================= */
  const byId = (arr, id) => arr.find(x => x.id === id) || null;

  const isLate = (t) => t.status !== 'termine' && t.due < DB.today;

  function decorateProject(p) {
    const client = byId(DB.clients, p.clientId);
    const team = DB.workers.filter(w => w.projectId === p.id);
    const ts = DB.timesheets(DB.today).filter(t => t.projectId === p.id);
    const present = ts.filter(t => t.status !== 'absent');
    const pTasks = DB.tasks.filter(t => t.projectId === p.id);
    const late = p.phases.filter(ph => ph.progress < 100 && ph.end < DB.today);
    const daysLate = late.length ? Math.max(...late.map(ph => dt.diff(ph.end, DB.today))) : 0;
    return Object.assign({}, p, {
      clientName: client ? client.company : '—',
      clientContact: client ? client.contact : '—',
      teamSize: team.length,
      presentToday: present.length,
      hoursToday: present.reduce((s, t) => s + t.hours, 0),
      remaining: p.budget - p.spent,
      burn: p.budget ? Math.round(p.spent / p.budget * 100) : 0,
      tasksTotal: pTasks.length,
      tasksLate: pTasks.filter(isLate).length,
      tasksDone: pTasks.filter(t => t.status === 'termine').length,
      daysLate,
      latePhases: late.map(ph => ph.name),
      materialsCount: DB.projectMaterials.filter(m => m.projectId === p.id).length,
      materialsCost: DB.projectMaterials.filter(m => m.projectId === p.id)
        .reduce((s, m) => { const a = byId(DB.articles, m.articleId); return s + (a ? m.qty * a.price : 0); }, 0)
    });
  }

  /** Une affectation enrichie des informations de l'article (libellé, unité, prix, stock). */
  function decorateMaterial(m) {
    const a = byId(DB.articles, m.articleId);
    const p = byId(DB.projects, m.projectId);
    return Object.assign({}, m, {
      name: a ? a.name : '—', ref: a ? a.ref : '—', unit: a ? a.unit : '',
      category: a ? a.category : '—', price: a ? a.price : 0,
      total: a ? m.qty * a.price : 0,
      stock: a ? a.stock : 0, min: a ? a.min : 0,
      stockStatus: a ? a.stockStatus : 'ok',
      supplier: a ? a.supplier : '—',
      projectName: p ? p.name : '—'
    });
  }

  /** Mouvement de stock : met à jour la quantité et recalcule le statut. */
  function moveStock(article, delta) {
    article.stock = Math.max(0, article.stock + delta);
    article.stockStatus = article.stock === 0 ? 'rupture'
      : (article.stock < article.min ? 'faible' : 'ok');
    if (delta > 0) article.lastEntry = DB.today;
  }

  /** Impute (ou décharge) un montant sur le poste Matériaux du chantier. */
  function chargeProject(projectId, amount) {
    const p = byId(DB.projects, projectId);
    if (!p) return;
    p.spent = Math.max(0, Math.round(p.spent + amount));
    const key = `DEP-${projectId}-materiaux`;
    const line = DB.expenses.find(e => e.id === key);
    if (line) line.amount = Math.max(0, Math.round(line.amount + amount));
    else DB.expenses.push({
      id: key, projectId, category: 'materiaux', label: 'Matériaux',
      amount: Math.max(0, Math.round(amount))
    });
  }

  /** Un fournisseur enrichi de son activité : références, alertes, achats. */
  function decorateSupplier(s) {
    const arts = DB.articles.filter(a => a.supplierId === s.id);
    const moves = DB.projectMaterials.filter(m => {
      const a = byId(DB.articles, m.articleId);
      return a && a.supplierId === s.id;
    });
    const purchases = moves.reduce((sum, m) => {
      const a = byId(DB.articles, m.articleId);
      return sum + (a ? m.qty * a.price : 0);
    }, 0);
    const lastMove = moves.length ? moves.slice().sort((x, y) => y.date.localeCompare(x.date))[0].date : null;
    return Object.assign({}, s, {
      articleCount: arts.length,
      featuredCount: s.featured.length,
      alerts: arts.filter(a => a.stockStatus !== 'ok').length,
      ruptures: arts.filter(a => a.stockStatus === 'rupture').length,
      stockValue: arts.reduce((sum, a) => sum + a.stock * a.price, 0),
      purchases,
      lastMove,
      projectCount: new Set(moves.map(m => m.projectId)).size
    });
  }

  function decorateClient(c) {
    const ps = DB.projects.filter(p => p.clientId === c.id);
    return Object.assign({}, c, {
      projectCount: ps.length,
      totalAmount: ps.reduce((s, p) => s + p.budget, 0),
      openCount: ps.filter(p => p.status !== 'termine').length,
      lastProject: ps.length ? ps.slice().sort((a, b) => b.start.localeCompare(a.start))[0].name : '—'
    });
  }

  function decorateWorker(w) {
    const p = byId(DB.projects, w.projectId);
    const entry = DB.timesheets(DB.today).find(t => t.workerId === w.id) || null;
    // 30 derniers jours ouvrés simulés pour la fiche ouvrier
    let month = 0;
    for (let i = 0; i < 30; i++) {
      const d = dt.add(DB.today, -i);
      if (dt.isWeekend(d)) continue;
      const e = DB.timesheets(d).find(t => t.workerId === w.id);
      if (e) month += e.hours;
    }
    return Object.assign({}, w, {
      projectName: p ? p.name : 'Non affecté',
      todayStatus: entry ? entry.status : 'non_planifie',
      todayEntry: entry,
      monthHours: Math.round(month),
      monthCost: Math.round(month * w.rate)
    });
  }

  /* =======================================================
     Adaptateur « mock »
     ======================================================= */
  function mock(resource, method, params, body) {
    const p = params || {};

    /* ---- Tableau de bord ---- */
    if (resource === '/dashboard/kpis') {
      const active = DB.projects.filter(x => x.status !== 'termine');
      const done = DB.projects.filter(x => x.status === 'termine');
      const ts = DB.timesheets(DB.today);
      const present = ts.filter(t => t.status !== 'absent');
      const budget = active.reduce((s, x) => s + x.budget, 0);
      const spent = active.reduce((s, x) => s + x.spent, 0);
      return {
        activeProjects: active.length,
        doneProjects: done.length,
        scheduled: ts.length,
        present: present.length,
        absent: ts.length - present.length,
        hoursToday: present.reduce((s, t) => s + t.hours, 0),
        lateTasks: DB.tasks.filter(isLate).length,
        lateProjects: active.filter(x => x.status === 'en_retard').length,
        budget, spent, remaining: budget - spent,
        burn: Math.round(spent / budget * 100)
      };
    }
    if (resource === '/dashboard/activity') return clone(DB.activity);

    /* ---- Projets ---- */
    if (resource === '/projects') {
      let list = DB.projects.map(decorateProject);
      if (p.status && p.status !== 'tous') list = list.filter(x => x.status === p.status);
      if (p.q) {
        const q = p.q.toLowerCase();
        list = list.filter(x => (x.name + x.clientName + x.city + x.address + x.ref).toLowerCase().includes(q));
      }
      return list;
    }
    if (resource.startsWith('/projects/')) {
      const found = byId(DB.projects, resource.split('/')[2]);
      return found ? decorateProject(found) : null;
    }

    /* ---- Clients ---- */
    if (resource === '/clients') {
      let list = DB.clients.map(decorateClient);
      if (p.status && p.status !== 'tous') list = list.filter(x => x.status === p.status);
      if (p.q) {
        const q = p.q.toLowerCase();
        list = list.filter(x => (x.company + x.contact + x.city + x.email).toLowerCase().includes(q));
      }
      return list;
    }
    if (resource.startsWith('/clients/')) {
      const id = resource.split('/')[2];
      const c = byId(DB.clients, id);
      if (!c) return null;
      return Object.assign(decorateClient(c), {
        projects: DB.projects.filter(x => x.clientId === id).map(decorateProject),
        quotes: DB.quotes.filter(q => q.clientId === id),
        history: DB.quotes.filter(q => q.clientId === id).map(q => ({
          type: 'Devis', tone: q.status === 'accepte' ? 'ok' : 'info', ref: q.id,
          date: q.date, amount: q.total, quoteId: q.id,
          note: q.title + (q.projectId ? ' — converti en projet' : '')
        })).concat(DB.clientHistory(id))
          .sort((a, b) => b.date.localeCompare(a.date))
      });
    }

    /* ---- Ouvriers ---- */
    if (resource === '/workers') {
      let list = DB.workers.map(decorateWorker);
      if (p.projectId && p.projectId !== 'tous') list = list.filter(x => x.projectId === p.projectId);
      if (p.trade && p.trade !== 'tous') list = list.filter(x => x.trade === p.trade);
      if (p.q) {
        const q = p.q.toLowerCase();
        list = list.filter(x => (x.name + x.trade + x.matricule).toLowerCase().includes(q));
      }
      return list;
    }
    if (resource.startsWith('/workers/')) {
      const w = byId(DB.workers, resource.split('/')[2]);
      return w ? decorateWorker(w) : null;
    }

    /* ---- Pointage ---- */
    if (resource === '/timesheets') {
      const date = p.date || DB.today;
      let rows = DB.timesheets(date).map(r => Object.assign({}, r, {
        projectName: (byId(DB.projects, r.projectId) || {}).name || '—'
      }));
      if (p.projectId && p.projectId !== 'tous') rows = rows.filter(r => r.projectId === p.projectId);
      if (p.trade && p.trade !== 'tous') rows = rows.filter(r => r.trade === p.trade);
      if (p.status && p.status !== 'tous') rows = rows.filter(r => r.status === p.status);
      if (p.q) rows = rows.filter(r => r.worker.toLowerCase().includes(p.q.toLowerCase()));
      return rows;
    }
    if (resource === '/timesheets/summary') {
      const rows = DB.timesheets(p.date || DB.today);
      const present = rows.filter(r => r.status !== 'absent');
      return {
        date: p.date || DB.today,
        scheduled: rows.length,
        present: present.length,
        absent: rows.filter(r => r.status === 'absent').length,
        late: rows.filter(r => r.status === 'retard').length,
        hours: present.reduce((s, r) => s + r.hours, 0),
        cost: Math.round(present.reduce((s, r) => {
          const w = byId(DB.workers, r.workerId);
          return s + r.hours * (w ? w.rate : 15);
        }, 0))
      };
    }
    if (resource === '/timesheets' && method === 'POST') return body;

    /* ---- Articles ---- */
    if (resource === '/articles') {
      let list = clone(DB.articles);
      if (p.category && p.category !== 'tous') list = list.filter(a => a.category === p.category);
      if (p.stockStatus && p.stockStatus !== 'tous') list = list.filter(a => a.stockStatus === p.stockStatus);
      if (p.q) {
        const q = p.q.toLowerCase();
        list = list.filter(a => (a.name + a.ref + a.supplier + a.category).toLowerCase().includes(q));
      }
      return list;
    }
    if (resource.startsWith('/articles/')) return clone(byId(DB.articles, resource.split('/')[2]));

    /* ---- Tâches ---- */
    if (resource === '/tasks') {
      let list = DB.tasks.map(t => Object.assign({}, t, {
        projectName: (byId(DB.projects, t.projectId) || {}).name || '—',
        late: isLate(t)
      }));
      if (p.projectId && p.projectId !== 'tous') list = list.filter(t => t.projectId === p.projectId);
      if (p.status && p.status !== 'tous') list = list.filter(t => t.status === p.status);
      if (p.priority && p.priority !== 'tous') list = list.filter(t => t.priority === p.priority);
      if (p.q) list = list.filter(t => (t.title + t.assignee).toLowerCase().includes(p.q.toLowerCase()));
      return list;
    }

    /* ---- Budget ---- */
    if (resource === '/budget/summary') {
      const active = DB.projects.filter(x => x.status !== 'termine');
      const budget = active.reduce((s, x) => s + x.budget, 0);
      const spent = active.reduce((s, x) => s + x.spent, 0);
      return { budget, spent, remaining: budget - spent, burn: Math.round(spent / budget * 100) };
    }
    if (resource === '/budget/categories') {
      return DB.costCategories.map(c => ({
        key: c.key, label: c.label, color: c.color,
        amount: DB.expenses.filter(e => e.category === c.key && (!p.projectId || p.projectId === 'tous' || e.projectId === p.projectId))
          .reduce((s, e) => s + e.amount, 0)
      })).sort((a, b) => b.amount - a.amount);
    }
    if (resource === '/budget/projects') {
      return DB.projects.filter(x => x.status !== 'termine').map(decorateProject);
    }

    /* ---- Planning ---- */
    if (resource === '/planning') {
      const list = DB.projects.filter(x => x.status !== 'termine');
      if (p.projectId && p.projectId !== 'tous') {
        const pr = byId(DB.projects, p.projectId);
        if (!pr) return [];
        return pr.phases.map((ph, i) => ({
          id: pr.id + '-P' + i, label: ph.name, sub: ph.lead,
          start: ph.start, end: ph.end, progress: ph.progress,
          status: ph.progress === 100 ? 'termine' : (ph.end < DB.today ? 'en_retard' : (ph.progress > 0 ? 'en_cours' : 'en_preparation')),
          projectId: pr.id
        }));
      }
      return list.map(pr => ({
        id: pr.id, label: pr.name, sub: (byId(DB.clients, pr.clientId) || {}).company || '',
        start: pr.start, end: pr.end, progress: pr.progress, status: pr.status, projectId: pr.id
      }));
    }

    /* ---- Rapports ---- */
    if (resource === '/reports/attendance') {
      const days = [];
      for (let i = 13; i >= 0; i--) {
        const d = dt.add(DB.today, -i);
        if (dt.isWeekend(d)) continue;
        const rows = DB.timesheets(d);
        const present = rows.filter(r => r.status !== 'absent');
        days.push({
          date: d,
          present: present.length,
          absent: rows.length - present.length,
          hours: Math.round(present.reduce((s, r) => s + r.hours, 0)),
          planned: rows.length * 8
        });
      }
      return days;
    }
    if (resource === '/reports/trades') {
      const rows = DB.timesheets(DB.today).filter(r => r.status !== 'absent');
      const map = {};
      rows.forEach(r => { map[r.trade] = (map[r.trade] || 0) + r.hours; });
      return Object.entries(map).map(([label, value]) => ({ label, value: Math.round(value) }))
        .sort((a, b) => b.value - a.value);
    }

    /* ---- Notifications ---- */
    if (resource === '/notifications') return clone(DB.notifications);

    /* ---- Recherche globale ---- */
    if (resource === '/search') {
      const q = (p.q || '').toLowerCase().trim();
      if (q.length < 2) return [];
      const out = [];
      DB.projects.filter(x => (x.name + x.ref).toLowerCase().includes(q)).slice(0, 4)
        .forEach(x => out.push({ group: 'Projets', label: x.name, sub: x.ref + ' · ' + x.city, href: '#/projets/' + x.id, icon: 'building' }));
      DB.clients.filter(x => (x.company + x.contact).toLowerCase().includes(q)).slice(0, 4)
        .forEach(x => out.push({ group: 'Clients', label: x.company, sub: x.contact, href: '#/clients/' + x.id, icon: 'users' }));
      DB.workers.filter(x => x.name.toLowerCase().includes(q)).slice(0, 4)
        .forEach(x => out.push({ group: 'Ouvriers', label: x.name, sub: x.trade, href: '#/pointage/' + x.id, icon: 'hardhat' }));
      DB.articles.filter(x => (x.name + x.ref).toLowerCase().includes(q)).slice(0, 4)
        .forEach(x => out.push({ group: 'Articles', label: x.name, sub: x.ref + ' · ' + x.category, href: '#/articles/' + x.id, icon: 'package' }));
      DB.suppliers.filter(x => (x.company + x.contact + x.specialty + x.city).toLowerCase().includes(q)).slice(0, 4)
        .forEach(x => out.push({ group: 'Fournisseurs', label: x.company, sub: x.specialty + ' · ' + x.city, href: '#/fournisseurs/' + x.id, icon: 'truck' }));
      DB.tasks.filter(x => x.title.toLowerCase().includes(q)).slice(0, 3)
        .forEach(x => out.push({ group: 'Tâches', label: x.title, sub: x.assignee, href: '#/taches', icon: 'check' }));
      return out;
    }

    throw new Error('Ressource inconnue : ' + resource);
  }

  /* =======================================================
     API publique
     ======================================================= */
  ERP.Api = {
    config,
    request,
    useLocalStorage,

    dashboard: {
      kpis: () => request('/dashboard/kpis'),
      activity: () => request('/dashboard/activity')
    },
    projects: {
      list: (params) => request('/projects', { params }),
      get: (id) => request('/projects/' + id),
      create: (p) => {
        if (config.mode === 'http') return request('/projects', { method: 'POST', body: p });
        const n = ERP.DB.projects.length + 1;
        const picked = p.tasks || [];
        const item = Object.assign({
          id: 'PRJ-' + String(n).padStart(3, '0'),
          ref: 'CHT-' + ERP.DB.today.slice(0, 4) + '-' + String(n).padStart(3, '0'),
          spent: 0, progress: 0, status: 'en_preparation'
        }, p);
        delete item.tasks;

        // Chaque tâche choisie devient une tâche du chantier ET un lot du planning
        item.phases = picked.map((t, i) => {
          const taskId = 'TSK-' + String(ERP.DB.tasks.length + i + 1).padStart(3, '0');
          return { taskId, name: t.name, start: t.start, end: t.end, progress: 0, lead: t.assignee || item.manager };
        });
        ERP.DB.projects.unshift(item);
        picked.forEach((t, i) => {
          ERP.DB.tasks.push({
            id: item.phases[i].taskId, title: t.name, projectId: item.id,
            assignee: t.assignee || item.manager, priority: t.priority || 'moyenne',
            start: t.start, due: t.end, progress: 0, status: 'a_faire', createdAt: ERP.DB.today
          });
        });
        persist();
        return Promise.resolve(item);
      },
      update: (id, patch) => {
        if (config.mode === 'http') return request('/projects/' + id, { method: 'PATCH', body: patch });
        const p = ERP.DB.projects.find(x => x.id === id);
        if (p) Object.assign(p, patch);
        persist();
        return Promise.resolve(p);
      },
      remove: (id) => {
        if (config.mode === 'http') return request('/projects/' + id, { method: 'DELETE' });
        const i = ERP.DB.projects.findIndex(x => x.id === id);
        if (i > -1) ERP.DB.projects.splice(i, 1);
        ERP.DB.tasks = ERP.DB.tasks.filter(t => t.projectId !== id);
        ERP.DB.projectMaterials = ERP.DB.projectMaterials.filter(m => m.projectId !== id);
        persist();
        return Promise.resolve(true);
      }
    },

    /* Matériaux affectés à un chantier — le stock suit chaque mouvement */
    materials: {
      list: (params = {}) => {
        if (config.mode === 'http') return request('/materials', { params });
        let list = ERP.DB.projectMaterials.slice();
        if (params.projectId && params.projectId !== 'tous') list = list.filter(m => m.projectId === params.projectId);
        if (params.articleId) list = list.filter(m => m.articleId === params.articleId);
        return Promise.resolve(list.map(decorateMaterial)
          .sort((a, b) => b.date.localeCompare(a.date)));
      },
      create: (m) => {
        if (config.mode === 'http') return request('/materials', { method: 'POST', body: m });
        const a = byId(ERP.DB.articles, m.articleId);
        if (!a) return Promise.reject(new Error('Article introuvable'));
        if (m.qty > a.stock) return Promise.reject(new Error('stock_insuffisant'));
        const item = Object.assign({
          id: 'AFF-' + Date.now().toString(36).toUpperCase(),
          date: ERP.DB.today, author: ERP.DB.user.name, note: ''
        }, m);
        ERP.DB.projectMaterials.push(item);
        moveStock(a, -item.qty);
        chargeProject(item.projectId, item.qty * a.price);
        persist();
        return Promise.resolve(decorateMaterial(item));
      },
      update: (id, patch) => {
        if (config.mode === 'http') return request('/materials/' + id, { method: 'PATCH', body: patch });
        const item = ERP.DB.projectMaterials.find(x => x.id === id);
        if (!item) return Promise.resolve(null);
        const a = byId(ERP.DB.articles, item.articleId);
        if (patch.qty != null && a) {
          const delta = patch.qty - item.qty;
          if (delta > a.stock) return Promise.reject(new Error('stock_insuffisant'));
          moveStock(a, -delta);
          chargeProject(item.projectId, delta * a.price);
        }
        Object.assign(item, patch);
        persist();
        return Promise.resolve(decorateMaterial(item));
      },
      remove: (id) => {
        if (config.mode === 'http') return request('/materials/' + id, { method: 'DELETE' });
        const i = ERP.DB.projectMaterials.findIndex(x => x.id === id);
        if (i > -1) {
          const item = ERP.DB.projectMaterials[i];
          const a = byId(ERP.DB.articles, item.articleId);
          if (a) { moveStock(a, item.qty); chargeProject(item.projectId, -item.qty * a.price); }
          ERP.DB.projectMaterials.splice(i, 1);
        }
        persist();
        return Promise.resolve(true);
      }
    },

    /* Fournisseurs de matériaux */
    suppliers: {
      list: (params = {}) => {
        if (config.mode === 'http') return request('/suppliers', { params });
        let list = ERP.DB.suppliers.map(decorateSupplier);
        if (params.status && params.status !== 'tous') list = list.filter(s => s.status === params.status);
        if (params.city && params.city !== 'tous') list = list.filter(s => s.city === params.city);
        if (params.q) {
          const q = params.q.toLowerCase();
          list = list.filter(s => (s.company + s.contact + s.city + s.specialty).toLowerCase().includes(q));
        }
        return Promise.resolve(list);
      },
      get: (id) => {
        if (config.mode === 'http') return request('/suppliers/' + id);
        const s = byId(ERP.DB.suppliers, id);
        if (!s) return Promise.resolve(null);
        return Promise.resolve(Object.assign(decorateSupplier(s), {
          articles: DB.articles.filter(a => a.supplierId === id)

        if (config.mode === 'http') return request('/timesheets', { method: 'POST', body: entry });
        // Écriture simulée : la ligne est injectée dans le jeu de données en mémoire.
        const rows = ERP.DB.timesheets(entry.date);
        const worker = ERP.DB.workers.find(w => w.id === entry.workerId);
        const hours = Math.max(0, (entry.out - entry.in - entry.breakMin) / 60);
        const existing = rows.find(r => r.workerId === entry.workerId);
        const row = {
          id: 'PTG-' + entry.date + '-' + entry.workerId, date: entry.date,
          workerId: entry.workerId, worker: worker ? worker.name : '—',
          trade: worker ? worker.trade : '—', projectId: entry.projectId,
          in: entry.in, out: entry.out, breakMin: entry.breakMin, hours,
          status: entry.status || (entry.in > 435 ? 'retard' : 'present'),
          note: entry.note || ''
        };
        if (existing) Object.assign(existing, row); else rows.push(row);
        persist();
        return Promise.resolve(row);

      update: (id, patch) => {
        if (config.mode === 'http') return request('/timesheets/' + id, { method: 'PATCH', body: patch });
        // Chercher dans le cache des pointages
        const cache = {}; // fallback: scan via timesheets of recent days
        for (let i = 0; i < 30; i++) {
          const d = ERP.dt.add(ERP.DB.today, -i);
          const rows = ERP.DB.timesheets(d);
          const row = rows.find(r => r.id === id);
          if (row) {
            Object.assign(row, patch);
            if (patch.in != null || patch.out != null || patch.breakMin != null) {
              row.hours = Math.max(0, (row.out - row.in - (row.breakMin || 0)) / 60);
            }
            persist();
            return Promise.resolve(row);
          }
        }
        return Promise.resolve(null);

        if (config.mode === 'http') return request('/timesheets/' + id, { method: 'DELETE' });

          const d = ERP.dt.add(ERP.DB.today, -i);
          const rows = ERP.DB.timesheets(d);
          const idx = rows.findIndex(r => r.id === id);
          if (idx > -1) {
            rows.splice(idx, 1);
            persist();
            return Promise.resolve(true);
          }
        }
        return Promise.resolve(false);
      }

          id: 'TSK-' + String(ERP.DB.tasks.length + 1).padStart(3, '0'),

        const t = ERP.DB.tasks.find(x => x.id === id);
        if (t) {
          Object.assign(t, patch);
          // Le lot correspondant du planning suit la tâche (dates et avancement)
          const p = ERP.DB.projects.find(x => x.id === t.projectId);
          const phase = p && (p.phases || []).find(ph => ph.taskId === id);
          if (phase) {
            phase.name = t.title; phase.start = t.start; phase.end = t.due;
            phase.progress = t.progress; phase.lead = t.assignee;
          }
        }
        persist();
        return Promise.resolve(t);
      },
      remove: (id) => {
        if (config.mode === 'http') return request('/tasks/' + id, { method: 'DELETE' });
        const t = ERP.DB.tasks.find(x => x.id === id);
        if (t) {
          const p = ERP.DB.projects.find(x => x.id === t.projectId);
          if (p && p.phases) {
            const i = p.phases.findIndex(ph => ph.taskId === id);
            if (i > -1) p.phases.splice(i, 1);
          }
        }
        const i = ERP.DB.tasks.findIndex(x => x.id === id);
        if (i > -1) ERP.DB.tasks.splice(i, 1);
        persist();
        return Promise.resolve(true);
      }
    },
    budget: {
      summary: () => request('/budget/summary'),
      categories: (params) => request('/budget/categories', { params }),
      projects: () => request('/budget/projects')

        persist();
        return Promise.resolve(true);
      }
    },
    search: (q) => request('/search', { params: { q } }),

    admin: {

      }
    }
  };
})(window.ERP);

    image: '<rect x="3.2" y="4.6" width="17.6" height="14.8" rx="2.2"/><circle cx="8.6" cy="10" r="1.6"/><path d="m4.4 17.6 4.8-4.6 3.4 3.2 2.8-2.4 4.2 3.8"/>',
    upload: '<path d="M12 19.4V8"/><path d="m8 11.6 4-4 4 4"/><path d="M4.4 4.6h15.2"/>',
    printer: '<path d="M7 9V4h10v5"/><rect x="3.6" y="9" width="16.8" height="7.4" rx="2"/><path d="M7 14h10v6H7z"/>',
    grip: '<circle cx="9" cy="6" r="1.3"/><circle cx="15" cy="6" r="1.3"/><circle cx="9" cy="12" r="1.3"/><circle cx="15" cy="12" r="1.3"/><circle cx="9" cy="18" r="1.3"/><circle cx="15" cy="18" r="1.3"/>',
    kanban: '<rect x="3.4" y="4" width="5" height="16" rx="1.6"/><rect x="9.5" y="4" width="5" height="11" rx="1.6"/><rect x="15.6" y="4" width="5" height="14" rx="1.6"/>',
    list: '<path d="M8 6.5h12M8 12h12M8 17.5h12"/><path d="M4 6.5h.01M4 12h.01M4 17.5h.01"/>',
    file: '<path d="M6 3.2h7.2L18.6 8.6V20.8H6z"/><path d="M13 3.2v5.6h5.4"/><path d="M9 13.4h6M9 17h4"/>',
    star: '<path d="M12 3.6l2.6 5.3 5.8.85-4.2 4.1 1 5.75L12 16.9l-5.2 2.7 1-5.75-4.2-4.1 5.8-.85z"/>',
    mapPin: '<path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.7"/>',
    truck: '<rect x="2.6" y="7" width="11" height="9" rx="1.6"/><path d="M13.6 10.4h3.6l3.2 3.2V16h-6.8z"/><circle cx="7" cy="18" r="1.9"/><circle cx="17" cy="18" r="1.9"/>',
    layers: '<path d="m12 3.4 8.4 4.4-8.4 4.4L3.6 7.8z"/><path d="m3.6 12.4 8.4 4.4 8.4-4.4"/>',
    save: '<path d="M5 4.4h11.4L19.6 7.6V19.6H5z"/><path d="M8.4 4.4v5.2h7V4.4"/><rect x="8" y="13" width="8" height="6.6"/>',
    refresh: '<path d="M20 6.6v5h-5"/><path d="M19.4 11.4A7.8 7.8 0 1 0 18 16.4"/>',
    info: '<circle cx="12" cy="12" r="8.6"/><path d="M12 11v5.4M12 7.8v.2"/>',
    play: '<path d="M8 5.4 18.4 12 8 18.6z"/>',
    flag: '<path d="M6 21V4"/><path d="M6 4.6h11.4l-2 3.6 2 3.6H6z"/>'
  };

  function icon(name, size = 20, cls = '') {
    const p = PATHS[name] || PATHS.info;
    return `<svg class="ico ${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
      aria-hidden="true" focusable="false">${p}</svg>`;
  }

  /* =======================================================
     2. FORMATS
     ======================================================= */
  const MONTHS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  const MONTHS_SHORT = ['jan', 'fév', 'mar', 'avr', 'mai', 'juin', 'juil', 'août', 'sep', 'oct', 'nov', 'déc'];
  const DAYS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
  const DAYS_SHORT = ['D', 'L', 'M', 'M', 'J', 'V', 'S'];

  const nf = (n, d = 0) => Number(n).toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d })
    .replace(/\u202F|\u00A0/g, ' ');

  const fmt = {
    int: (n) => nf(Math.round(n)),
    dec: (n, d = 1) => nf(n, d),
    money: (n) => nf(Math.round(n)) + ' DT',
    moneyShort: (n) => n >= 1000000 ? nf(n / 1000000, 2) + ' M DT'
      : n >= 10000 ? nf(Math.round(n / 1000)) + ' k DT' : nf(Math.round(n)) + ' DT',
    pct: (n) => Math.round(n) + ' %',
    /** '2026-08-14' → '14/08/2026' */
    date: (iso) => { if (!iso) return '—'; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; },
    /** '2026-08-14' → '14 août 2026' */
    dateLong: (iso) => { if (!iso) return '—'; const d = ERP.dt.parse(iso); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; },
    dateShort: (iso) => { if (!iso) return '—'; const d = ERP.dt.parse(iso); return `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}`; },
    /** '2026-08-14' → 'Vendredi 14 août 2026' */
    dateFull: (iso) => { const d = ERP.dt.parse(iso); const s = `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; return s[0].toUpperCase() + s.slice(1); },
    /** minutes depuis minuit → '07:02' */
    time: (min) => min == null ? '—' : `${String(Math.floor(min / 60)).padStart(2, '0')}:${String(Math.round(min % 60)).padStart(2, '0')}`,
    /** 8.05 → '8h03' */
    hours: (h) => { if (h == null) return '—'; const t = Math.round(h * 60); return `${Math.floor(t / 60)}h${String(t % 60).padStart(2, '0')}`; },
    months: MONTHS, monthsShort: MONTHS_SHORT, daysShort: DAYS_SHORT
  };

  /* =======================================================
     3. LIBELLÉS & BADGES DE STATUT
     ======================================================= */
  const STATUS = {
    project: {
      en_preparation: ['En préparation', 'badge'],
      en_cours: ['En cours', 'badge badge--info'],
      en_retard: ['En retard', 'badge badge--danger'],
      termine: ['Terminé', 'badge badge--ok']
    },
    task: {
      a_faire: ['À faire', 'badge'],
      en_cours: ['En cours', 'badge badge--info'],
      bloque: ['Bloqué', 'badge badge--danger'],
      termine: ['Terminé', 'badge badge--ok']
    },
    presence: {
      present: ['Présent', 'badge badge--ok'],
      retard: ['Retard', 'badge badge--warn'],
      absent: ['Absent', 'badge badge--danger'],
      non_planifie: ['Non planifié', 'badge']
    },
    supplier: {
      actif: ['Actif', 'badge badge--ok'],
      occasionnel: ['Occasionnel', 'badge']
    },
    stock: {
      ok: ['Disponible', 'badge badge--ok'],
      faible: ['Stock faible', 'badge badge--warn'],
      rupture: ['Rupture', 'badge badge--danger']
    },
    client: {
      actif: ['Actif', 'badge badge--ok'],
      prospect: ['Prospect', 'badge badge--info'],
      inactif: ['Inactif', 'badge']
    },
    userRole: {
      admin: ['Admin', 'badge badge--info'],
      ingenieur: ['Ingénieur', 'badge']
    },
    userActive: {
      actif: ['Actif', 'badge badge--ok'],
      inactif: ['Désactivé', 'badge badge--danger']
    },
    priority: {
      haute: ['Haute', 'badge badge--danger'],
      moyenne: ['Moyenne', 'badge badge--warn'],
      basse: ['Basse', 'badge']
    }
  };
  const label = (kind, key) => (STATUS[kind][key] || [key, 'badge'])[0];
  const badge = (kind, key) => {
    const [txt, cls] = STATUS[kind][key] || [key, 'badge'];
    return `<span class="${cls}">${txt}</span>`;
  };

  /* Couleur d'une barre de progression selon l'avancement / la consommation */
  function progressClass(value, danger = 90, warn = 75) {
    if (value >= danger) return 'pbar__fill--danger';
    if (value >= warn) return 'pbar__fill--warn';
    return '';
  }
  function pbar(value, cls = '', thin = false) {
    return `<div class="pbar ${thin ? 'pbar--thin' : ''}"><div class="pbar__fill ${cls}" style="width:${Math.max(0, Math.min(100, value))}%"></div></div>`;
  }

  /* =======================================================
     4. HELPERS DOM
     ======================================================= */
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  function el(html) {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }
  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  /** Délégation d'évènement : on(root, 'click', '.selector', handler) */
  function on(root, type, selector, handler) {
    root.addEventListener(type, (e) => {
      const target = e.target.closest(selector);
      if (target && root.contains(target)) handler(e, target);
    });
  }

  const debounce = (fn, ms = 220) => {
    let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
  };

  /* =======================================================
     5. MODALES
     ======================================================= */
  let openModals = 0;
  function modal({ title, sub = '', body = '', footer = '', size = '', onClose = null }) {
    const scrim = el(`
      <div class="modal-scrim" role="dialog" aria-modal="true">
        <div class="modal ${size}">
          <div class="modal__head">
            <div style="min-width:0;flex:1">
              <h2>${esc(title)}</h2>
              ${sub ? `<div class="sub">${sub}</div>` : ''}
            </div>
            <button class="icon-btn" data-close type="button" aria-label="Fermer">${icon('x', 22)}</button>
          </div>
          <div class="modal__body"></div>
          ${footer ? `<div class="modal__foot">${footer}</div>` : ''}
        </div>
      </div>`);
    scrim.querySelector('.modal__body').innerHTML = body;
    document.getElementById('modalRoot').appendChild(scrim);
    openModals++;

    function close() {
      if (!scrim.isConnected) return;
      scrim.remove();
      openModals--;
      document.removeEventListener('keydown', onKey);
      if (onClose) onClose();
    }
    function onKey(e) { if (e.key === 'Escape') close(); }

    scrim.addEventListener('click', (e) => { if (e.target === scrim) close(); });
    scrim.querySelector('[data-close]').addEventListener('click', close);
    document.addEventListener('keydown', onKey);
    setTimeout(() => {
      const f = scrim.querySelector('input,select,textarea,button:not([data-close])');
      if (f && window.innerWidth > 900) f.focus();
    }, 60);

    return { root: scrim, body: scrim.querySelector('.modal__body'), foot: scrim.querySelector('.modal__foot'), close };
  }

  function confirm({ title, text, confirmLabel = 'Confirmer', danger = false, icon: ic = 'alert' }) {
    return new Promise((resolve) => {
      let answer = false;
      const m = modal({
        title, size: 'modal--sm',
        body: `<div class="row" style="align-items:flex-start;gap:14px">
                 <div class="kpi__ico ${danger ? 'kpi__ico--danger' : 'kpi__ico--warn'}" style="width:44px;height:44px">${icon(ic, 22)}</div>
                 <p style="font-size:15px;line-height:1.55">${text}</p>
               </div>`,
        footer: `<button class="btn" data-cancel type="button">Annuler</button>
                 <button class="btn ${danger ? 'btn--danger' : 'btn--primary'}" data-ok type="button">${esc(confirmLabel)}</button>`,
        onClose: () => resolve(answer)
      });
      m.foot.querySelector('[data-cancel]').onclick = () => m.close();
      m.foot.querySelector('[data-ok]').onclick = () => { answer = true; m.close(); };
    });
  }

  /* =======================================================
     6. TOASTS
     ======================================================= */
  function toast(message, type = 'ok', ms = 3200) {
    const map = { ok: 'check', warn: 'alert', danger: 'alert', info: 'info' };
    const t = el(`<div class="toast toast--${type}">
        <span class="toast__ico">${icon(map[type] || 'info', 22)}</span>
        <span>${message}</span>
      </div>`);
    document.getElementById('toastRoot').appendChild(t);
    setTimeout(() => { t.classList.add('is-out'); setTimeout(() => t.remove(), 220); }, ms);
  }

  /* =======================================================
     7. POPOVERS (notifications, menu profil)
     ======================================================= */
  let currentPop = null;
  function popover(anchor, html, { align = 'right', width = 400 } = {}) {
    closePopover();
    const p = el(`<div class="popover" style="width:${width}px">${html}</div>`);
    document.getElementById('popoverRoot').appendChild(p);
    const r = anchor.getBoundingClientRect();
    const w = Math.min(width, window.innerWidth - 24);
    p.style.width = w + 'px';
    p.style.top = Math.round(r.bottom + 10) + 'px';
    p.style.left = align === 'right'
      ? Math.round(Math.max(12, Math.min(r.right - w, window.innerWidth - w - 12))) + 'px'
      : Math.round(Math.max(12, r.left)) + 'px';

    const off = (e) => { if (!p.contains(e.target) && !anchor.contains(e.target)) closePopover(); };
    const esc2 = (e) => { if (e.key === 'Escape') closePopover(); };
    setTimeout(() => {
      document.addEventListener('pointerdown', off);
      document.addEventListener('keydown', esc2);
    }, 10);
    currentPop = { node: p, cleanup: () => { document.removeEventListener('pointerdown', off); document.removeEventListener('keydown', esc2); } };
    return p;
  }
  function closePopover() {
    if (currentPop) { currentPop.cleanup(); currentPop.node.remove(); currentPop = null; }
  }

  /* =======================================================
     8. ÉTATS DE CHARGEMENT / VIDE
     ======================================================= */
  const skeleton = (rows = 3) => `<div class="stack">${Array.from({ length: rows }, () =>
    `<div class="card" style="height:96px;background:linear-gradient(90deg,#fff,#F2F5F9,#fff);background-size:200% 100%;animation:sk 1.1s infinite"></div>`).join('')}
    <style>@keyframes sk{0%{background-position:120% 0}100%{background-position:-20% 0}}</style>`;

  const empty = (title, text, action = '') => `
    <div class="empty">
      <div class="empty__ico">${icon('search', 30)}</div>
      <h3>${esc(title)}</h3><p>${text}</p>${action}
    </div>`;

  /* ---------- Export ---------- */
  ERP.icon = icon;
  ERP.fmt = fmt;
  ERP.UI = {
    icon, fmt, badge, label, pbar, progressClass, modal, confirm, toast,
    popover, closePopover, skeleton, empty, el, esc, on, $, $$, debounce, STATUS
  };
})(window.ERP);

</script>
<script>
/* ===== js/charts.js ===== */
/* =========================================================
   BâtiPilot — Graphiques
   Rendu SVG maison : aucune dépendance réseau, impression nette,
   et cohérence totale avec la palette de l'application.
   (Chart.js peut être substitué ici sans toucher aux pages :
    chaque fonction reçoit un conteneur + un objet de données.)
   ========================================================= */
window.ERP = window.ERP || {};

(function (ERP) {
  'use strict';

  const C = {
    axis: '#8698A9', grid: '#E2E9F0', text: '#4E6479',
    navy: '#14395C', navyLight: '#1C6FA8', orange: '#E4651A',
    ok: '#17845A', warn: '#B26A05', danger: '#C42B2B', faint: '#C7D3E0'
  };
  const nf = (n) => Number(n).toLocaleString('fr-FR').replace(/\u202F|\u00A0/g, ' ');

  function svg(w, h, inner, cls = '') {
    return `<svg class="chart ${cls}" viewBox="0 0 ${w} ${h}" width="100%" style="height:auto;display:block"
      font-family="Inter, sans-serif" role="img">${inner}</svg>`;
  }

  /* ---------- Échelle « jolie » pour l'axe Y ---------- */
  function niceMax(v) {
    if (v <= 0) return 10;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    const n = v / p;
    const step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
    return step * p;
  }

  /* =======================================================
     ANNEAU (répartition)
     ======================================================= */
  function donut(container, { items, center = null, size = 220, thickness = 30 }) {
    if (!container) return;
    const total = items.reduce((s, i) => s + i.value, 0) || 1;
    const r = size / 2 - thickness / 2 - 2;
    const cx = size / 2, cy = size / 2;
    let angle = -Math.PI / 2;
    const arcs = items.map((it) => {
      const a = (it.value / total) * Math.PI * 2;
      const x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
      angle += a;
      const x2 = cx + r * Math.cos(angle), y2 = cy + r * Math.sin(angle);
      const large = a > Math.PI ? 1 : 0;
      if (it.value === 0) return '';
      return `<path d="M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}"
                fill="none" stroke="${it.color}" stroke-width="${thickness}" stroke-linecap="butt">
                <title>${it.label} — ${nf(it.value)}</title></path>`;
    }).join('');

    const middle = center ? `
      <text x="${cx}" y="${cy - 2}" text-anchor="middle" font-family="Barlow Semi Condensed, sans-serif"
            font-size="30" font-weight="700" fill="${C.navy}">${center.value}</text>
      <text x="${cx}" y="${cy + 20}" text-anchor="middle" font-size="12" fill="${C.text}">${center.label}</text>` : '';

    container.innerHTML = svg(size, size, `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${C.grid}" stroke-width="${thickness}"/>${arcs}${middle}`);
  }

  /* =======================================================
     BARRES GROUPÉES
     ======================================================= */
  function bars(container, { labels, series, formatter = nf, height = 280, yTicks = 4 }) {
    if (!container) return;
    const W = 700, H = height, padL = 60, padR = 14, padT = 18, padB = 44;
    const iw = W - padL - padR, ih = H - padT - padB;
    const max = niceMax(Math.max(...series.flatMap(s => s.data), 1));
    const y = (v) => padT + ih - (v / max) * ih;

    let g = '';
    for (let i = 0; i <= yTicks; i++) {
      const v = (max / yTicks) * i, yy = y(v);
      g += `<line x1="${padL}" y1="${yy}" x2="${W - padR}" y2="${yy}" stroke="${C.grid}" stroke-width="1"/>
            <text x="${padL - 10}" y="${yy + 4}" text-anchor="end" font-size="11" fill="${C.text}">${formatter(v)}</text>`;
    }

    const slot = iw / labels.length;
    const bw = Math.min(34, (slot * 0.62) / series.length);
    let b = '';
    labels.forEach((lab, i) => {
      const x0 = padL + slot * i + slot / 2 - (bw * series.length) / 2;
      series.forEach((s, k) => {
        const v = s.data[i] || 0, yy = y(v), h = Math.max(1, padT + ih - yy);
        b += `<rect x="${(x0 + k * bw).toFixed(1)}" y="${yy.toFixed(1)}" width="${(bw - 4).toFixed(1)}" height="${h.toFixed(1)}"
                rx="4" fill="${s.color}"><title>${s.name} — ${lab} : ${formatter(v)}</title></rect>`;
      });
      const short = lab.length > 14 ? lab.slice(0, 13) + '…' : lab;
      b += `<text x="${(padL + slot * i + slot / 2).toFixed(1)}" y="${H - padB + 20}" text-anchor="middle"
              font-size="11.5" fill="${C.text}">${short}</text>`;
    });

    container.innerHTML = svg(W, H, `${g}<line x1="${padL}" y1="${padT + ih}" x2="${W - padR}" y2="${padT + ih}" stroke="${C.axis}" stroke-width="1"/>${b}`);
  }

  /* =======================================================
     COURBES
     ======================================================= */
  function line(container, { labels, series, formatter = nf, height = 280, yTicks = 4 }) {
    if (!container) return;
    const W = 700, H = height, padL = 52, padR = 16, padT = 18, padB = 40;
    const iw = W - padL - padR, ih = H - padT - padB;
    const max = niceMax(Math.max(...series.flatMap(s => s.data), 1));
    const x = (i) => padL + (labels.length === 1 ? iw / 2 : (iw / (labels.length - 1)) * i);
    const y = (v) => padT + ih - (v / max) * ih;

    let g = '';
    for (let i = 0; i <= yTicks; i++) {
      const v = (max / yTicks) * i, yy = y(v);
      g += `<line x1="${padL}" y1="${yy}" x2="${W - padR}" y2="${yy}" stroke="${C.grid}"/>
            <text x="${padL - 9}" y="${yy + 4}" text-anchor="end" font-size="11" fill="${C.text}">${formatter(v)}</text>`;
    }

    let paths = '';
    series.forEach((s) => {
      const pts = s.data.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
      if (s.area) {
        paths += `<polygon points="${x(0)},${padT + ih} ${pts} ${x(s.data.length - 1)},${padT + ih}"
                    fill="${s.color}" opacity=".10"/>`;
      }
      paths += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.6"
                  stroke-linejoin="round" stroke-linecap="round" ${s.dashed ? 'stroke-dasharray="6 5"' : ''}/>`;
      paths += s.data.map((v, i) =>
        `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.6" fill="#fff" stroke="${s.color}" stroke-width="2.4">
           <title>${s.name} — ${labels[i]} : ${formatter(v)}</title></circle>`).join('');
    });

    const step = Math.ceil(labels.length / 8);
    const xl = labels.map((l, i) => i % step === 0
      ? `<text x="${x(i).toFixed(1)}" y="${H - padB + 20}" text-anchor="middle" font-size="11.5" fill="${C.text}">${l}</text>` : '').join('');

    container.innerHTML = svg(W, H, `${g}<line x1="${padL}" y1="${padT + ih}" x2="${W - padR}" y2="${padT + ih}" stroke="${C.axis}"/>${paths}${xl}`);
  }

  /* =======================================================
     BARRES HORIZONTALES (classements)
     ======================================================= */
  function hbars(container, { items, formatter = nf, showPct = true }) {
    if (!container) return;
    const total = items.reduce((s, i) => s + i.value, 0) || 1;
    const max = Math.max(...items.map(i => i.value), 1);
    container.innerHTML = items.map(it => `
      <div class="catrow">
        <div class="catrow__label">${it.label}${showPct ? ` <span class="muted small">${Math.round(it.value / total * 100)} %</span>` : ''}</div>
        <div class="pbar" style="height:12px"><div class="pbar__fill" style="width:${(it.value / max * 100).toFixed(1)}%;background:${it.color || C.navy}"></div></div>
        <div class="catrow__val">${formatter(it.value)}</div>
      </div>`).join('');
  }

  /* ---------- Légende ---------- */
  function legend(items) {
    return `<div class="chart-legend">${items.map(i =>
      `<span><i style="background:${i.color}"></i>${i.label}</span>`).join('')}</div>`;
  }

  ERP.Charts = { donut, bars, line, hbars, legend, colors: C };
})(window.ERP);

</script>
<script>
/* ===== js/router.js ===== */
/* =========================================================
   BâtiPilot — Routeur (hash)
   Chaque module s'enregistre : ERP.Router.add('/projets/:id', {...})
   ========================================================= */
window.ERP = window.ERP || {};

(function (ERP) {
  'use strict';

  const routes = [];
  let current = null;
  let onChange = null;

  function add(pattern, def) {
    const keys = [];
    const rx = new RegExp('^' + pattern.replace(/:(\w+)/g, (_, k) => { keys.push(k); return '([^/]+)'; }) + '$');
    routes.push({ pattern, rx, keys, def });
  }

  function match(path) {
    for (const r of routes) {
      const m = path.match(r.rx);
      if (m) {
        const params = {};
        r.keys.forEach((k, i) => { params[k] = decodeURIComponent(m[i + 1]); });
        return { route: r, params };
      }
    }
    return null;
  }

  function path() {
    const h = location.hash.replace(/^#/, '').split('?')[0];
    return h && h !== '/' ? h : '/dashboard';
  }

  /** #/projets?statut=termine → { statut:'termine' } */
  function query() {
    const q = location.hash.split('?')[1];
    return Object.fromEntries(new URLSearchParams(q || ''));
  }

  async function resolve() {
    const p = path();
    const hit = match(p);
    const host = document.getElementById('view');

    // Chaque rendu reçoit son propre conteneur : si l'utilisateur change de page
    // pendant un chargement, le rendu abandonné écrit dans un nœud détaché
    // au lieu d'écraser la page suivante.
    const view = document.createElement('div');
    view.className = 'view__inner';

    if (!hit) {
      view.innerHTML = ERP.UI.empty('Page introuvable',
        'Le lien demandé ne correspond à aucun module.',
        '<a class="btn btn--primary" href="#/dashboard">Revenir au tableau de bord</a>');
      host.replaceChildren(view);
      return;
    }

    current = { path: p, ...hit };
    if (onChange) onChange(current);

    host.replaceChildren(view);
    host.scrollTop = 0;
    try {
      await hit.route.def.render(hit.params, view);
    } catch (err) {
      console.error(err);
      view.innerHTML = ERP.UI.empty('Chargement impossible',
        'Les données de ce module n\'ont pas pu être récupérées. Réessayez dans un instant.',
        '<button class="btn btn--primary" onclick="location.reload()">Recharger</button>');
    }
  }

  function go(to) {
    if (location.hash === '#' + to) resolve();
    else location.hash = to;
  }

  function start(cb) {
    onChange = cb;
    window.addEventListener('hashchange', resolve);
    resolve();
  }

  ERP.Router = { add, go, start, path, query, get current() { return current; }, routes };
})(window.ERP);

</script>
