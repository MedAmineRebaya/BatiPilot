    if (params && params.id) openSheet(params.id, refresh);
  }

  /* ---------- Fiche article ---------- */
  async function openSheet(id, done) {
    const a = await ERP.Api.articles.get(id);
    if (!a) return;
    const openProjects = (await ERP.Api.projects.list()).filter(p => p.status !== 'termine');
    const affect = await ERP.Api.materials.list({ articleId: id });
    const sup = a.supplierId ? ERP.DB.suppliers.find(x => x.id === a.supplierId) : null;
    const isFeatured = sup ? sup.featured.includes(a.id) : false;
    const m = ERP.UI.modal({
      title: a.name, sub: `${a.ref} · ${a.category}`,
      body: `
        <div class="kpis" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px">
          <div class="kpi"><div class="kpi__top"><span class="kpi__ico" style="background:${stockColor(a.stockStatus)}1a;color:${stockColor(a.stockStatus)}">${icon('package', 19)}</span>
            <span class="kpi__label">Stock disponible</span></div>
            <div class="kpi__value num">${fmt.int(a.stock)}<span>${a.unit}</span></div>
            <div class="kpi__foot">Seuil minimum : ${fmt.int(a.min)} ${a.unit}</div></div>
          <div class="kpi"><div class="kpi__top"><span class="kpi__ico kpi__ico--warn">${icon('wallet', 19)}</span><span class="kpi__label">Prix unitaire</span></div>
            <div class="kpi__value num">${fmt.dec(a.price, 2)}<span>DT</span></div>
            <div class="kpi__foot">Valeur du stock : ${fmt.money(a.price * a.stock)}</div></div>
          <div class="kpi"><div class="kpi__top"><span class="kpi__ico">${icon('truck', 19)}</span><span class="kpi__label">Fournisseur</span></div>
            <div class="kpi__value" style="font-size:17px;line-height:1.3">${esc(a.supplier)}</div>
            <div class="kpi__foot">${sup ? `${esc(sup.phone)} · délai ${sup.leadDays} j` : 'Dernière entrée : ' + fmt.date(a.lastEntry)}</div></div>
        </div>

        <dl class="props">
          <div class="prop"><dt>Référence</dt><dd class="num">${a.ref}</dd></div>
          <div class="prop"><dt>Catégorie</dt><dd>${a.category}</dd></div>
          <div class="prop"><dt>Unité de gestion</dt><dd>${a.unit}</dd></div>
          <div class="prop"><dt>Emplacement</dt><dd>${esc(a.location)}</dd></div>
        </dl>

        ${sup ? `<div class="pick" style="margin-top:18px">
          <div class="row" style="gap:14px;flex-wrap:wrap">
            <span class="list-row__ico">${icon('truck', 20)}</span>
            <div style="flex:1;min-width:180px">
              <strong>${esc(sup.company)}</strong>
              <div class="small muted">${esc(sup.contact)} · ${esc(sup.city)} · livraison sous ${sup.leadDays} j
                ${isFeatured ? '· <b style="color:var(--orange)">matériau à la une</b>' : ''}</div>
            </div>
            <button class="btn btn--sm" data-supcall type="button">${icon('phone', 16)} ${esc(sup.phone)}</button>
            <button class="btn btn--sm btn--ghost" data-supopen type="button">Fiche fournisseur ${icon('chevronRight', 15)}</button>
          </div>
        </div>` : ''}

        <h3 style="margin:20px 0 10px">Mouvement de stock</h3>
        <div class="pick">
          <div class="pick__form" style="grid-template-columns:1.6fr .7fr auto auto">
            <div class="field"><label for="mv-project">Chantier destinataire</label>
              <select id="mv-project">${openProjects.map(p =>
                `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
            <div class="field"><label for="mv-qty">Quantité (${a.unit})</label>
              <input id="mv-qty" type="number" min="1" value="10"></div>
            <button class="btn btn--accent" data-out type="button">${icon('minus', 18)} Sortie chantier</button>
            <button class="btn btn--primary" data-in type="button">${icon('plus', 18)} Entrée dépôt</button>
          </div>
        </div>

        <h3 style="margin:20px 0 10px">Chantiers desservis</h3>
        ${affect.length ? `<div class="table-wrap"><table class="tbl" style="min-width:520px">
          <thead><tr><th>Chantier</th><th class="t-right">Quantité</th><th class="t-right">Montant</th><th>Date</th></tr></thead>
          <tbody>${affect.map(x => `<tr>
            <td class="cell-main">${esc(x.projectName)}<div class="cell-sub">${esc(x.note || 'Sortie de stock')}</div></td>
            <td class="t-right num"><b>${fmt.dec(x.qty, 0)}</b> ${a.unit}</td>
            <td class="t-right money num">${fmt.money(x.total)}</td>
            <td class="num">${fmt.date(x.date)}</td></tr>`).join('')}
            <tr><td class="cell-main">Total affecté</td>
              <td class="t-right num"><b>${fmt.dec(affect.reduce((s, x) => s + x.qty, 0), 0)}</b> ${a.unit}</td>
              <td class="t-right money num"><b>${fmt.money(affect.reduce((s, x) => s + x.total, 0))}</b></td>
              <td></td></tr>
          </tbody></table></div>`
          : '<div class="pick__empty">Cet article n\'est affecté à aucun chantier pour le moment.</div>'}`,
      footer: `<button class="btn btn--danger" data-del>${icon('trash', 18)} Supprimer</button>
               <span style="flex:1"></span>
               <button class="btn" data-close2>Fermer</button>
               <button class="btn btn--primary" data-edit>${icon('edit', 18)} Modifier</button>`
    });

    const qty = () => Math.max(1, +m.body.querySelector('#mv-qty').value || 0);
    m.body.querySelector('[data-in]').onclick = async () => {
      const n = qty();
      await ERP.Api.articles.update(a.id, { stock: a.stock + n, lastEntry: ERP.DB.today });
      m.close(); toast(`Entrée de ${n} ${a.unit} enregistrée`, 'ok'); done && done();
    };
    m.body.querySelector('[data-out]').onclick = async () => {
      const n = qty();
      const projectId = m.body.querySelector('#mv-project').value;
      if (n > a.stock) { toast(`Stock insuffisant : ${fmt.dec(a.stock, 0)} ${a.unit} disponibles`, 'danger'); return; }
      await ERP.Api.materials.create({ articleId: a.id, projectId, qty: n, note: 'Sortie depuis la fiche article' });
      const proj = openProjects.find(p => p.id === projectId);
      m.close();
      toast(`${n} ${a.unit} affectés à ${proj ? proj.name : 'ce chantier'}`, 'ok');
      done && done();
    };
    if (sup) {
      m.body.querySelector('[data-supcall]').onclick = () => toast('Appel vers ' + sup.phone + ' (simulé)', 'info');
      m.body.querySelector('[data-supopen]').onclick = () => { m.close(); ERP.Router.go('/fournisseurs/' + sup.id); };
    }
    m.foot.querySelector('[data-close2]').onclick = m.close;
    m.foot.querySelector('[data-edit]').onclick = () => { m.close(); openForm(done, a); };
    m.foot.querySelector('[data-del]').onclick = async () => {
      const ok = await confirm({
        title: 'Supprimer cet article ?', danger: true, confirmLabel: 'Supprimer',
        text: `<b>${esc(a.name)}</b> sera retiré du catalogue. Les mouvements de stock déjà enregistrés seront conservés dans l'historique.`
      });
      if (ok) { await ERP.Api.articles.remove(a.id); m.close(); toast('Article supprimé', 'ok'); done && done(); }
    };
  }

  /* ---------- Formulaire article ---------- */
  function openForm(done, article = null) {
    const categories = [...new Set(ERP.DB.articles.map(a => a.category))].sort();
    const m = ERP.UI.modal({
      title: article ? 'Modifier l\'article' : 'Nouvel article',
      sub: article ? article.ref : 'Ajouter un matériau au catalogue',
      body: `<div class="form-grid">
        <div class="field field--full"><label for="a-name">Désignation</label>
          <input id="a-name" value="${article ? esc(article.name) : ''}" placeholder="Ex. : Ciment CEM II 25 kg"></div>
        <div class="field"><label for="a-cat">Catégorie</label>
          <select id="a-cat">${categories.map(c => `<option ${article && article.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
        <div class="field"><label for="a-unit">Unité</label>
          <select id="a-unit">${['sac', 'm³', 'unité', 'barre', 'kg', 'litre', 'm²', 'rouleau', 'couronne', 'panneau', 'seau']
            .map(u => `<option ${article && article.unit === u ? 'selected' : ''}>${u}</option>`).join('')}</select></div>
        <div class="field"><label for="a-stock">Quantité en stock</label><input id="a-stock" type="number" min="0" value="${article ? article.stock : 0}"></div>
        <div class="field"><label for="a-min">Seuil minimum</label><input id="a-min" type="number" min="0" value="${article ? article.min : 20}"></div>
        <div class="field"><label for="a-price">Prix unitaire (DT)</label><input id="a-price" type="number" step="0.01" min="0" value="${article ? article.price : ''}"></div>
        <div class="field"><label for="a-sup">Fournisseur</label>
          <select id="a-sup">
            <option value="">— Non renseigné —</option>
            ${ERP.DB.suppliers.slice().sort((x, y) => x.company.localeCompare(y.company)).map(x =>
              `<option value="${x.id}" ${article && article.supplierId === x.id ? 'selected' : ''}>${esc(x.company)} — ${esc(x.city)}</option>`).join('')}
          </select></div>
      </div>`,
      footer: `<button class="btn" data-cancel>Annuler</button>
               <button class="btn btn--primary" data-save>${icon('save', 18)} ${article ? 'Enregistrer' : 'Créer l\'article'}</button>`
    });
    m.foot.querySelector('[data-cancel]').onclick = m.close;
    m.foot.querySelector('[data-save]').onclick = async () => {
      const g = (id) => m.body.querySelector(id).value;
      if (!g('#a-name').trim()) { toast('La désignation est obligatoire', 'danger'); return; }
      const payload = {
        name: g('#a-name').trim(), category: g('#a-cat'), unit: g('#a-unit'),
        stock: +g('#a-stock') || 0, min: +g('#a-min') || 0, price: +g('#a-price') || 0,
        supplierId: g('#a-sup') || null,
        supplier: (ERP.DB.suppliers.find(x => x.id === g('#a-sup')) || {}).company || 'Non renseigné'
      };
      if (article) { await ERP.Api.articles.update(article.id, payload); toast('Article mis à jour', 'ok'); }
      else { await ERP.Api.articles.create(payload); toast('Article ajouté au catalogue', 'ok'); }
      m.close(); done && done();
    };
  }

  /* =========================================================
     COMPOSANT — Matériaux affectés à un chantier
     Chaque ligne se gère sur place ; toute modification de
     quantité met à jour le stock de l'article et le budget.
     ========================================================= */
  ERP.Components.materialRows = async function (container, { projectId, onChange } = {}) {
    if (!container) return;

    async function draw() {
      if (!container.isConnected) return;
      const list = await ERP.Api.materials.list({ projectId });
      const total = list.reduce((s, m) => s + m.total, 0);
      const alerts = list.filter(m => m.stockStatus !== 'ok').length;

      container.innerHTML = `
        <div class="card__head">
          <h3>Matériaux du chantier</h3>
          <span class="tag num">${list.length} référence${list.length > 1 ? 's' : ''}</span>
          <span class="spacer"></span>
          ${alerts ? `<span class="badge badge--warn">${alerts} en tension de stock</span>` : ''}
          <span class="money money--sm num">${fmt.money(total)}</span>
          <button class="btn btn--sm btn--accent" data-addmat type="button">${icon('plus', 18)} Affecter</button>
        </div>
        <div class="card__body card__body--flush">
          ${list.length ? `<div class="table-wrap"><table class="tbl tbl--rows">
            <thead><tr>
              <th style="min-width:230px">Matériau</th><th>Catégorie</th>
              <th style="min-width:170px" class="t-right">Quantité affectée</th>
              <th class="t-right">Prix unitaire</th><th class="t-right">Montant</th>
              <th>Stock restant</th><th>Date</th><th class="t-right">Actions</th>
            </tr></thead>
            <tbody>${list.map(matRow).join('')}</tbody>
          </table></div>` : ERP.UI.empty('Aucun matériau affecté',
            'Affectez les matériaux consommés par ce chantier : le stock du dépôt se met à jour automatiquement.')}
        </div>`;
    }

    function matRow(m) {
      return `<tr data-mat="${m.id}">
        <td><div class="cell-main">${esc(m.name)}</div><div class="cell-sub num">${m.ref}${m.note ? ' · ' + esc(m.note) : ''}</div></td>
        <td class="small">${esc(m.category)}</td>
        <td>
          <div class="stepper" style="justify-content:flex-end">
            <button class="stepper__btn" data-qty="-1" type="button" aria-label="Diminuer la quantité">${icon('minus', 16)}</button>
            <b class="num" style="min-width:76px;text-align:right;font-size:15px">${fmt.dec(m.qty, 0)} <small class="muted">${m.unit}</small></b>
            <button class="stepper__btn" data-qty="1" type="button" aria-label="Augmenter la quantité">${icon('plus', 16)}</button>
          </div>
        </td>
        <td class="t-right num">${fmt.dec(m.price, 2)} DT</td>
        <td class="t-right money num">${fmt.money(m.total)}</td>
        <td>${badge('stock', m.stockStatus)}<div class="cell-sub num">${fmt.dec(m.stock, 0)} ${m.unit} au dépôt</div></td>
        <td class="num">${fmt.date(m.date)}</td>
        <td><div class="row-actions">
          <button class="icon-btn icon-btn--sm" data-editmat type="button" aria-label="Modifier la quantité">${icon('edit', 17)}</button>
          <button class="icon-btn icon-btn--sm icon-btn--danger" data-delmat type="button" aria-label="Retourner au dépôt">${icon('trash', 17)}</button>
        </div></td>
      </tr>`;
    }

    const refresh = async (msg, tone) => {
      await draw();
      if (ERP.App) ERP.App.buildNav();   // la pastille « stock » du menu suit les sorties
      if (msg) toast(msg, tone || 'ok', 2400);
      onChange && onChange();
    };
    const matOf = async (b) => (await ERP.Api.materials.list({ projectId }))
      .find(x => x.id === b.closest('[data-mat]').dataset.mat);

    /* Quantité au pas de 1 : le stock suit immédiatement */
    on(container, 'click', '[data-qty]', async (e, b) => {
      const m = await matOf(b);
      const step = +b.dataset.qty;
      const next = m.qty + step;
      if (next < 1) { toast('Utilisez la corbeille pour retourner le matériau au dépôt', 'info', 2400); return; }
      try {
        await ERP.Api.materials.update(m.id, { qty: next });
        const a = ERP.DB.articles.find(x => x.id === m.articleId);
        refresh(`${m.name} : ${next} ${m.unit} · stock restant ${fmt.dec(a.stock, 0)}`);
      } catch (err) {
        toast(`Stock insuffisant : ${fmt.dec(m.stock, 0)} ${m.unit} disponibles au dépôt`, 'danger');
      }
    });

    on(container, 'click', '[data-editmat]', async (e, b) => openMaterialForm(
      () => refresh(), { projectId }, await matOf(b)));

    on(container, 'click', '[data-delmat]', async (e, b) => {
      const m = await matOf(b);
      const ok = await confirm({
        title: 'Retirer ce matériau du chantier ?', confirmLabel: 'Retourner au dépôt', icon: 'package',
        text: `Les <b>${fmt.dec(m.qty, 0)} ${m.unit}</b> de <b>${esc(m.name)}</b> seront remis en stock
               et le montant de ${fmt.money(m.total)} sera retiré des dépenses du chantier.`
      });
      if (ok) { await ERP.Api.materials.remove(m.id); refresh('Matériau retourné au dépôt'); }
    });

    on(container, 'click', '[data-addmat]', () => openMaterialForm(() => refresh(), { projectId }, null));

    await draw();
  };

  /* ---------- Affecter un matériau à un chantier ---------- */
  const liveStock = (articleId) => {
    const a = ERP.DB.articles.find(x => x.id === articleId);
    return a ? a.stock : 0;
  };

  async function openMaterialForm(done, opts, existing) {
    const { projectId, articleId, chooseProject } = opts || {};
    const articles = await ERP.Api.articles.list();
    const cats = [...new Set(articles.map(a => a.category))];
    const current = existing ? articles.find(a => a.id === existing.articleId) : null;
    const projects = chooseProject
      ? (await ERP.Api.projects.list()).filter(p => p.status !== 'termine') : [];

    const m = ERP.UI.modal({
      title: existing ? 'Modifier la quantité affectée' : 'Affecter un matériau au chantier',
      sub: existing ? esc(existing.name) : 'La sortie est déduite du stock du dépôt',
      body: `<div class="form-grid">
          ${chooseProject ? `<div class="field field--full"><label for="mf-project">Chantier destinataire</label>
            <select id="mf-project">${projects.map(p =>
              `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>` : ''}
          ${existing ? '' : `<div class="field field--full"><label for="mf-article">Matériau</label>
            <select id="mf-article">
              ${cats.map(c => `<optgroup label="${esc(c)}">${articles.filter(a => a.category === c).map(a =>
                `<option value="${a.id}" ${a.id === articleId ? 'selected' : ''} ${a.stock === 0 ? 'disabled' : ''}>${esc(a.name)} — ${fmt.dec(a.stock, 0)} ${a.unit} en stock${a.stock === 0 ? ' (rupture)' : ''}</option>`).join('')}</optgroup>`).join('')}
            </select></div>`}
          <div class="field"><label for="mf-qty">Quantité</label>
            <input id="mf-qty" type="number" min="1" step="1" value="${existing ? existing.qty : 10}"></div>
          <div class="field"><label for="mf-date">Date de sortie</label>
            <input id="mf-date" type="date" value="${existing ? existing.date : ERP.DB.today}"></div>
          <div class="field field--full"><label for="mf-note">Observation</label>
            <input id="mf-note" value="${existing ? esc(existing.note || '') : ''}" placeholder="Ex. : livraison directe sur site"></div>
        </div>
        <div class="pick" style="margin-top:16px" id="mf-recap"></div>`,
      footer: `<button class="btn" data-cancel type="button">Annuler</button>
               <button class="btn btn--primary" data-save type="button">${icon('save', 18)} ${existing ? 'Enregistrer' : 'Affecter au chantier'}</button>`
    });

    const q = (s) => m.body.querySelector(s);
    const selected = () => existing ? current : articles.find(a => a.id === q('#mf-article').value);

    function recap() {
      const a = selected();
      if (!a) return;
      const n = Math.max(0, +q('#mf-qty').value || 0);
      const before = existing ? a.stock + existing.qty : a.stock;
      const after = before - n;
      q('#mf-recap').innerHTML = `
        <div class="row" style="gap:26px;flex-wrap:wrap">
          <div><dt>Prix unitaire</dt><div class="money money--lg num">${fmt.dec(a.price, 2)} DT</div></div>
          <div><dt>Montant imputé au chantier</dt><div class="money money--lg num" style="color:var(--orange)">${fmt.money(n * a.price)}</div></div>
          <div><dt>Stock après affectation</dt>
            <div class="money money--lg num" style="color:${after < 0 ? 'var(--danger)' : after < a.min ? 'var(--warn)' : 'var(--ok)'}">
              ${fmt.dec(Math.max(0, after), 0)} ${a.unit}</div>
            <div class="small muted">${after < 0 ? `Dépassement de ${fmt.dec(-after, 0)} ${a.unit}`
              : after < a.min ? `Sous le seuil de ${fmt.dec(a.min, 0)} ${a.unit}` : `Seuil minimum : ${fmt.dec(a.min, 0)} ${a.unit}`}</div></div>
        </div>`;
    }

    if (!existing) q('#mf-article').onchange = recap;
    q('#mf-qty').oninput = recap;
    recap();

    m.foot.querySelector('[data-cancel]').onclick = m.close;
    m.foot.querySelector('[data-save]').onclick = async () => {
      const a = selected();
      const n = Math.max(0, +q('#mf-qty').value || 0);
      if (!a) { toast('Choisissez un matériau', 'danger'); return; }
      if (n < 1) { toast('Indiquez une quantité', 'danger'); return; }
      try {
        if (existing) {
          await ERP.Api.materials.update(existing.id, { qty: n, date: q('#mf-date').value, note: q('#mf-note').value.trim() });
          toast(`Quantité mise à jour — stock restant ${fmt.dec(liveStock(a.id), 0)} ${a.unit}`, 'ok', 2800);
        } else {
          await ERP.Api.materials.create({
            projectId: chooseProject ? q('#mf-project').value : projectId,
            articleId: a.id, qty: n,
            date: q('#mf-date').value, note: q('#mf-note').value.trim()
          });
          toast(`${n} ${a.unit} de ${a.name} affectés — stock restant ${fmt.dec(liveStock(a.id), 0)} ${a.unit}`, 'ok', 3200);
        }
        m.close(); done && done();
      } catch (err) {
        toast(`Stock insuffisant : ${fmt.dec(a.stock, 0)} ${a.unit} disponibles`, 'danger');
      }
    };
  }

  ERP.Articles = { openMaterialForm };
  ERP.Router.add('/articles', { title: 'Articles', sub: 'Stock et matériaux de chantier', render: renderList });
  ERP.Router.add('/articles/:id', { title: 'Articles', sub: 'Stock et matériaux de chantier', render: renderList });
})(window.ERP);

</script>
<script>
/* ===== js/suppliers.js ===== */
/* =========================================================
   BâtiPilot — Module FOURNISSEURS
   Carnet d'adresses des fournisseurs de matériaux : coordonnées,
   matériaux à la une et historique des livraisons par chantier.
   ========================================================= */
window.ERP = window.ERP || {};

(function (ERP) {
  'use strict';
  const { icon, fmt, badge, on, esc, toast, confirm } = ERP.UI;

  const state = { status: 'tous', city: 'tous', q: '', view: 'cards' };
  const STATUS = [['tous', 'Tous'], ['actif', 'Actifs'], ['occasionnel', 'Occasionnels']];

  const stars = (n) => {
    const full = Math.round(n);
    return `<span class="rating" title="${fmt.dec(n, 1)} sur 5">${
      Array.from({ length: 5 }, (_, i) => `<i class="${i < full ? 'is-on' : ''}">${icon('star', 14)}</i>`).join('')
    }<b class="num">${fmt.dec(n, 1)}</b></span>`;
  };

  /* =========================================================
     LISTE
     ========================================================= */
  async function renderList(params, view) {
    const cities = [...new Set(ERP.DB.suppliers.map(s => s.city))].sort();

    view.innerHTML = `
      <div class="toolbar">
        <div class="chips" id="frFilters"></div>
        <span class="spacer"></span>
        <div class="field" style="min-width:170px">
          <select id="frCity" aria-label="Filtrer par ville">
            <option value="tous">Toutes les villes</option>
            ${cities.map(c => `<option ${state.city === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}
          </select>
        </div>
        <div class="search-field" style="flex:0 1 240px">
          <span class="ico">${icon('search', 19)}</span>
          <input type="search" id="frSearch" placeholder="Société, contact, spécialité…" value="${esc(state.q)}">
        </div>
        <div class="segmented" id="frView">
          <button data-v="cards" class="${state.view === 'cards' ? 'is-active' : ''}">${icon('kanban', 17)} Cartes</button>
          <button data-v="table" class="${state.view === 'table' ? 'is-active' : ''}">${icon('list', 17)} Tableau</button>
        </div>
        <button class="btn btn--accent" id="frAdd" type="button">${icon('plus', 20)} Nouveau fournisseur</button>
      </div>
      <div id="frResults"></div>`;

    const results = view.querySelector('#frResults');

    async function refresh() {
      if (!results.isConnected) return;
      const all = await ERP.Api.suppliers.list({ q: state.q, city: state.city });
      view.querySelector('#frFilters').innerHTML = STATUS.map(([k, l]) => {
        const n = k === 'tous' ? all.length : all.filter(s => s.status === k).length;
        return `<button class="chip ${state.status === k ? 'is-active' : ''}" data-f="${k}" type="button">${l}<span class="chip__n num">${n}</span></button>`;
      }).join('');

      const list = state.status === 'tous' ? all : all.filter(s => s.status === state.status);
      const urgent = list.filter(s => s.ruptures > 0);

      if (!list.length) {
        results.innerHTML = ERP.UI.empty('Aucun fournisseur',
          'Modifiez la recherche ou enregistrez un nouveau fournisseur.');
        return;
      }

      results.innerHTML = `
        ${urgent.length ? `<div class="alert-band" style="margin-bottom:var(--gap)">
          <span class="hazard"></span>
          <div><strong>${urgent.length} fournisseur${urgent.length > 1 ? 's' : ''} à relancer</strong>
          <small>${esc(urgent.map(s => s.company).slice(0, 3).join(', '))}${urgent.length > 3 ? '…' : ''} — au moins une référence en rupture de stock.</small></div>
        </div>` : ''}

        ${state.view === 'cards'
          ? `<div class="projects-grid">${list.map(card).join('')}</div>`
          : `<div class="card"><div class="table-wrap"><table class="tbl">
              <thead><tr><th>Fournisseur</th><th>Interlocuteur</th><th>Téléphone</th><th>Ville</th>
                <th class="t-right">Références</th><th class="t-right">Délai</th><th>Évaluation</th><th>Stock</th></tr></thead>
              <tbody>${list.map(s => `<tr class="is-clickable" data-id="${s.id}">
                <td><div class="cell-main">${esc(s.company)}</div><div class="cell-sub">${esc(s.specialty)}</div></td>
                <td>${esc(s.contact)}</td>
                <td class="num">${esc(s.phone)}</td>
                <td>${esc(s.city)}</td>
                <td class="t-right num">${s.articleCount}<div class="cell-sub">${s.featuredCount} à la une</div></td>
                <td class="t-right num">${s.leadDays} j</td>
                <td>${stars(s.rating)}</td>
                <td>${s.ruptures ? `<span class="badge badge--danger">${s.ruptures} rupture${s.ruptures > 1 ? 's' : ''}</span>`
                  : s.alerts ? `<span class="badge badge--warn">${s.alerts} en tension</span>`
                  : '<span class="badge badge--ok">Approvisionné</span>'}</td>
              </tr>`).join('')}</tbody></table></div></div>`}`;
    }

    function card(s) {
      const featured = ERP.DB.articles.filter(a => s.featured.includes(a.id));
      return `<article class="card project-card" data-id="${s.id}">
        <div class="project-card__head">
          <div style="min-width:0;flex:1">
            <h3>${esc(s.company)}</h3>
            <div class="project-card__client">${icon('truck', 14)} ${esc(s.specialty)} · ${esc(s.city)}</div>
          </div>
          ${s.ruptures ? `<span class="badge badge--danger">${s.ruptures} rupture${s.ruptures > 1 ? 's' : ''}</span>`
            : badge('supplier', s.status)}
        </div>

        <div class="sup-contact">
          <span>${icon('user', 15)} ${esc(s.contact)}</span>
          <span class="num">${icon('phone', 15)} ${esc(s.phone)}</span>
        </div>

        ${featured.length ? `<div class="sup-featured">
          <div class="eyebrow" style="margin-bottom:7px">${icon('star', 13)} À la une</div>
          ${featured.map(a => `<div class="sup-featured__row">
            <span class="sup-dot sup-dot--${a.stockStatus}"></span>
            <span style="flex:1;min-width:0">${esc(a.name)}</span>
            <b class="num">${fmt.dec(a.price, 2)} DT</b>
          </div>`).join('')}
        </div>` : ''}

        <div class="project-card__grid" style="grid-template-columns:repeat(3,1fr)">
          <div><dt>Références</dt><dd class="num">${s.articleCount}</dd></div>
          <div><dt>Délai moyen</dt><dd class="num">${s.leadDays} j</dd></div>
          <div><dt>Achats</dt><dd class="num">${fmt.moneyShort(s.purchases)}</dd></div>
        </div>

        <div class="project-card__foot">
          ${stars(s.rating)}
          <span class="spacer"></span>
          <button class="btn btn--sm" data-call="${s.phone}" type="button">${icon('phone', 16)} Appeler</button>
        </div>
      </article>`;
    }

    await refresh();

    on(view, 'click', '.chip[data-f]', (e, t) => { state.status = t.dataset.f; refresh(); });
    on(view, 'click', '#frView button', (e, t) => {
      state.view = t.dataset.v;
      view.querySelectorAll('#frView button').forEach(b => b.classList.toggle('is-active', b === t));
      refresh();
    });
    view.querySelector('#frCity').onchange = (e) => { state.city = e.target.value; refresh(); };
    view.querySelector('#frSearch').addEventListener('input',
      ERP.UI.debounce((e) => { state.q = e.target.value; refresh(); }, 200));
    view.querySelector('#frAdd').onclick = () => openForm(refresh, null);
    on(view, 'click', '[data-call]', (e, b) => {
      e.stopPropagation();
      toast('Appel vers ' + b.dataset.call + ' (simulé)', 'info');
    });
    on(view, 'click', '[data-id]', (e, t) => {
      if (e.target.closest('[data-call]')) return;
      ERP.Router.go('/fournisseurs/' + t.dataset.id);
    });
  }

  /* =========================================================
     FICHE FOURNISSEUR
     ========================================================= */
  async function renderDetail(params, view) {
    view.innerHTML = ERP.UI.skeleton(2);
    const s = await ERP.Api.suppliers.get(params.id);
    if (!s) { view.innerHTML = ERP.UI.empty('Fournisseur introuvable', 'Ce fournisseur a peut-être été supprimé.'); return; }

    view.innerHTML = `
      <div class="backbar">
        <button class="icon-btn" data-back type="button" aria-label="Retour">${icon('arrowLeft', 22)}</button>
        <span class="avatar avatar--lg">${esc(s.company.replace(/[^A-Za-zÀ-ÿ ]/g, '').split(' ').filter(Boolean).map(x => x[0]).slice(0, 2).join(''))}</span>
        <div><h2 style="font-size:24px">${esc(s.company)}</h2>
          <div class="crumb">${esc(s.specialty)} · Fournisseur depuis ${fmt.dateLong(s.since)}</div></div>
        ${badge('supplier', s.status)}
        <span class="spacer"></span>
        <button class="btn btn--sm" data-call type="button">${icon('phone', 18)} Appeler</button>
        <button class="btn btn--sm" data-mail type="button">${icon('mail', 18)} Écrire</button>
        <button class="btn btn--sm btn--primary" data-order type="button">${icon('truck', 18)} Demander un devis</button>
      </div>

      ${s.ruptures ? `<div class="alert-band" style="margin-bottom:var(--gap)">
        <span class="hazard"></span>
        <div><strong>${s.ruptures} référence${s.ruptures > 1 ? 's' : ''} en rupture chez ce fournisseur</strong>
        <small>Délai annoncé : ${s.leadDays} jour${s.leadDays > 1 ? 's' : ''}. Passez commande pour éviter l'arrêt des chantiers concernés.</small></div>
      </div>` : ''}

      <div class="kpis" style="grid-template-columns:repeat(4,minmax(0,1fr))">
        <div class="kpi"><div class="kpi__top"><span class="kpi__ico">${icon('package', 19)}</span><span class="kpi__label">Références</span></div>
          <div class="kpi__value num">${s.articleCount}</div>
          <div class="kpi__foot">${s.featuredCount} matériaux à la une</div></div>
        <div class="kpi ${s.alerts ? 'kpi--alert' : ''}"><div class="kpi__top"><span class="kpi__ico ${s.alerts ? 'kpi__ico--danger' : 'kpi__ico--ok'}">${icon('alert', 19)}</span><span class="kpi__label">Stock en tension</span></div>
          <div class="kpi__value num">${s.alerts}</div>
          <div class="kpi__foot">${s.ruptures} en rupture</div></div>
        <div class="kpi"><div class="kpi__top"><span class="kpi__ico kpi__ico--warn">${icon('wallet', 19)}</span><span class="kpi__label">Achats cumulés</span></div>
          <div class="kpi__value num" style="font-size:28px">${fmt.moneyShort(s.purchases)}</div>
          <div class="kpi__foot">Sur ${s.projectCount} chantier${s.projectCount > 1 ? 's' : ''}</div></div>
        <div class="kpi"><div class="kpi__top"><span class="kpi__ico kpi__ico--orange">${icon('clock', 19)}</span><span class="kpi__label">Délai de livraison</span></div>
          <div class="kpi__value num">${s.leadDays}<span>j</span></div>
          <div class="kpi__foot">${s.lastMove ? 'Dernier mouvement le ' + fmt.date(s.lastMove) : 'Aucun mouvement'}</div></div>
      </div>

      <div class="dash-cols">
        <div class="stack">
          <section class="card">
            <div class="card__head"><h3>Matériaux fournis</h3>
              <span class="tag num">${s.articleCount}</span>
              <span class="spacer"></span>
              <span class="small muted">Touchez l'étoile pour mettre un matériau à la une</span></div>
            <div class="card__body card__body--flush">
              ${s.articles.length ? `<div class="table-wrap"><table class="tbl tbl--rows">
                <thead><tr><th style="width:56px">À la une</th><th style="min-width:220px">Matériau</th>
                  <th>Catégorie</th><th class="t-right">Prix unitaire</th>
                  <th class="t-right">Stock</th><th>État</th><th class="t-right">Action</th></tr></thead>
                <tbody>${s.articles.map(a => `<tr data-art="${a.id}">
                  <td><button class="star-btn ${a.isFeatured ? 'is-on' : ''}" data-star type="button"
                        aria-label="${a.isFeatured ? 'Retirer de la une' : 'Mettre à la une'}">${icon('star', 20)}</button></td>
                  <td><div class="cell-main">${esc(a.name)}</div><div class="cell-sub num">${a.ref}</div></td>
                  <td class="small">${esc(a.category)}</td>
                  <td class="t-right num">${fmt.dec(a.price, 2)} DT</td>
                  <td class="t-right num"><b>${fmt.dec(a.stock, 0)}</b> ${a.unit}
                    <div class="cell-sub">seuil ${fmt.dec(a.min, 0)}</div></td>
                  <td>${badge('stock', a.stockStatus)}</td>
                  <td><div class="row-actions">
                    <button class="btn btn--sm" data-affect type="button">${icon('plus', 16)} Affecter</button>
                  </div></td>
                </tr>`).join('')}</tbody></table></div>`
                : ERP.UI.empty('Aucun matériau rattaché',
                    'Rattachez des articles à ce fournisseur depuis le module Articles.')}
            </div>
          </section>

          <section class="card">
            <div class="card__head"><h3>Livraisons vers les chantiers</h3><span class="spacer"></span>
              <span class="tag num">${s.deliveries.length} mouvement${s.deliveries.length > 1 ? 's' : ''}</span></div>
            <div class="card__body card__body--flush">
              ${s.deliveries.length ? `<div class="table-wrap"><table class="tbl">
                <thead><tr><th>Matériau</th><th>Chantier</th><th class="t-right">Quantité</th>
                  <th class="t-right">Montant</th><th>Date</th></tr></thead>
                <tbody>${s.deliveries.map(d => `<tr class="is-clickable" data-project="${d.projectId}">
                  <td class="cell-main">${esc(d.article)}</td>
                  <td>${esc(d.projectName)}</td>
                  <td class="t-right num">${fmt.dec(d.qty, 0)} ${d.unit}</td>
                  <td class="t-right money num">${fmt.money(d.amount)}</td>
                  <td class="num">${fmt.date(d.date)}</td></tr>`).join('')}
                  <tr><td class="cell-main">Total</td><td></td><td></td>
                    <td class="t-right money num"><b>${fmt.money(s.purchases)}</b></td><td></td></tr>
                </tbody></table></div>`
                : '<div class="pick__empty">Aucune livraison enregistrée pour ce fournisseur.</div>'}
            </div>
          </section>
        </div>

        <div class="stack">
          <section class="card">
            <div class="card__head"><h3>Coordonnées</h3><span class="spacer"></span>
              <button class="btn btn--sm btn--ghost" data-edit type="button">${icon('edit', 17)}</button></div>
            <div class="card__body">
              <dl class="props" style="grid-template-columns:1fr">
                <div class="prop"><dt>Raison sociale</dt><dd>${esc(s.company)}</dd></div>
                <div class="prop"><dt>Interlocuteur</dt><dd>${esc(s.contact)}</dd></div>
                <div class="prop"><dt>Téléphone</dt><dd class="num">${esc(s.phone)}</dd></div>
                <div class="prop"><dt>E-mail</dt><dd style="font-size:14px">${esc(s.email)}</dd></div>
                <div class="prop"><dt>Adresse</dt><dd style="font-size:14px;font-weight:500">${esc(s.address)}<br>${esc(s.city)}</dd></div>
                <div class="prop"><dt>Matricule fiscal</dt><dd class="num">${esc(s.taxId)}</dd></div>
                <div class="prop"><dt>Conditions de paiement</dt><dd>${esc(s.payment)}</dd></div>
              </dl>
              <div class="capture-row" style="margin-top:16px">
                <button class="btn btn--block" data-call2 type="button">${icon('phone', 18)} ${esc(s.phone)}</button>
                <button class="btn btn--block" data-mail2 type="button">${icon('mail', 18)} Envoyer un e-mail</button>
                <button class="btn btn--block" data-map type="button">${icon('mapPin', 18)} Itinéraire vers le dépôt</button>
              </div>
            </div>
          </section>

          <section class="card">
            <div class="card__head"><h3>Évaluation</h3></div>
            <div class="card__body">
              <div class="row" style="gap:14px;margin-bottom:14px">
                ${stars(s.rating)}
                <span class="spacer"></span>
                <input id="fr-rate" type="range" min="1" max="5" step="0.5" value="${s.rating}" style="flex:0 0 150px;height:40px">
              </div>
              <div class="field"><label for="fr-note">Note interne</label>
                <textarea id="fr-note" rows="3" placeholder="Ex. : livraisons ponctuelles, exiger le bon de pesée">${esc(s.note || '')}</textarea></div>
              <button class="btn btn--primary btn--block" style="margin-top:12px" data-savenote type="button">${icon('save', 18)} Enregistrer</button>
            </div>
          </section>
        </div>
      </div>`;

    const reload = () => renderDetail(params, view);

    view.querySelector('[data-back]').onclick = () => window.history.back();
    const call = () => toast('Appel vers ' + s.phone + ' (simulé)', 'info');
    const mail = () => toast('Brouillon d\'e-mail vers ' + s.email + ' (simulé)', 'info');
    view.querySelector('[data-call]').onclick = call;
    view.querySelector('[data-call2]').onclick = call;
    view.querySelector('[data-mail]').onclick = mail;
    view.querySelector('[data-mail2]').onclick = mail;
    view.querySelector('[data-map]').onclick = () => toast(`Itinéraire vers ${s.address}, ${s.city} (simulé)`, 'info', 3000);
    view.querySelector('[data-order]').onclick = () => {
      const short = s.articles.filter(a => a.stockStatus !== 'ok');
      toast(short.length
        ? `Demande de devis envoyée pour ${short.length} référence${short.length > 1 ? 's' : ''} (simulé)`
        : 'Demande de devis envoyée (simulé)', 'ok', 3000);
    };
    view.querySelector('[data-edit]').onclick = () => openForm(reload, s);
    view.querySelector('[data-savenote]').onclick = async () => {
      await ERP.Api.suppliers.update(s.id, {
        rating: +view.querySelector('#fr-rate').value,
        note: view.querySelector('#fr-note').value.trim()
      });
      toast('Évaluation enregistrée', 'ok');
      reload();
    };

    /* Matériaux à la une */
    on(view, 'click', '[data-star]', async (e, b) => {
      const articleId = b.closest('[data-art]').dataset.art;
      const r = await ERP.Api.suppliers.toggleFeatured(s.id, articleId);
      b.classList.toggle('is-on', r.featured);
      const a = s.articles.find(x => x.id === articleId);
      toast(r.featured ? `${a.name} mis à la une` : `${a.name} retiré de la une`, 'ok', 2000);
    });

    /* Affecter directement un matériau à un chantier */
    on(view, 'click', '[data-affect]', async (e, b) => {
      const articleId = b.closest('[data-art]').dataset.art;
      const projects = (await ERP.Api.projects.list()).filter(p => p.status !== 'termine');
      if (!projects.length) { toast('Aucun chantier ouvert', 'warn'); return; }
      ERP.Articles.openMaterialForm(reload, { articleId, chooseProject: true }, null);
    });

    on(view, 'click', '[data-project]', (e, t) => ERP.Router.go('/projets/' + t.dataset.project));
  }

  /* =========================================================
     FORMULAIRE
     ========================================================= */
  function openForm(done, s) {
    const m = ERP.UI.modal({
      title: s ? 'Modifier le fournisseur' : 'Nouveau fournisseur',
      sub: s ? esc(s.company) : 'Carnet d\'adresses des matériaux',
      body: `<div class="form-grid">
          <div class="field field--full"><label for="f-company">Raison sociale</label>
            <input id="f-company" value="${s ? esc(s.company) : ''}" placeholder="Ex. : Ciments de Bizerte"></div>
          <div class="field"><label for="f-contact">Interlocuteur</label>
            <input id="f-contact" value="${s ? esc(s.contact) : ''}" placeholder="Nom et prénom"></div>
          <div class="field"><label for="f-specialty">Spécialité</label>
            <input id="f-specialty" value="${s ? esc(s.specialty) : ''}" placeholder="Ex. : granulats et sables"></div>
          <div class="field"><label for="f-phone">Téléphone</label>
            <input id="f-phone" value="${s ? esc(s.phone) : ''}" placeholder="+216 ..."></div>
          <div class="field"><label for="f-email">E-mail</label>
            <input id="f-email" type="email" value="${s ? esc(s.email) : ''}" placeholder="contact@societe.tn"></div>
          <div class="field field--full"><label for="f-address">Adresse du dépôt</label>
            <input id="f-address" value="${s ? esc(s.address) : ''}" placeholder="Rue, zone, repère"></div>
          <div class="field"><label for="f-city">Ville</label>
            <input id="f-city" value="${s ? esc(s.city) : ''}" placeholder="Tunis"></div>
          <div class="field"><label for="f-tax">Matricule fiscal</label>
            <input id="f-tax" value="${s ? esc(s.taxId) : ''}" placeholder="0000000/A/M/000"></div>
          <div class="field"><label for="f-lead">Délai de livraison (jours)</label>
            <input id="f-lead" type="number" min="0" max="120" value="${s ? s.leadDays : 3}"></div>
          <div class="field"><label for="f-pay">Conditions de paiement</label>
            <select id="f-pay">${['Comptant à la livraison', '30 jours fin de mois', '45 jours', '60 jours fin de mois']
              .map(o => `<option ${s && s.payment === o ? 'selected' : ''}>${o}</option>`).join('')}</select></div>
          <div class="field"><label for="f-status">Statut</label>
            <select id="f-status">
              <option value="actif" ${s && s.status === 'actif' ? 'selected' : ''}>Actif</option>
              <option value="occasionnel" ${s && s.status === 'occasionnel' ? 'selected' : ''}>Occasionnel</option>
            </select></div>
        </div>`,
      footer: `${s ? `<button class="btn btn--danger" data-del type="button">${icon('trash', 18)} Supprimer</button>` : ''}
               <span style="flex:1"></span>
               <button class="btn" data-cancel type="button">Annuler</button>
               <button class="btn btn--primary" data-save type="button">${icon('save', 18)} ${s ? 'Enregistrer' : 'Créer le fournisseur'}</button>`
    });

    const g = (id) => m.body.querySelector(id).value.trim();
    m.foot.querySelector('[data-cancel]').onclick = m.close;
    m.foot.querySelector('[data-save]').onclick = async () => {
      if (!g('#f-company')) { toast('La raison sociale est obligatoire', 'danger'); return; }
      if (!g('#f-phone')) { toast('Le téléphone est obligatoire pour pouvoir contacter le fournisseur', 'danger'); return; }
      const payload = {
        company: g('#f-company'), contact: g('#f-contact') || '—', specialty: g('#f-specialty') || 'Matériaux généraux',
        phone: g('#f-phone'), email: g('#f-email'), address: g('#f-address'), city: g('#f-city') || 'Tunis',
        taxId: g('#f-tax'), leadDays: +g('#f-lead') || 0,
        payment: m.body.querySelector('#f-pay').value, status: m.body.querySelector('#f-status').value
      };
      if (s) { await ERP.Api.suppliers.update(s.id, payload); toast('Fournisseur mis à jour', 'ok'); }
      else { await ERP.Api.suppliers.create(payload); toast('Fournisseur enregistré', 'ok'); }
      m.close(); done && done();
    };
    if (s) m.foot.querySelector('[data-del]').onclick = async () => {
      const ok = await confirm({
        title: 'Supprimer ce fournisseur ?', danger: true, confirmLabel: 'Supprimer',
        text: `<b>${esc(s.company)}</b> sera retiré du carnet d'adresses. Les ${s.articleCount} article${s.articleCount > 1 ? 's' : ''} rattaché${s.articleCount > 1 ? 's' : ''} et les mouvements de stock sont conservés.`
      });
      if (ok) { await ERP.Api.suppliers.remove(s.id); m.close(); toast('Fournisseur supprimé', 'ok'); ERP.Router.go('/fournisseurs'); }
    };
  }

  ERP.Suppliers = { openForm };
  ERP.Router.add('/fournisseurs', { title: 'Fournisseurs', sub: 'Carnet d\'adresses des matériaux', render: renderList });
  ERP.Router.add('/fournisseurs/:id', { title: 'Fiche fournisseur', sub: 'Coordonnées et matériaux', render: renderDetail });
})(window.ERP);

</script>
<script>
/* ===== js/budget.js ===== */
/* =========================================================
   BâtiPilot — Module BUDGET & COÛTS
   ========================================================= */
window.ERP = window.ERP || {};

(function (ERP) {
  'use strict';
  const { icon, fmt, badge, pbar, progressClass, on, esc, toast } = ERP.UI;
  const C = ERP.Charts.colors;

  const state = { projectId: 'tous' };

  async function render(params, view) {
    view.innerHTML = ERP.UI.skeleton(2);
    const [sum, projects] = await Promise.all([ERP.Api.budget.summary(), ERP.Api.budget.projects()]);

    view.innerHTML = `
      <div class="toolbar">
        <div class="field" style="min-width:280px">
          <select id="bgProject" aria-label="Filtrer par chantier">
            <option value="tous">Tous les chantiers actifs</option>
            ${projects.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}
          </select>
        </div>
        <span class="spacer"></span>
        <button class="btn btn--sm" id="bgExport">${icon('download', 17)} Exporter la synthèse</button>
      </div>

      <div class="grid-2" style="align-items:start">
        <section class="card">
          <div class="card__head"><h3>Synthèse financière</h3><span class="spacer"></span>
            <span class="badge ${sum.burn >= 80 ? 'badge--danger' : sum.burn >= 70 ? 'badge--warn' : 'badge--ok'}">${sum.burn} % consommé</span></div>
          <div class="card__body card__body--flush">
            <dl class="stat-band">
              <div><dt>Budget total</dt><dd class="money money--xl num" style="margin:4px 0 0">${fmt.money(sum.budget)}</dd>
                <div class="small muted">${projects.length} chantiers actifs</div></div>
              <div><dt>Consommé</dt><dd class="money money--xl num" style="margin:4px 0 0;color:var(--orange)">${fmt.money(sum.spent)}</dd>
                <div class="small muted">Dépenses engagées</div></div>
              <div><dt>Reste disponible</dt><dd class="money money--xl num" style="margin:4px 0 0;color:var(--ok)">${fmt.money(sum.remaining)}</dd>
                <div class="small muted">Avant clôture des chantiers</div></div>
            </dl>
            <div style="padding:18px">${pbar(sum.burn, progressClass(sum.burn))}</div>
          </div>
        </section>

        <section class="card">
          <div class="card__head"><h3>Répartition budget / dépenses</h3></div>
          <div class="card__body row" style="gap:24px;justify-content:center;flex-wrap:wrap">
            <div id="bgDonut" style="width:230px"></div>
            <div class="stack" style="gap:12px;min-width:190px" id="bgDonutLegend"></div>
          </div>
        </section>
      </div>

      <div class="grid-2" style="align-items:start;margin-top:var(--gap)">
        <section class="card">
          <div class="card__head"><h3>Dépenses par catégorie</h3><span class="spacer"></span>
            <span class="tag" id="bgCatTotal"></span></div>
          <div class="card__body" id="bgCats"></div>
        </section>

        <section class="card">
          <div class="card__head"><h3>Budget prévu et dépenses par chantier</h3></div>
          <div class="card__body chart-box" id="bgBars"></div>
          <div class="card__foot">${ERP.Charts.legend([
            { label: 'Budget prévu', color: C.navy }, { label: 'Dépenses', color: C.orange }, { label: 'Reste', color: C.ok }
          ])}</div>
        </section>
      </div>

      <section class="card" style="margin-top:var(--gap)">
        <div class="card__head"><h3>Suivi budgétaire par chantier</h3><span class="spacer"></span>
          <span class="badge badge--warn">${projects.filter(p => p.burn >= 80).length} au-delà de 80 %</span></div>
        <div class="card__body card__body--flush"><div class="table-wrap">
          <table class="tbl"><thead><tr>
            <th>Chantier</th><th>Client</th><th class="t-right">Budget initial</th><th class="t-right">Consommé</th>
            <th class="t-right">Reste</th><th style="min-width:180px">Taux de consommation</th><th>Écart / avancement</th>
          </tr></thead><tbody>
            ${projects.map(p => {
              const gap = p.burn - p.progress;
              return `<tr class="is-clickable" data-id="${p.id}">
                <td><div class="cell-main">${esc(p.name)}</div><div class="cell-sub num">${p.ref}</div></td>
                <td class="small">${esc(p.clientName)}</td>
                <td class="t-right money num">${fmt.money(p.budget)}</td>
                <td class="t-right money num">${fmt.money(p.spent)}</td>
                <td class="t-right money num" style="color:${p.remaining < 0 ? 'var(--danger)' : 'var(--ok)'}">${fmt.money(p.remaining)}</td>
                <td><div class="pbar-row">${pbar(p.burn, progressClass(p.burn))}<b class="num">${p.burn}%</b></div></td>
                <td>${gap > 10 ? `<span class="badge badge--danger">+${Math.round(gap)} pts</span>`
                  : gap > 0 ? `<span class="badge badge--warn">+${Math.round(gap)} pts</span>`
                  : `<span class="badge badge--ok">${Math.round(gap)} pts</span>`}</td>
              </tr>`;
            }).join('')}
          </tbody></table>
        </div></div>
        <div class="card__foot small muted">
          L'écart compare le taux de consommation du budget au pourcentage d'avancement : au-delà de +10 points, le chantier dépense plus vite qu'il n'avance.
        </div>
      </section>`;

    async function draw() {
      const scope = state.projectId === 'tous' ? null : projects.find(p => p.id === state.projectId);
      const budget = scope ? scope.budget : sum.budget;
      const spent = scope ? scope.spent : sum.spent;
      const remaining = budget - spent;

      ERP.Charts.donut(view.querySelector('#bgDonut'), {
        items: [{ label: 'Dépenses', value: spent, color: C.orange }, { label: 'Reste', value: Math.max(0, remaining), color: C.navy }],
        center: { value: Math.round(spent / budget * 100) + ' %', label: 'consommé' }, size: 230, thickness: 32
      });
      view.querySelector('#bgDonutLegend').innerHTML = [
        ['Budget prévu', budget, C.faint], ['Dépenses', spent, C.orange], ['Reste', remaining, C.navy]
      ].map(([l, v, c]) => `
        <div class="row" style="gap:10px">
          <i style="width:12px;height:12px;border-radius:3px;background:${c};flex:none"></i>
          <div><div class="small muted">${l}</div><div class="money num" style="font-size:19px">${fmt.money(v)}</div></div>
        </div>`).join('');

      const cats = await ERP.Api.budget.categories({ projectId: state.projectId });
      ERP.Charts.hbars(view.querySelector('#bgCats'), { items: cats, formatter: fmt.money });
      view.querySelector('#bgCatTotal').textContent = fmt.money(cats.reduce((s, c) => s + c.amount, 0));

      const shown = scope ? [scope] : projects;
      ERP.Charts.bars(view.querySelector('#bgBars'), {
        labels: shown.map(p => p.name.split(' ').slice(0, 2).join(' ')),
        series: [
          { name: 'Budget prévu', color: C.navy, data: shown.map(p => p.budget) },
          { name: 'Dépenses', color: C.orange, data: shown.map(p => p.spent) },
          { name: 'Reste', color: C.ok, data: shown.map(p => Math.max(0, p.remaining)) }
        ],
        formatter: (v) => v >= 1000 ? Math.round(v / 1000) + 'k' : v, height: 290
      });
    }
    await draw();

    view.querySelector('#bgProject').onchange = (e) => { state.projectId = e.target.value; draw(); };
    view.querySelector('#bgExport').onclick = () => toast('Synthèse budgétaire exportée (XLSX simulé)', 'ok');
    on(view, 'click', 'tr[data-id]', (e, t) => ERP.Router.go('/projets/' + t.dataset.id));
  }

  ERP.Router.add('/budgets', { title: 'Budgets & coûts', sub: 'Engagement financier des chantiers', render });
})(window.ERP);

</script>
<script>
/* ===== js/tasks.js ===== */
/* =========================================================
   BâtiPilot — Module TÂCHES
   Deux volets : le suivi des tâches des chantiers (liste
   pilotable ligne par ligne) et le catalogue paramétrable
   qui alimente la création de projet.
   ========================================================= */
window.ERP = window.ERP || {};
window.ERP.Components = window.ERP.Components || {};

(function (ERP) {
  'use strict';
  const { icon, fmt, badge, pbar, on, esc, toast, confirm } = ERP.UI;

  const COLUMNS = [
    { key: 'a_faire', label: 'À faire' },
    { key: 'en_cours', label: 'En cours' },
    { key: 'bloque', label: 'Bloqué' },
    { key: 'termine', label: 'Terminé' }
  ];

  const state = { tab: 'suivi', projectId: 'tous', status: 'tous', priority: 'tous', q: '' };

  /* =========================================================
     LIGNE DE TÂCHE — pilotable sur place
     ========================================================= */
  function taskRow(t, showProject) {
    const d = ERP.dt.diff(ERP.DB.today, t.due);
    return `<tr data-task="${t.id}">
      <td>
        <div class="cell-main">${esc(t.title)}</div>
        <div class="cell-sub num">${t.id}${showProject ? ' · ' + esc(t.projectName) : ' · débutée le ' + fmt.date(t.start)}</div>
      </td>
      <td>${esc(t.assignee)}</td>
      <td class="num" ${t.late ? 'style="color:var(--danger);font-weight:700"' : ''}>
        ${fmt.date(t.due)}
        <div class="cell-sub">${t.status === 'termine' ? 'clôturée' : t.late ? `+${-d} j de retard` : d === 0 ? 'ce jour' : `dans ${d} j`}</div>
      </td>
      <td>${badge('priority', t.priority)}</td>
      <td>
        <div class="stepper">
          <button class="stepper__btn" data-step="-10" type="button" aria-label="Reculer l'avancement">${icon('minus', 16)}</button>
          <div class="stepper__bar">${pbar(t.progress, t.late ? 'pbar__fill--danger' : t.status === 'termine' ? 'pbar__fill--ok' : '', true)}
            <b class="num">${t.progress}%</b></div>
          <button class="stepper__btn" data-step="10" type="button" aria-label="Avancer la tâche">${icon('plus', 16)}</button>
        </div>
      </td>
      <td>
        <select class="select--mini" data-status aria-label="Statut de la tâche">
          ${COLUMNS.map(c => `<option value="${c.key}" ${t.status === c.key ? 'selected' : ''}>${c.label}</option>`).join('')}
        </select>
      </td>
      <td>
        <div class="row-actions">
          <button class="icon-btn icon-btn--sm" data-edit type="button" aria-label="Modifier la tâche">${icon('edit', 17)}</button>
          <button class="icon-btn icon-btn--sm icon-btn--danger" data-del type="button" aria-label="Supprimer la tâche">${icon('trash', 17)}</button>
        </div>
      </td>
    </tr>`;
  }

  function taskTable(tasks, showProject) {
    return `<div class="table-wrap"><table class="tbl tbl--rows">
      <thead><tr>
        <th style="min-width:240px">Tâche</th><th>Responsable</th><th>Échéance</th>
        <th>Priorité</th><th style="min-width:190px">Avancement</th>
        <th style="min-width:150px">Statut</th><th class="t-right">Actions</th>
      </tr></thead>
      <tbody>${tasks.map(t => taskRow(t, showProject)).join('')}</tbody>
    </table></div>`;
  }

  /** Branche les commandes de ligne (avancement, statut, édition, suppression). */
  function bindRows(container, refresh, onChange) {
    const done = async (msg) => { await refresh(); toast(msg, 'ok', 2200); onChange && onChange(); };
    const taskOf = async (b) => {
      const id = b.closest('[data-task]').dataset.task;
      return (await ERP.Api.tasks.list()).find(x => x.id === id);
    };

    on(container, 'click', '[data-step]', async (e, b) => {
      const t = await taskOf(b);
      const next = Math.max(0, Math.min(100, t.progress + (+b.dataset.step)));
      if (next === t.progress) return;
      const patch = { progress: next };
      if (next === 100) patch.status = 'termine';
      else if (t.status === 'termine') patch.status = 'en_cours';
      else if (next > 0 && t.status === 'a_faire') patch.status = 'en_cours';
      await ERP.Api.tasks.update(t.id, patch);
      done(`${t.title} — avancement ${next} %`);
    });

    on(container, 'change', '[data-status]', async (e, sel) => {
      const id = sel.closest('[data-task]').dataset.task;
      const patch = { status: sel.value };
      if (sel.value === 'termine') patch.progress = 100;
      await ERP.Api.tasks.update(id, patch);
      done(`Statut : ${ERP.UI.label('task', sel.value)}`);
    });

    on(container, 'click', '[data-edit]', (e, b) =>
      openSheet(b.closest('[data-task]').dataset.task, () => { refresh(); onChange && onChange(); }));

    on(container, 'click', '[data-del]', async (e, b) => {
      const t = await taskOf(b);
      const ok = await confirm({
        title: 'Supprimer cette tâche ?', danger: true, confirmLabel: 'Supprimer',
        text: `<b>${esc(t.title)}</b> sera retirée du chantier et du planning. Cette action est irréversible.`
      });
      if (ok) { await ERP.Api.tasks.remove(t.id); done('Tâche supprimée'); }
    });
  }

  /* =========================================================
     COMPOSANT — Tâches d'un chantier (fiche projet)
     ========================================================= */
  ERP.Components.taskRows = async function (container, { projectId, onChange } = {}) {
    if (!container) return;

    async function draw() {
      if (!container.isConnected) return;
      const tasks = await ERP.Api.tasks.list({ projectId });
      const late = tasks.filter(t => t.late).length;
      const finished = tasks.filter(t => t.status === 'termine').length;
      container.innerHTML = `
        <div class="card__head">
          <h3>Tâches du chantier</h3>
          <span class="tag num">${finished}/${tasks.length} terminées</span>
          <span class="spacer"></span>
          ${late ? `<span class="badge badge--danger">${late} en retard</span>` : ''}
          <button class="btn btn--sm btn--accent" data-add type="button">${icon('plus', 18)} Ajouter</button>
        </div>
        <div class="card__body card__body--flush">
          ${tasks.length ? taskTable(tasks, false) : ERP.UI.empty('Aucune tâche sur ce chantier',
            'Ajoutez une tâche depuis le catalogue pour suivre l\'avancement des équipes.')}
        </div>`;
    }

    bindRows(container, draw, onChange);
    on(container, 'click', '[data-add]', () =>
      openForm(() => { draw(); onChange && onChange(); }, { projectId }));
    await draw();
  };

  /* =========================================================
     PAGE — Suivi des tâches + Catalogue
     ========================================================= */
  async function render(params, view) {
    const qs = ERP.Router.query();
    if (qs.projet) { state.projectId = qs.projet; state.tab = 'suivi'; }
    if (qs.onglet) state.tab = qs.onglet;

    view.innerHTML = `
      <div class="tabs" id="tkTabs">
        <button data-t="suivi" class="${state.tab === 'suivi' ? 'is-active' : ''}">${icon('checkSquare', 18)} Suivi des tâches</button>
        <button data-t="catalogue" class="${state.tab === 'catalogue' ? 'is-active' : ''}">${icon('settings', 18)} Catalogue des tâches</button>
      </div>
      <div id="tkPanel"></div>`;

    const panel = view.querySelector('#tkPanel');
    on(view, 'click', '#tkTabs button', (e, b) => {
      state.tab = b.dataset.t;
      view.querySelectorAll('#tkTabs button').forEach(x => x.classList.toggle('is-active', x === b));
      state.tab === 'suivi' ? renderTracking(panel) : renderCatalog(panel);
    });

    state.tab === 'suivi' ? renderTracking(panel) : renderCatalog(panel);
  }

  /* ---------- Volet 1 : suivi ---------- */
  async function renderTracking(panel) {
    const projects = (await ERP.Api.projects.list()).filter(p => p.status !== 'termine');

    panel.innerHTML = `
      <div class="toolbar">
        <div class="chips" id="tkStatus">
          ${[['tous', 'Toutes'], ...COLUMNS.map(c => [c.key, c.label]), ['retard', 'En retard']].map(([k, l]) =>
            `<button class="chip ${state.status === k ? 'is-active' : ''}" data-s="${k}" type="button">${l}<span class="chip__n num" data-n="${k}">0</span></button>`).join('')}
        </div>
        <span class="spacer"></span>
        <div class="field" style="min-width:200px">
          <select id="tkProject" aria-label="Filtrer par chantier">
            <option value="tous">Tous les chantiers</option>
            ${projects.map(p => `<option value="${p.id}" ${state.projectId === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="min-width:160px">
          <select id="tkPrio" aria-label="Filtrer par priorité">
            ${[['tous', 'Toutes priorités'], ['haute', 'Haute'], ['moyenne', 'Moyenne'], ['basse', 'Basse']].map(([k, l]) =>
              `<option value="${k}" ${state.priority === k ? 'selected' : ''}>${l}</option>`).join('')}
          </select>
        </div>
        <div class="search-field" style="flex:0 1 220px">
          <span class="ico">${icon('search', 19)}</span>
          <input type="search" id="tkSearch" placeholder="Tâche ou responsable…" value="${esc(state.q)}">
        </div>
        <button class="btn btn--accent" id="tkAdd" type="button">${icon('plus', 20)} Nouvelle tâche</button>
      </div>
      <section class="card" id="tkList"></section>`;

    const list = panel.querySelector('#tkList');

    async function refresh() {
      if (!list.isConnected) return;
      const all = await ERP.Api.tasks.list({ projectId: state.projectId, priority: state.priority, q: state.q });
      const counts = { tous: all.length, retard: all.filter(t => t.late).length };
      COLUMNS.forEach(c => { counts[c.key] = all.filter(t => t.status === c.key).length; });
      panel.querySelectorAll('[data-n]').forEach(el => { el.textContent = counts[el.dataset.n] || 0; });

      const rows = state.status === 'tous' ? all
        : state.status === 'retard' ? all.filter(t => t.late)
        : all.filter(t => t.status === state.status);

      list.innerHTML = `
        <div class="card__head">
          <h3>${rows.length} tâche${rows.length > 1 ? 's' : ''}</h3>
          <span class="spacer"></span>
          <span class="small muted">Avancement, statut et échéances se modifient directement sur la ligne</span>
        </div>
        <div class="card__body card__body--flush">
          ${rows.length ? taskTable(rows, true)
            : ERP.UI.empty('Aucune tâche', 'Modifiez les filtres ou créez une nouvelle tâche.')}
        </div>`;
    }

    bindRows(list, refresh);
    on(panel, 'click', '#tkStatus .chip', (e, b) => {
      state.status = b.dataset.s;
      panel.querySelectorAll('#tkStatus .chip').forEach(c => c.classList.toggle('is-active', c === b));
      refresh();
    });
    panel.querySelector('#tkProject').onchange = (e) => { state.projectId = e.target.value; refresh(); };
    panel.querySelector('#tkPrio').onchange = (e) => { state.priority = e.target.value; refresh(); };
    panel.querySelector('#tkSearch').addEventListener('input',
      ERP.UI.debounce((e) => { state.q = e.target.value; refresh(); }, 200));
    panel.querySelector('#tkAdd').onclick = () => openForm(refresh);

    await refresh();
  }

  /* ---------- Volet 2 : catalogue paramétrable ---------- */
  async function renderCatalog(panel) {
    async function draw() {
      if (!panel.isConnected) return;
      const cat = await ERP.Api.taskCatalog.list();
      const phases = ERP.DB.taskPhases;

      panel.innerHTML = `
        <div class="alert-band alert-band--info" style="margin-bottom:var(--gap)">
          <span class="list-row__ico">${icon('info', 18)}</span>
          <div><strong>Ce catalogue alimente la création de projet</strong>
          <small>À l'ouverture d'un chantier, vous choisissez ces tâches une par une dans une liste déroulante
          et fixez leurs dates. Chaque tâche retenue devient une ligne de suivi et un lot du planning.</small></div>
        </div>

        <div class="toolbar">
          <span class="tag num">${cat.length} tâches types · ${cat.filter(c => c.active).length} actives</span>
          <span class="spacer"></span>
          <button class="btn btn--accent" data-newcat type="button">${icon('plus', 20)} Nouvelle tâche type</button>
        </div>

        ${phases.map(ph => {
          const items = cat.filter(c => c.category === ph);
          if (!items.length) return '';
          return `<section class="card" style="margin-bottom:var(--gap)">
            <div class="card__head"><h3>${ph}</h3><span class="tag num">${items.length}</span></div>
            <div class="card__body card__body--flush"><div class="table-wrap">
              <table class="tbl tbl--rows"><thead><tr>
                <th style="min-width:280px">Tâche type</th><th>Métier concerné</th>
                <th class="t-right">Durée par défaut</th><th>Utilisation</th><th class="t-right">Actions</th>
              </tr></thead><tbody>
                ${items.map(c => `<tr data-cat="${c.id}">
                  <td><div class="cell-main">${esc(c.name)}</div><div class="cell-sub num">${c.id}</div></td>
                  <td>${esc(c.trade)}</td>
                  <td class="t-right num"><b>${c.defaultDays}</b> j</td>
                  <td>
                    <label class="switch">
                      <input type="checkbox" data-active ${c.active ? 'checked' : ''}>
                      <span>${c.active ? 'Proposée' : 'Masquée'}</span>
                    </label>
                  </td>
                  <td><div class="row-actions">
                    <button class="icon-btn icon-btn--sm" data-editcat type="button" aria-label="Modifier">${icon('edit', 17)}</button>
                    <button class="icon-btn icon-btn--sm icon-btn--danger" data-delcat type="button" aria-label="Supprimer">${icon('trash', 17)}</button>
                  </div></td>
                </tr>`).join('')}
              </tbody></table>
            </div></div>
          </section>`;
        }).join('')}`;
    }

    on(panel, 'change', '[data-active]', async (e, box) => {
      const id = box.closest('[data-cat]').dataset.cat;
      await ERP.Api.taskCatalog.update(id, { active: box.checked });
      box.nextElementSibling.textContent = box.checked ? 'Proposée' : 'Masquée';
      toast(box.checked ? 'Tâche proposée à la création de projet' : 'Tâche masquée', 'ok', 1900);
    });
    on(panel, 'click', '[data-editcat]', async (e, b) => {
      const id = b.closest('[data-cat]').dataset.cat;
      const c = (await ERP.Api.taskCatalog.list()).find(x => x.id === id);
      openCatalogForm(draw, c);
    });
    on(panel, 'click', '[data-delcat]', async (e, b) => {
      const id = b.closest('[data-cat]').dataset.cat;
      const c = (await ERP.Api.taskCatalog.list()).find(x => x.id === id);
      const ok = await confirm({
        title: 'Retirer du catalogue ?', danger: true, confirmLabel: 'Retirer',
        text: `<b>${esc(c.name)}</b> ne sera plus proposée à la création d'un projet. Les tâches déjà créées sur les chantiers ne sont pas affectées.`
      });
      if (ok) { await ERP.Api.taskCatalog.remove(id); await draw(); toast('Tâche type retirée', 'ok'); }
    });
    on(panel, 'click', '[data-newcat]', () => openCatalogForm(draw, null));

    await draw();
  }

  function openCatalogForm(done, c) {
    const trades = [...new Set(ERP.DB.workers.map(w => w.trade))].sort();
    const m = ERP.UI.modal({
      title: c ? 'Modifier la tâche type' : 'Nouvelle tâche type',
      sub: 'Référentiel utilisé à la création des chantiers',
      body: `<div class="form-grid">
          <div class="field field--full"><label for="c-name">Intitulé</label>
            <input id="c-name" value="${c ? esc(c.name) : ''}" placeholder="Ex. : Pose des gaines techniques"></div>
          <div class="field"><label for="c-cat">Phase du chantier</label>
            <select id="c-cat">${ERP.DB.taskPhases.map(p =>
              `<option ${c && c.category === p ? 'selected' : ''}>${p}</option>`).join('')}</select></div>
          <div class="field"><label for="c-trade">Métier concerné</label>
            <select id="c-trade">${trades.map(t =>
              `<option ${c && c.trade === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div>
          <div class="field"><label for="c-days">Durée par défaut (jours)</label>
            <input id="c-days" type="number" min="1" max="365" value="${c ? c.defaultDays : 10}"></div>
        </div>`,
      footer: `<button class="btn" data-cancel type="button">Annuler</button>
               <button class="btn btn--primary" data-save type="button">${icon('save', 18)} ${c ? 'Enregistrer' : 'Ajouter au catalogue'}</button>`
    });
    m.foot.querySelector('[data-cancel]').onclick = m.close;
    m.foot.querySelector('[data-save]').onclick = async () => {
      const g = (s) => m.body.querySelector(s).value.trim();
      if (!g('#c-name')) { toast('L\'intitulé est obligatoire', 'danger'); return; }
      const payload = {
        name: g('#c-name'), category: g('#c-cat'), trade: g('#c-trade'),
        defaultDays: Math.max(1, +g('#c-days') || 10)
      };
      if (c) await ERP.Api.taskCatalog.update(c.id, payload);
      else await ERP.Api.taskCatalog.create(payload);
      m.close(); toast(c ? 'Tâche type mise à jour' : 'Tâche type ajoutée', 'ok'); done && done();
    };
  }

  /* =========================================================
     FICHE TÂCHE — édition complète
     ========================================================= */
  async function openSheet(id, done) {
    const tasks = await ERP.Api.tasks.list();
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    const projects = (await ERP.Api.projects.list()).filter(p => p.status !== 'termine' || p.id === t.projectId);
    const workers = ERP.DB.workers;

    const m = ERP.UI.modal({
      title: 'Modifier la tâche', sub: `${esc(t.projectName)} · ${t.id}`,
      body: `<div class="form-grid">
          <div class="field field--full"><label for="t-title">Intitulé</label>
            <input id="t-title" value="${esc(t.title)}"></div>
          <div class="field"><label for="t-project">Chantier</label>
            <select id="t-project">${projects.map(p =>
              `<option value="${p.id}" ${p.id === t.projectId ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>
          <div class="field"><label for="t-assignee">Responsable</label>
            <select id="t-assignee">${workers.map(w =>
              `<option ${w.name === t.assignee ? 'selected' : ''}>${esc(w.name)}</option>`).join('')}
              ${workers.some(w => w.name === t.assignee) ? '' : `<option selected>${esc(t.assignee)}</option>`}</select></div>
          <div class="field"><label for="t-start">Date de début</label><input id="t-start" type="date" value="${t.start}"></div>
          <div class="field"><label for="t-due">Échéance</label><input id="t-due" type="date" value="${t.due}"></div>
          <div class="field"><label for="t-prio">Priorité</label>
            <select id="t-prio">${[['haute', 'Haute'], ['moyenne', 'Moyenne'], ['basse', 'Basse']].map(([k, l]) =>
              `<option value="${k}" ${t.priority === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        </div>
        ${t.late ? `<div class="alert-band" style="margin-top:16px"><span class="hazard"></span>
          <div><strong>Échéance dépassée de ${ERP.dt.diff(t.due, ERP.DB.today)} jour(s)</strong>
          <small>Repoussez la date ou signalez la tâche comme bloquée pour qu'elle remonte au chef de projet.</small></div></div>` : ''}

        <h3 style="margin:20px 0 10px">Avancement</h3>
        <div class="row" style="gap:14px">
          <input id="t-prog" type="range" min="0" max="100" step="5" value="${t.progress}" style="flex:1;height:44px">
          <b class="num money" style="font-size:22px;min-width:64px;text-align:right" id="t-progv">${t.progress} %</b>
        </div>

        <h3 style="margin:20px 0 10px">Statut</h3>
        <div class="chips" id="t-status">
          ${COLUMNS.map(c => `<button class="chip ${t.status === c.key ? 'is-active' : ''}" data-s="${c.key}" type="button">${c.label}</button>`).join('')}
        </div>`,
      footer: `<button class="btn btn--danger" data-del type="button">${icon('trash', 18)} Supprimer</button>
               <span style="flex:1"></span>
               <button class="btn" data-cancel type="button">Annuler</button>
               <button class="btn btn--primary" data-save type="button">${icon('save', 18)} Enregistrer</button>`
    });

    let status = t.status;
    const g = (sel) => m.body.querySelector(sel).value;
    const prog = m.body.querySelector('#t-prog');
    const progv = m.body.querySelector('#t-progv');
    prog.oninput = () => { progv.textContent = prog.value + ' %'; };
    on(m.body, 'click', '#t-status .chip', (e, b) => {
      status = b.dataset.s;
      m.body.querySelectorAll('#t-status .chip').forEach(c => c.classList.toggle('is-active', c === b));
      if (status === 'termine') { prog.value = 100; progv.textContent = '100 %'; }
      if (status === 'a_faire') { prog.value = 0; progv.textContent = '0 %'; }
    });

    m.foot.querySelector('[data-cancel]').onclick = m.close;
    m.foot.querySelector('[data-save]').onclick = async () => {
      if (!g('#t-title').trim()) { toast('L\'intitulé de la tâche est obligatoire', 'danger'); return; }
      if (g('#t-due') < g('#t-start')) { toast('L\'échéance doit suivre la date de début', 'danger'); return; }
      await ERP.Api.tasks.update(t.id, {
        title: g('#t-title').trim(), projectId: g('#t-project'), assignee: g('#t-assignee'),
        start: g('#t-start'), due: g('#t-due'), priority: g('#t-prio'),
        status, progress: +prog.value
      });
      m.close(); toast('Tâche mise à jour', 'ok'); done && done();
    };
    m.foot.querySelector('[data-del]').onclick = async () => {
      const ok = await confirm({
        title: 'Supprimer cette tâche ?', danger: true, confirmLabel: 'Supprimer',
        text: `<b>${esc(t.title)}</b> sera retirée du chantier et du planning. Cette action est irréversible.`
      });
      if (ok) { await ERP.Api.tasks.remove(t.id); m.close(); toast('Tâche supprimée', 'ok'); done && done(); }
    };
  }

  /* =========================================================
     NOUVELLE TÂCHE — choisie dans le catalogue
     ========================================================= */
  async function openForm(done, preset = {}) {
    const workers = ERP.DB.workers;
    const projects = (await ERP.Api.projects.list()).filter(p => p.status !== 'termine');
    const catalog = (await ERP.Api.taskCatalog.list()).filter(c => c.active);
    const locked = preset.projectId ? projects.find(p => p.id === preset.projectId) : null;

    const m = ERP.UI.modal({
      title: 'Nouvelle tâche',
      sub: locked ? esc(locked.name) : 'Affecter un travail à une équipe',
      body: `<div class="form-grid">
        <div class="field field--full"><label for="n-cat">Tâche du catalogue</label>
          <select id="n-cat">
            <option value="">— Saisie libre —</option>
            ${ERP.DB.taskPhases.map(ph => {
              const items = catalog.filter(c => c.category === ph);
              return items.length ? `<optgroup label="${ph}">${items.map(c =>
                `<option value="${c.id}">${esc(c.name)} · ${c.defaultDays} j</option>`).join('')}</optgroup>` : '';
            }).join('')}
          </select></div>
        <div class="field field--full"><label for="n-title">Intitulé</label>
          <input id="n-title" placeholder="Ex. : Coulage dalle niveau 3 — bloc B"></div>
        <div class="field"><label for="n-project">Chantier</label>
          <select id="n-project">${projects.map(p =>
            `<option value="${p.id}" ${locked && locked.id === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>
        <div class="field"><label for="n-assignee">Responsable</label>
          <select id="n-assignee">${workers.map(w => `<option>${esc(w.name)}</option>`).join('')}</select></div>
        <div class="field"><label for="n-start">Date de début</label><input id="n-start" type="date" value="${preset.start || ERP.DB.today}"></div>
        <div class="field"><label for="n-due">Échéance</label><input id="n-due" type="date" value="${preset.due || ERP.dt.add(ERP.DB.today, 7)}"></div>
        <div class="field"><label for="n-prio">Priorité</label>
          <select id="n-prio"><option value="haute">Haute</option><option value="moyenne" selected>Moyenne</option><option value="basse">Basse</option></select></div>
        <div class="field"><label for="n-status">Statut initial</label>
          <select id="n-status">${COLUMNS.map(c => `<option value="${c.key}">${c.label}</option>`).join('')}</select></div>
      </div>`,
      footer: `<button class="btn" data-cancel type="button">Annuler</button>
               <button class="btn btn--primary" data-save type="button">${icon('save', 18)} Créer la tâche</button>`
    });

    // Choisir dans le catalogue pré-remplit l'intitulé, l'échéance et le métier
    m.body.querySelector('#n-cat').onchange = (e) => {
      const c = catalog.find(x => x.id === e.target.value);
      if (!c) return;
      m.body.querySelector('#n-title').value = c.name;
      const start = m.body.querySelector('#n-start').value;
      m.body.querySelector('#n-due').value = ERP.dt.add(start, c.defaultDays);
      const w = workers.find(x => x.trade === c.trade);
      if (w) m.body.querySelector('#n-assignee').value = w.name;
    };

    m.foot.querySelector('[data-cancel]').onclick = m.close;
    m.foot.querySelector('[data-save]').onclick = async () => {
      const g = (id) => m.body.querySelector(id).value;
      if (!g('#n-title').trim()) { toast('L\'intitulé de la tâche est obligatoire', 'danger'); return; }
      if (g('#n-due') < g('#n-start')) { toast('L\'échéance doit suivre la date de début', 'danger'); return; }
      await ERP.Api.tasks.create({
        title: g('#n-title').trim(), projectId: g('#n-project'), assignee: g('#n-assignee'),
        start: g('#n-start'), due: g('#n-due'), priority: g('#n-prio'), status: g('#n-status'), progress: 0
      });
      m.close(); toast('Tâche créée', 'ok'); done && done();
    };
  }

  ERP.Tasks = { openSheet, openForm, openCatalogForm, COLUMNS };
  ERP.Router.add('/taches', { title: 'Tâches', sub: 'Suivi et paramétrage', render });
})(window.ERP);

</script>
<script>
/* ===== js/reports.js ===== */
/* =========================================================
   BâtiPilot — Module RAPPORTS
   ========================================================= */
