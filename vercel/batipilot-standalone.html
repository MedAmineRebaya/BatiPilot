<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14395C">
<title>BâtiPilot — Gestion de chantiers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== css/style.css ===== */
/* =========================================================
   BâtiPilot — Design system
   Palette « chantier » : bleu nuit béton + orange signalisation
   Typo : Barlow Semi Condensed (titres / données) + Inter (texte)
   ========================================================= */

:root{
  /* --- Couleurs de marque --- */
  --ink:        #0E2233;
  --navy:       #14395C;
  --navy-700:   #0F2C47;
  --navy-600:   #1C5583;
  --navy-050:   #E8F0F7;
  --orange:     #E4651A;
  --orange-600: #C4530F;
  --orange-050: #FDF0E7;

  /* --- Surfaces --- */
  --bg:         #EEF2F6;
  --surface:    #FFFFFF;
  --surface-2:  #F7F9FC;
  --surface-3:  #EDF1F6;
  --border:     #DFE6EE;
  --border-2:   #C7D3E0;

  /* --- Texte --- */
  --text:       #10263A;
  --text-2:     #34506B;
  --muted:      #5C7186;
  --faint:      #8698A9;
  --on-dark:    #E7EEF5;

  /* --- Statuts --- */
  --ok:         #17845A;  --ok-bg:   #E4F4EC;
  --warn:       #B26A05;  --warn-bg: #FBF0DC;
  --danger:     #C42B2B;  --danger-bg:#FBE7E7;
  --info:       #1C6FA8;  --info-bg: #E4F0F9;
  --neutral:    #5C7186;  --neutral-bg:#EAEFF4;

  /* --- Formes --- */
  --r-sm: 8px;
  --r:    12px;
  --r-lg: 16px;
  --r-pill: 999px;

  --shadow-1: 0 1px 2px rgba(14,34,51,.06), 0 1px 1px rgba(14,34,51,.04);
  --shadow-2: 0 2px 4px rgba(14,34,51,.06), 0 12px 28px -18px rgba(14,34,51,.35);
  --shadow-3: 0 24px 60px -20px rgba(14,34,51,.45);

  /* --- Métriques tactiles --- */
  --tap: 48px;
  --sidebar-w: 264px;
  --sidebar-w-min: 84px;
  --topbar-h: 74px;
  --gap: 18px;
  --pad: 22px;

  /* --- Ruban de signalisation (élément signature) --- */
  --hazard: repeating-linear-gradient(135deg,
            var(--orange) 0 10px, #F6A15E 10px 20px);
}

*,*::before,*::after{ box-sizing:border-box; }

html,body{ height:100%; }
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}

h1,h2,h3,h4,h5{
  font-family:"Barlow Semi Condensed","Inter",sans-serif;
  margin:0; font-weight:600; letter-spacing:.2px; color:var(--ink);
}
h1{ font-size:24px; line-height:1.15; }
h2{ font-size:21px; }
h3{ font-size:18px; }
p{ margin:0; }
a{ color:var(--navy-600); }

button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
::placeholder{ color:var(--faint); }

:focus-visible{ outline:3px solid var(--navy-600); outline-offset:2px; border-radius:6px; }

.num{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }

/* Barre de défilement discrète mais tactile */
*::-webkit-scrollbar{ width:12px; height:12px; }
*::-webkit-scrollbar-thumb{ background:#C3D0DD; border-radius:99px; border:3px solid transparent; background-clip:content-box; }
*::-webkit-scrollbar-track{ background:transparent; }

/* =========================================================
   1. STRUCTURE
   ========================================================= */
.app{
  display:grid;
  grid-template-columns:var(--sidebar-w) 1fr;
  height:100dvh;
  overflow:hidden;
}
.app.is-collapsed{ grid-template-columns:var(--sidebar-w-min) 1fr; }

.main{ display:flex; flex-direction:column; min-width:0; height:100dvh; }

.view{
  flex:1; overflow-y:auto; overflow-x:hidden;
  padding:var(--pad);
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
}
.view:focus{ outline:none; }

/* =========================================================
   2. MENU LATÉRAL
   ========================================================= */
.sidebar{
  background:linear-gradient(180deg,var(--navy) 0%, var(--navy-700) 100%);
  color:var(--on-dark);
  display:flex; flex-direction:column;
  min-width:0;
  position:relative;
  z-index:40;
}
.sidebar__brand{
  display:flex; align-items:center; gap:12px;
  height:var(--topbar-h); padding:0 14px 0 18px;
  border-bottom:1px solid rgba(255,255,255,.10);
}
.brand__mark{
  width:40px; height:40px; flex:none; border-radius:11px;
  background:var(--orange); color:#fff;
  display:grid; place-items:center;
  box-shadow:0 4px 12px -4px rgba(228,101,26,.7);
}
.brand__text{ display:flex; flex-direction:column; min-width:0; }
.brand__name{
  font-family:"Barlow Semi Condensed",sans-serif; font-weight:700;
  font-size:21px; letter-spacing:.4px; color:#fff; line-height:1.1;
}
.brand__sub{ font-size:11px; color:rgba(231,238,245,.6); letter-spacing:.3px; }

.sidebar__toggle{
  margin-left:auto; width:38px; height:38px; flex:none;
  border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.06);
  border-radius:10px; color:#fff; display:grid; place-items:center;
  transition:background .15s;
}
.sidebar__toggle:hover{ background:rgba(255,255,255,.14); }

.nav{ flex:1; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:3px; }
.nav__group{
  font-size:10.5px; letter-spacing:1.4px; text-transform:uppercase;
  color:rgba(231,238,245,.42); padding:16px 12px 7px; font-weight:600;
}
.nav__item{
  display:flex; align-items:center; gap:13px;
  min-height:var(--tap); padding:0 13px;
  border:0; background:transparent; color:rgba(231,238,245,.82);
  border-radius:11px; width:100%; text-align:left;
  font-size:15px; font-weight:500; position:relative;
  transition:background .14s, color .14s;
}
.nav__item svg{ flex:none; }
.nav__item:hover{ background:rgba(255,255,255,.09); color:#fff; }
.nav__item.is-active{ background:rgba(255,255,255,.14); color:#fff; font-weight:600; }
.nav__item.is-active::before{
  content:""; position:absolute; left:-12px; top:9px; bottom:9px; width:4px;
  background:var(--orange); border-radius:0 4px 4px 0;
}
.nav__label{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nav__pill{
  margin-left:auto; background:var(--orange); color:#fff;
  font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:var(--r-pill);
  font-variant-numeric:tabular-nums;
}
.nav__pill--muted{ background:rgba(255,255,255,.18); }

.sidebar__foot{ padding:12px; border-top:1px solid rgba(255,255,255,.10); }
.sync{ display:flex; gap:10px; align-items:center; padding:10px 12px; border-radius:10px; background:rgba(255,255,255,.06); }
.sync__dot{ width:9px; height:9px; border-radius:50%; background:#4ADE80; flex:none; box-shadow:0 0 0 4px rgba(74,222,128,.18); }
.sync__text{ font-size:12px; color:rgba(231,238,245,.75); line-height:1.35; }
.sync__text small{ color:rgba(231,238,245,.45); }

/* Mode réduit */
.app.is-collapsed .brand__text,
.app.is-collapsed .nav__label,
.app.is-collapsed .nav__group,
.app.is-collapsed .sync__text,
.app.is-collapsed .nav__pill{ display:none; }
.app.is-collapsed .sidebar__brand{ padding:0 12px; flex-direction:column; gap:10px; }
.app.is-collapsed .sidebar__toggle{ margin-left:0; }
.app.is-collapsed .nav__item{ justify-content:center; padding:0; }
.app.is-collapsed .sync{ justify-content:center; }

.sidebar__scrim{
  position:fixed; inset:0; background:rgba(14,34,51,.45); z-index:35;
  backdrop-filter:blur(2px);
}

/* =========================================================
   3. BARRE SUPÉRIEURE
   ========================================================= */
.topbar{
  height:var(--topbar-h); flex:none;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:16px;
  padding:0 var(--pad);
  z-index:20;
}
.topbar__burger{ display:none; }
.topbar__title{ min-width:0; }
.topbar__title h1{ font-size:22px; }
.topbar__title p{ font-size:12.5px; color:var(--muted); margin-top:1px; }

.topbar__search{ margin-left:auto; position:relative; width:min(380px,34vw); }
.topbar__search input{
  width:100%; height:46px; border-radius:var(--r);
  border:1px solid var(--border); background:var(--surface-2);
  padding:0 14px 0 44px; font-size:14.5px;
  transition:border-color .15s, background .15s;
}
.topbar__search input:focus{ background:#fff; border-color:var(--navy-600); outline:none; box-shadow:0 0 0 3px var(--navy-050); }
.topbar__search-ico{ position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--faint); display:flex; }
.topbar__search input::-webkit-search-cancel-button{ -webkit-appearance:none; }

.omnibox{
  position:absolute; top:calc(100% + 8px); left:0; right:0;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r); box-shadow:var(--shadow-3);
  max-height:420px; overflow-y:auto; z-index:60; padding:6px;
}
.omnibox__group{ font-size:10.5px; letter-spacing:1.2px; text-transform:uppercase; color:var(--faint); padding:12px 12px 6px; font-weight:600; }
.omnibox__item{
  display:flex; align-items:center; gap:12px; width:100%;
  min-height:52px; padding:8px 12px; border:0; background:transparent;
  border-radius:var(--r-sm); text-align:left;
}
.omnibox__item:hover{ background:var(--surface-3); }
.omnibox__item strong{ font-size:14.5px; font-weight:600; display:block; }
.omnibox__item small{ color:var(--muted); font-size:12.5px; }

.topbar__actions{ display:flex; align-items:center; gap:10px; }

.icon-btn{
  width:46px; height:46px; flex:none; border-radius:var(--r);
  border:1px solid var(--border); background:var(--surface);
  display:grid; place-items:center; color:var(--navy);
  position:relative; transition:background .15s, border-color .15s;
}
.icon-btn:hover{ background:var(--surface-3); }
.icon-btn--lg{ width:48px; height:48px; }
.icon-btn--ghost{ border-color:transparent; background:transparent; }
.badge-count{
  position:absolute; top:-5px; right:-5px; min-width:21px; height:21px;
  padding:0 5px; border-radius:var(--r-pill); background:var(--danger); color:#fff;
  font-size:11.5px; font-weight:700; display:grid; place-items:center;
  border:2px solid var(--surface); font-variant-numeric:tabular-nums;
}

.userchip{
  display:flex; align-items:center; gap:10px; height:48px;
  padding:0 12px 0 8px; border-radius:var(--r);
  border:1px solid var(--border); background:var(--surface);
}
.userchip:hover{ background:var(--surface-3); }
.avatar{
  width:34px; height:34px; border-radius:10px; flex:none;
  background:var(--navy); color:#fff; display:grid; place-items:center;
  font-family:"Barlow Semi Condensed",sans-serif; font-weight:700; font-size:14.5px; letter-spacing:.5px;
}
.avatar--lg{ width:56px; height:56px; border-radius:14px; font-size:20px; }
.avatar--orange{ background:var(--orange); }
.avatar--soft{ background:var(--navy-050); color:var(--navy); }
.userchip__text{ display:flex; flex-direction:column; line-height:1.2; text-align:left; }
.userchip__text strong{ font-size:13.5px; font-weight:600; }
.userchip__text small{ font-size:11.5px; color:var(--muted); }
.userchip__caret{ color:var(--faint); display:flex; }

/* =========================================================
   4. COMPOSANTS GÉNÉRIQUES
   ========================================================= */
.card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-lg); box-shadow:var(--shadow-1);
}
.card__head{
  display:flex; align-items:center; gap:14px;
  padding:16px 18px; border-bottom:1px solid var(--border);
}
.card__head h2,.card__head h3{ font-size:17px; }
.card__head .spacer{ margin-left:auto; }
.card__body{ padding:18px; }
.card__body--flush{ padding:0; }
.card__foot{ padding:12px 18px; border-top:1px solid var(--border); background:var(--surface-2); border-radius:0 0 var(--r-lg) var(--r-lg); }

.section-title{
  display:flex; align-items:center; gap:12px; margin:0 0 14px;
}
.section-title h2{ font-size:19px; }
.section-title .spacer{ margin-left:auto; }
.eyebrow{
  font-family:"Barlow Semi Condensed",sans-serif;
  font-size:11.5px; letter-spacing:1.6px; text-transform:uppercase;
  color:var(--faint); font-weight:600;
}

/* Boutons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:9px;
  min-height:var(--tap); padding:0 18px; border-radius:var(--r);
  border:1px solid var(--border); background:var(--surface); color:var(--text);
  font-size:15px; font-weight:600; white-space:nowrap;
  transition:background .15s, border-color .15s, transform .06s;
}
.btn:active{ transform:translateY(1px); }
.btn:hover{ background:var(--surface-3); }
.btn--primary{ background:var(--navy); border-color:var(--navy); color:#fff; }
.btn--primary:hover{ background:var(--navy-600); }
.btn--accent{ background:var(--orange); border-color:var(--orange); color:#fff; }
.btn--accent:hover{ background:var(--orange-600); }
.btn--danger{ background:var(--danger); border-color:var(--danger); color:#fff; }
.btn--danger:hover{ filter:brightness(1.08); }
.btn--ghost{ background:transparent; border-color:transparent; }
.btn--ghost:hover{ background:var(--surface-3); }
.btn--sm{ min-height:40px; padding:0 14px; font-size:14px; }
.btn--block{ width:100%; }
.btn[disabled]{ opacity:.5; pointer-events:none; }

/* Segmented control (vues Jour/Semaine/Mois, Kanban/Liste) */
.segmented{
  display:inline-flex; background:var(--surface-3); border-radius:var(--r);
  padding:4px; gap:4px; border:1px solid var(--border);
}
.segmented button{
  min-height:40px; padding:0 16px; border:0; background:transparent;
  border-radius:9px; font-size:14px; font-weight:600; color:var(--muted);
  display:inline-flex; align-items:center; gap:8px;
}
.segmented button.is-active{ background:var(--surface); color:var(--navy); box-shadow:var(--shadow-1); }

/* Filtres (chips) */
.chips{ display:flex; gap:9px; flex-wrap:wrap; }
.chip{
  min-height:44px; padding:0 16px; border-radius:var(--r-pill);
  border:1px solid var(--border); background:var(--surface);
  font-size:14px; font-weight:600; color:var(--muted);
  display:inline-flex; align-items:center; gap:8px;
}
.chip:hover{ border-color:var(--border-2); }
.chip.is-active{ background:var(--navy); border-color:var(--navy); color:#fff; }
.chip__n{
  font-size:12px; padding:1px 7px; border-radius:var(--r-pill);
  background:var(--surface-3); color:var(--muted); font-variant-numeric:tabular-nums;
}
.chip.is-active .chip__n{ background:rgba(255,255,255,.22); color:#fff; }

/* Barre d'outils de page */
.toolbar{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  margin-bottom:var(--gap);
}
.toolbar .spacer{ margin-left:auto; }
.search-field{ position:relative; flex:1 1 260px; max-width:420px; }
.search-field input{
  width:100%; height:var(--tap); border-radius:var(--r);
  border:1px solid var(--border); background:var(--surface);
  padding:0 14px 0 44px; font-size:15px;
}
.search-field input:focus{ outline:none; border-color:var(--navy-600); box-shadow:0 0 0 3px var(--navy-050); }
.search-field .ico{ position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--faint); display:flex; }

/* Badges de statut */
.badge{
  display:inline-flex; align-items:center; gap:6px;
  padding:5px 11px; border-radius:var(--r-pill);
  font-size:12.5px; font-weight:700; letter-spacing:.2px; white-space:nowrap;
  background:var(--neutral-bg); color:var(--neutral);
}
.badge::before{ content:""; width:7px; height:7px; border-radius:50%; background:currentColor; }
.badge--ok{ background:var(--ok-bg); color:var(--ok); }
.badge--warn{ background:var(--warn-bg); color:var(--warn); }
.badge--danger{ background:var(--danger-bg); color:var(--danger); }
.badge--info{ background:var(--info-bg); color:var(--info); }
.badge--plain::before{ display:none; }

.tag{
  display:inline-flex; align-items:center; gap:6px; padding:4px 10px;
  border-radius:var(--r-sm); background:var(--surface-3); color:var(--muted);
  font-size:12.5px; font-weight:600;
}

/* Barres de progression */
.pbar{ height:10px; border-radius:99px; background:var(--surface-3); overflow:hidden; }
.pbar__fill{ height:100%; border-radius:99px; background:var(--navy-600); transition:width .5s cubic-bezier(.2,.7,.3,1); }
.pbar--thin{ height:7px; }
.pbar__fill--ok{ background:var(--ok); }
.pbar__fill--warn{ background:var(--warn); }
.pbar__fill--danger{ background:var(--danger); }
.pbar__fill--accent{ background:var(--orange); }
.pbar-row{ display:flex; align-items:center; gap:12px; }
.pbar-row .pbar{ flex:1; }
.pbar-row b{ font-size:14px; min-width:44px; text-align:right; font-variant-numeric:tabular-nums; }

/* Tableaux — lignes hautes, tactiles */
.table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
table.tbl{ width:100%; border-collapse:collapse; min-width:640px; }
table.tbl th{
  font-family:"Barlow Semi Condensed",sans-serif;
  text-align:left; font-size:12.5px; letter-spacing:1px; text-transform:uppercase;
  color:var(--muted); font-weight:600; padding:12px 16px;
  background:var(--surface-2); border-bottom:1px solid var(--border); white-space:nowrap;
}
table.tbl td{ padding:14px 16px; border-bottom:1px solid var(--border); font-size:14.5px; vertical-align:middle; }
table.tbl tbody tr{ min-height:60px; }
table.tbl tbody tr.is-clickable:hover{ background:var(--navy-050); cursor:pointer; }
table.tbl tbody tr:last-child td{ border-bottom:0; }
table.tbl .cell-main{ font-weight:600; color:var(--ink); }
table.tbl .cell-sub{ font-size:12.5px; color:var(--muted); }
.t-right{ text-align:right; }
.t-center{ text-align:center; }

/* Liste titre + sous-titre avec pastille */
.idcell{ display:flex; align-items:center; gap:12px; }
.idcell__txt{ min-width:0; }

/* Formulaires */
.form-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
.field{ display:flex; flex-direction:column; gap:7px; min-width:0; }
.field--full{ grid-column:1 / -1; }
.field label{ font-size:13px; font-weight:600; color:var(--muted); }
.field input,.field select,.field textarea{
  min-height:var(--tap); border-radius:var(--r); border:1px solid var(--border);
  background:var(--surface); padding:10px 14px; font-size:15px; width:100%;
}
.field select{ appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%235C7186' stroke-width='2' stroke-linecap='round'><path d='m6 9 6 6 6-6'/></svg>"); background-repeat:no-repeat; background-position:right 12px center; padding-right:40px; }
.field textarea{ min-height:96px; resize:vertical; }
.field input:focus,.field select:focus,.field textarea:focus{ outline:none; border-color:var(--navy-600); box-shadow:0 0 0 3px var(--navy-050); }
.field__hint{ font-size:12px; color:var(--faint); }
.field.has-error input,.field.has-error select{ border-color:var(--danger); }
.field__err{ font-size:12.5px; color:var(--danger); font-weight:600; }

.pwd-wrap{ position:relative; }
.pwd-wrap input{ padding-right:44px; }
.pwd-toggle{
  position:absolute; right:4px; top:50%; transform:translateY(-50%);
  width:34px; height:34px; display:flex; align-items:center; justify-content:center;
  border:0; background:none; color:var(--faint); cursor:pointer; border-radius:var(--r);
}
.pwd-toggle:hover{ color:var(--muted); background:var(--bg); }
.pwd-toggle .eye-off{ display:none; }
.pwd-toggle.is-visible .eye{ display:none; }
.pwd-toggle.is-visible .eye-off{ display:block; }

/* Modales */
.modal-scrim{
  position:fixed; inset:0; background:rgba(14,34,51,.5); backdrop-filter:blur(3px);
  z-index:100; display:flex; align-items:center; justify-content:center; padding:24px;
  animation:fade .18s ease-out;
}
.modal{
  background:var(--surface); border-radius:18px; box-shadow:var(--shadow-3);
  width:min(760px,100%); max-height:min(88dvh,900px); display:flex; flex-direction:column;
  animation:pop .22s cubic-bezier(.2,.8,.3,1);
}
.modal--wide{ width:min(1040px,100%); }
.modal--sm{ width:min(520px,100%); }
.modal__head{
  display:flex; align-items:center; gap:14px; padding:18px 20px;
  border-bottom:1px solid var(--border);
}
.modal__head h2{ font-size:20px; }

.att-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; }

@media (max-width:1080px){

<script>
/* ===== js/data.js ===== */
/* =========================================================
   BâtiPilot — État applicatif partagé (ERP.DB)
   ---------------------------------------------------------
   Aucune donnée de démonstration ici : ERP.DB démarre vide et
   n'est peuplé qu'après connexion, par de vrais appels API
   (voir enterApp() dans js/app.js) — un nouvel ingénieur voit
   donc une application réellement vide, jamais un jeu de démo
   local. Les données de démonstration, quand un admin choisit
   d'en charger pour une entreprise, sont générées côté serveur
   et vivent exclusivement dans Supabase.
   ========================================================= */
window.ERP = window.ERP || {};

(function (ERP) {
  'use strict';

  /* ---------- Date du jour réelle (pas de date figée de démo) ---------- */
  const dt = {
    parse: (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); },
    iso: (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`,
    add: (s, n) => { const d = dt.parse(s); d.setDate(d.getDate() + n); return dt.iso(d); },
    diff: (a, b) => Math.round((dt.parse(b) - dt.parse(a)) / 86400000),
    isWeekend: (s) => [0, 6].includes(dt.parse(s).getDay())
  };
  ERP.dt = dt;

  /* Taxonomie fixe des phases de chantier (pas une donnée d'entreprise —
     un référentiel d'affichage partagé, comme les icônes ou les labels). */
  const TASK_PHASES = ['Préparation', 'Terrassement', 'Gros œuvre', 'Second œuvre', 'Finitions', 'Réception'];

  /* Rempli par enterApp() après connexion : user (profil), et les listes
     (clients/projects/workers/articles/tasks/suppliers/notifications)
     utilisées comme cache synchrone pour les pastilles de menu et
     certains sélecteurs de formulaire. Chaque page continue par ailleurs
     de lire ses propres données via ERP.Api à chaque rendu. */
  ERP.DB = {
    today: dt.iso(new Date()),
    user: null,
    clients: [], projects: [], workers: [], articles: [], tasks: [], suppliers: [], notifications: [],
    taskPhases: TASK_PHASES
  };
})(window.ERP);

</script>
<script>
/* ===== js/api.js ===== */
/* =========================================================
   BâtiPilot — Couche d'accès aux données
   ---------------------------------------------------------
   Toutes les pages passent par ERP.Api, jamais directement par
   ERP.DB. Chaque appel va sur /api/v1 → Supabase ; le jeton est
   posé sur ERP.Api.config.token après connexion (voir js/app.js).
   ========================================================= */
window.ERP = window.ERP || {};

(function (ERP) {
  'use strict';

  // Toutes les données transitent par Supabase via /api/v1 — aucun mode
  // hors-ligne, aucune donnée de démonstration stockée dans le navigateur.
  const config = {
    mode: 'http', // fixe — plus de mode démo/localStorage
    baseUrl: '/api/v1',
    token: null
  };

  // A single in-flight refresh shared by every caller that hits a 401 at
  // once (e.g. a page that fires several requests in parallel right after
  // the tab wakes up with a stale token) — without this, each of them
  // would kick off its own refreshSession() call concurrently.
  let refreshInFlight = null;
  function refreshTokenOnce() {
    if (!refreshInFlight) {
      refreshInFlight = (window.ERP.Auth ? window.ERP.Auth.refreshSession() : Promise.reject(new Error('no auth')))
        .finally(() => { refreshInFlight = null; });
    }
    return refreshInFlight;
  }

  /* --- Point d'entrée unique de tous les appels API --- */
  async function request(resource, { method = 'GET', params = null, body = null } = {}, _retried = false) {
    const base = config.baseUrl.replace(/\/$/, '');
    const url = new URL(base + resource, location.origin);
    if (params) Object.entries(params).forEach(([k, v]) => v != null && url.searchParams.set(k, v));
    const res = await fetch(url.toString(), {
      method,
      headers: {
        'Content-Type': 'application/json',
        ...(config.token ? { Authorization: 'Bearer ' + config.token } : {})
      },
      body: body ? JSON.stringify(body) : undefined
    });
    if (res.status === 401 && !_retried) {
      // The token expired mid-session (typically after the tab sat in the
      // background long enough for the access token to lapse before the
      // SDK's own background timer refreshed it). Try ONE silent refresh
      // and replay this exact request — do not treat a single 401 as a
      // dead session; only a real SIGNED_OUT event (see app.js) does that.
      console.warn(`[api] 401 on ${resource} — attempting a silent token refresh`);
      try {
        const session = await refreshTokenOnce();
        if (session) {
          config.token = session.access_token;
          return request(resource, { method, params, body }, true);
        }
      } catch (refreshErr) {
        console.warn('[api] silent token refresh failed', refreshErr);
      }
    }
    if (!res.ok) {
      let detail = res.statusText;
      try { const j = await res.json(); if (j && j.error) detail = j.error; } catch (_) {}
      throw new Error(`${res.status} ${detail}`);
    }
    if (res.status === 204) return null;
    const ct = res.headers.get('content-type') || '';
    return ct.includes('json') ? res.json() : null;
  }

  }
  function pbar(value, cls = '', thin = false) {
    return `<div class="pbar ${thin ? 'pbar--thin' : ''}"><div class="pbar__fill ${cls}" style="width:${Math.max(0, Math.min(100, value))}%"></div></div>`;
  }

  /* =======================================================
     4. HELPERS DOM
     ======================================================= */
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  function el(html) {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }
  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  /** Délégation d'évènement : on(root, 'click', '.selector', handler) */
  function on(root, type, selector, handler) {
    root.addEventListener(type, (e) => {
      const target = e.target.closest(selector);
      if (target && root.contains(target)) handler(e, target);
    });
  }

  const debounce = (fn, ms = 220) => {
    let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
  };

  /* =======================================================
     5. MODALES
     ======================================================= */
  let openModals = 0;
  function modal({ title, sub = '', body = '', footer = '', size = '', onClose = null }) {
    const scrim = el(`
      <div class="modal-scrim" role="dialog" aria-modal="true">
        <div class="modal ${size}">
          <div class="modal__head">
            <div style="min-width:0;flex:1">
              <h2>${esc(title)}</h2>
              ${sub ? `<div class="sub">${sub}</div>` : ''}
            </div>
            <button class="icon-btn" data-close type="button" aria-label="Fermer">${icon('x', 22)}</button>
          </div>
          <div class="modal__body"></div>
          ${footer ? `<div class="modal__foot">${footer}</div>` : ''}
        </div>
      </div>`);
    scrim.querySelector('.modal__body').innerHTML = body;
    document.getElementById('modalRoot').appendChild(scrim);
    openModals++;

    function close() {
      if (!scrim.isConnected) return;
      scrim.remove();
      openModals--;
      document.removeEventListener('keydown', onKey);
      if (onClose) onClose();
    }
    function onKey(e) { if (e.key === 'Escape') close(); }

    scrim.addEventListener('click', (e) => { if (e.target === scrim) close(); });
    scrim.querySelector('[data-close]').addEventListener('click', close);
    document.addEventListener('keydown', onKey);
    setTimeout(() => {
      const f = scrim.querySelector('input,select,textarea,button:not([data-close])');
      if (f && window.innerWidth > 900) f.focus();
    }, 60);

    return { root: scrim, body: scrim.querySelector('.modal__body'), foot: scrim.querySelector('.modal__foot'), close };
  }

  function confirm({ title, text, confirmLabel = 'Confirmer', danger = false, icon: ic = 'alert' }) {
    return new Promise((resolve) => {
      let answer = false;
      const m = modal({
        title, size: 'modal--sm',
        body: `<div class="row" style="align-items:flex-start;gap:14px">
                 <div class="kpi__ico ${danger ? 'kpi__ico--danger' : 'kpi__ico--warn'}" style="width:44px;height:44px">${icon(ic, 22)}</div>
                 <p style="font-size:15px;line-height:1.55">${text}</p>
               </div>`,
        footer: `<button class="btn" data-cancel type="button">Annuler</button>
                 <button class="btn ${danger ? 'btn--danger' : 'btn--primary'}" data-ok type="button">${esc(confirmLabel)}</button>`,
        onClose: () => resolve(answer)
      });
      m.foot.querySelector('[data-cancel]').onclick = () => m.close();
      m.foot.querySelector('[data-ok]').onclick = () => { answer = true; m.close(); };
    });
  }

  /* =======================================================
     6. TOASTS
     ======================================================= */
  function toast(message, type = 'ok', ms = 3200) {
    const map = { ok: 'check', warn: 'alert', danger: 'alert', info: 'info' };
    const t = el(`<div class="toast toast--${type}">
        <span class="toast__ico">${icon(map[type] || 'info', 22)}</span>
        <span>${message}</span>
      </div>`);
    document.getElementById('toastRoot').appendChild(t);
    setTimeout(() => { t.classList.add('is-out'); setTimeout(() => t.remove(), 220); }, ms);
  }

  /* =======================================================
     7. POPOVERS (notifications, menu profil)
     ======================================================= */
  let currentPop = null;
  function popover(anchor, html, { align = 'right', width = 400 } = {}) {
    closePopover();
    const p = el(`<div class="popover" style="width:${width}px">${html}</div>`);
    document.getElementById('popoverRoot').appendChild(p);
    const r = anchor.getBoundingClientRect();
    const w = Math.min(width, window.innerWidth - 24);
    p.style.width = w + 'px';
    p.style.top = Math.round(r.bottom + 10) + 'px';
    p.style.left = align === 'right'
      ? Math.round(Math.max(12, Math.min(r.right - w, window.innerWidth - w - 12))) + 'px'
      : Math.round(Math.max(12, r.left)) + 'px';

    const off = (e) => { if (!p.contains(e.target) && !anchor.contains(e.target)) closePopover(); };
    const esc2 = (e) => { if (e.key === 'Escape') closePopover(); };
    setTimeout(() => {
      document.addEventListener('pointerdown', off);
      document.addEventListener('keydown', esc2);
    }, 10);
    currentPop = { node: p, cleanup: () => { document.removeEventListener('pointerdown', off); document.removeEventListener('keydown', esc2); } };
    return p;
  }
  function closePopover() {
    if (currentPop) { currentPop.cleanup(); currentPop.node.remove(); currentPop = null; }
  }

  /* =======================================================
     8. ÉTATS DE CHARGEMENT / VIDE
     ======================================================= */
  const skeleton = (rows = 3) => `<div class="stack">${Array.from({ length: rows }, () =>
    `<div class="card" style="height:96px;background:linear-gradient(90deg,#fff,#F2F5F9,#fff);background-size:200% 100%;animation:sk 1.1s infinite"></div>`).join('')}
    <style>@keyframes sk{0%{background-position:120% 0}100%{background-position:-20% 0}}</style>`;

  const empty = (title, text, action = '') => `
    <div class="empty">
      <div class="empty__ico">${icon('search', 30)}</div>
      <h3>${esc(title)}</h3><p>${text}</p>${action}
    </div>`;

  /* ---------- Export ---------- */
  ERP.icon = icon;
  ERP.fmt = fmt;
  ERP.UI = {
    icon, fmt, badge, label, pbar, progressClass, modal, confirm, toast,
    popover, closePopover, skeleton, empty, el, esc, on, $, $$, debounce, STATUS
  };
})(window.ERP);

</script>
<script>
/* ===== js/charts.js ===== */
/* =========================================================
   BâtiPilot — Graphiques
   Rendu SVG maison : aucune dépendance réseau, impression nette,
   et cohérence totale avec la palette de l'application.
   (Chart.js peut être substitué ici sans toucher aux pages :
    chaque fonction reçoit un conteneur + un objet de données.)
   ========================================================= */
window.ERP = window.ERP || {};

(function (ERP) {
  'use strict';

  const C = {
    axis: '#8698A9', grid: '#E2E9F0', text: '#4E6479',
    navy: '#14395C', navyLight: '#1C6FA8', orange: '#E4651A',
    ok: '#17845A', warn: '#B26A05', danger: '#C42B2B', faint: '#C7D3E0'
  };
  const nf = (n) => Number(n).toLocaleString('fr-FR').replace(/\u202F|\u00A0/g, ' ');

  function svg(w, h, inner, cls = '') {
    return `<svg class="chart ${cls}" viewBox="0 0 ${w} ${h}" width="100%" style="height:auto;display:block"
      font-family="Inter, sans-serif" role="img">${inner}</svg>`;
  }

  /* ---------- Échelle « jolie » pour l'axe Y ---------- */
  function niceMax(v) {
    if (v <= 0) return 10;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    const n = v / p;
    const step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
    return step * p;
  }

  /* =======================================================
     ANNEAU (répartition)
     ======================================================= */
  function donut(container, { items, center = null, size = 220, thickness = 30 }) {
    if (!container) return;
    const total = items.reduce((s, i) => s + i.value, 0) || 1;
    const r = size / 2 - thickness / 2 - 2;
    const cx = size / 2, cy = size / 2;
    let angle = -Math.PI / 2;
    const arcs = items.map((it) => {
      const a = (it.value / total) * Math.PI * 2;
      const x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
      angle += a;
      const x2 = cx + r * Math.cos(angle), y2 = cy + r * Math.sin(angle);
      const large = a > Math.PI ? 1 : 0;
      if (it.value === 0) return '';
      return `<path d="M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}"
                fill="none" stroke="${it.color}" stroke-width="${thickness}" stroke-linecap="butt">
                <title>${it.label} — ${nf(it.value)}</title></path>`;
    }).join('');

    const middle = center ? `
      <text x="${cx}" y="${cy - 2}" text-anchor="middle" font-family="Barlow Semi Condensed, sans-serif"
            font-size="30" font-weight="700" fill="${C.navy}">${center.value}</text>
      <text x="${cx}" y="${cy + 20}" text-anchor="middle" font-size="12" fill="${C.text}">${center.label}</text>` : '';

    container.innerHTML = svg(size, size, `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${C.grid}" stroke-width="${thickness}"/>${arcs}${middle}`);
  }

  /* =======================================================
     BARRES GROUPÉES
     ======================================================= */
  function bars(container, { labels, series, formatter = nf, height = 280, yTicks = 4 }) {
    if (!container) return;
    const W = 700, H = height, padL = 60, padR = 14, padT = 18, padB = 44;
    const iw = W - padL - padR, ih = H - padT - padB;
    const max = niceMax(Math.max(...series.flatMap(s => s.data), 1));
    const y = (v) => padT + ih - (v / max) * ih;

    let g = '';
    for (let i = 0; i <= yTicks; i++) {
      const v = (max / yTicks) * i, yy = y(v);
      g += `<line x1="${padL}" y1="${yy}" x2="${W - padR}" y2="${yy}" stroke="${C.grid}" stroke-width="1"/>
            <text x="${padL - 10}" y="${yy + 4}" text-anchor="end" font-size="11" fill="${C.text}">${formatter(v)}</text>`;
    }

    const slot = iw / labels.length;
    const bw = Math.min(34, (slot * 0.62) / series.length);
    let b = '';
    labels.forEach((lab, i) => {
      const x0 = padL + slot * i + slot / 2 - (bw * series.length) / 2;
      series.forEach((s, k) => {
        const v = s.data[i] || 0, yy = y(v), h = Math.max(1, padT + ih - yy);
        b += `<rect x="${(x0 + k * bw).toFixed(1)}" y="${yy.toFixed(1)}" width="${(bw - 4).toFixed(1)}" height="${h.toFixed(1)}"
                rx="4" fill="${s.color}"><title>${s.name} — ${lab} : ${formatter(v)}</title></rect>`;
      });
      const short = lab.length > 14 ? lab.slice(0, 13) + '…' : lab;
      b += `<text x="${(padL + slot * i + slot / 2).toFixed(1)}" y="${H - padB + 20}" text-anchor="middle"
              font-size="11.5" fill="${C.text}">${short}</text>`;
    });

    container.innerHTML = svg(W, H, `${g}<line x1="${padL}" y1="${padT + ih}" x2="${W - padR}" y2="${padT + ih}" stroke="${C.axis}" stroke-width="1"/>${b}`);
  }

  /* =======================================================
     COURBES
     ======================================================= */
  function line(container, { labels, series, formatter = nf, height = 280, yTicks = 4 }) {
    if (!container) return;
    const W = 700, H = height, padL = 52, padR = 16, padT = 18, padB = 40;
    const iw = W - padL - padR, ih = H - padT - padB;
    const max = niceMax(Math.max(...series.flatMap(s => s.data), 1));
    const x = (i) => padL + (labels.length === 1 ? iw / 2 : (iw / (labels.length - 1)) * i);
    const y = (v) => padT + ih - (v / max) * ih;

    let g = '';
    for (let i = 0; i <= yTicks; i++) {
      const v = (max / yTicks) * i, yy = y(v);
      g += `<line x1="${padL}" y1="${yy}" x2="${W - padR}" y2="${yy}" stroke="${C.grid}"/>
            <text x="${padL - 9}" y="${yy + 4}" text-anchor="end" font-size="11" fill="${C.text}">${formatter(v)}</text>`;
    }

    let paths = '';
    series.forEach((s) => {
      const pts = s.data.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
      if (s.area) {
        paths += `<polygon points="${x(0)},${padT + ih} ${pts} ${x(s.data.length - 1)},${padT + ih}"
                    fill="${s.color}" opacity=".10"/>`;
      }
      paths += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.6"
                  stroke-linejoin="round" stroke-linecap="round" ${s.dashed ? 'stroke-dasharray="6 5"' : ''}/>`;
      paths += s.data.map((v, i) =>
        `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.6" fill="#fff" stroke="${s.color}" stroke-width="2.4">
           <title>${s.name} — ${labels[i]} : ${formatter(v)}</title></circle>`).join('');
    });

    const step = Math.ceil(labels.length / 8);
    const xl = labels.map((l, i) => i % step === 0
      ? `<text x="${x(i).toFixed(1)}" y="${H - padB + 20}" text-anchor="middle" font-size="11.5" fill="${C.text}">${l}</text>` : '').join('');

    container.innerHTML = svg(W, H, `${g}<line x1="${padL}" y1="${padT + ih}" x2="${W - padR}" y2="${padT + ih}" stroke="${C.axis}"/>${paths}${xl}`);
  }

  /* =======================================================
     BARRES HORIZONTALES (classements)
     ======================================================= */
  function hbars(container, { items, formatter = nf, showPct = true }) {
    if (!container) return;
    const total = items.reduce((s, i) => s + i.value, 0) || 1;
    const max = Math.max(...items.map(i => i.value), 1);
    container.innerHTML = items.map(it => `
      <div class="catrow">
        <div class="catrow__label">${it.label}${showPct ? ` <span class="muted small">${Math.round(it.value / total * 100)} %</span>` : ''}</div>
        <div class="pbar" style="height:12px"><div class="pbar__fill" style="width:${(it.value / max * 100).toFixed(1)}%;background:${it.color || C.navy}"></div></div>
        <div class="catrow__val">${formatter(it.value)}</div>
      </div>`).join('');
  }

  /* ---------- Légende ---------- */
  function legend(items) {
    return `<div class="chart-legend">${items.map(i =>
      `<span><i style="background:${i.color}"></i>${i.label}</span>`).join('')}</div>`;
  }

  ERP.Charts = { donut, bars, line, hbars, legend, colors: C };
})(window.ERP);

</script>
<script>
/* ===== js/router.js ===== */
/* =========================================================
   BâtiPilot — Routeur (hash)
   Chaque module s'enregistre : ERP.Router.add('/projets/:id', {...})
   ========================================================= */
window.ERP = window.ERP || {};

(function (ERP) {
  'use strict';

  const routes = [];
  let current = null;
  let onChange = null;

  function add(pattern, def) {
    const keys = [];
    const rx = new RegExp('^' + pattern.replace(/:(\w+)/g, (_, k) => { keys.push(k); return '([^/]+)'; }) + '$');
    routes.push({ pattern, rx, keys, def });
  }

  function match(path) {
    for (const r of routes) {
      const m = path.match(r.rx);
      if (m) {
        const params = {};
        r.keys.forEach((k, i) => { params[k] = decodeURIComponent(m[i + 1]); });
        return { route: r, params };
      }
    }
    return null;
  }

  function path() {
    const h = location.hash.replace(/^#/, '').split('?')[0];
    if (h && h !== '/') return h;
    // L'admin n'a pas de chantier propre — Utilisateurs est son accueil.
    return (ERP.DB.user && ERP.DB.user.role === 'admin') ? '/utilisateurs' : '/dashboard';
  }

  /** #/projets?statut=termine → { statut:'termine' } */
  function query() {
    const q = location.hash.split('?')[1];
    return Object.fromEntries(new URLSearchParams(q || ''));
  }

  async function resolve() {
    const p = path();
    const hit = match(p);
    const host = document.getElementById('view');

    // Chaque rendu reçoit son propre conteneur : si l'utilisateur change de page
    // pendant un chargement, le rendu abandonné écrit dans un nœud détaché
    // au lieu d'écraser la page suivante.
    const view = document.createElement('div');
    view.className = 'view__inner';

    if (!hit) {
      view.innerHTML = ERP.UI.empty('Page introuvable',
        'Le lien demandé ne correspond à aucun module.',
        '<a class="btn btn--primary" href="#/dashboard">Revenir au tableau de bord</a>');
      host.replaceChildren(view);
      return;
    }

    current = { path: p, ...hit };
    if (onChange) onChange(current);

    host.replaceChildren(view);
    host.scrollTop = 0;
    try {
      await hit.route.def.render(hit.params, view);
    } catch (err) {
      console.error(err);
      view.innerHTML = ERP.UI.empty('Chargement impossible',
        'Les données de ce module n\'ont pas pu être récupérées. Réessayez dans un instant.',
        '<button class="btn btn--primary" onclick="location.reload()">Recharger</button>');
    }
  }

  function go(to) {
    // An empty/falsy target must never reach location.hash: '#' + '' is '#',
    // which path() treats as "no route" and silently falls back to the
    // default landing page — i.e. an unrelated click (e.g. a notification
    // with no link) would bounce the user to the dashboard from wherever
    // they were. Guard here once instead of at every call site.
    if (!to) { console.warn('[router] go() called with an empty target — ignored'); return; }
    if (location.hash === '#' + to) resolve();
    else location.hash = to;
  }

  let started = false;
  function start(cb) {
    onChange = cb;
    if (started) {
      // Re-entering an already-started router (e.g. a second enterApp()
      // call) must not attach a second hashchange listener — that would
      // double-render every future navigation. Just refresh the callback
      // and re-resolve the current route instead.
      console.warn('[router] start() called again — reusing the existing listener');
      resolve();
      return;
    }
    started = true;
    window.addEventListener('hashchange', resolve);
    resolve();
  }

  ERP.Router = { add, go, start, path, query, get current() { return current; }, routes };
})(window.ERP);

</script>
<script>
/* ===== js/dashboard.js ===== */
/* =========================================================
   BâtiPilot — Module TABLEAU DE BORD
   ========================================================= */
window.ERP = window.ERP || {};

(function (ERP) {
  'use strict';
  const { icon, fmt, badge, pbar, on, esc } = ERP.UI;

  function kpiCard({ label, value, unit = '', ico, tone = '', foot = '', href = '', alert = false }) {
    const tag = href ? 'button' : 'div';
    return `<${tag} class="kpi ${alert ? 'kpi--alert' : ''}" ${href ? `data-go="${href}" type="button"` : ''}>
        <div class="kpi__top">
          <span class="kpi__ico ${tone}">${icon(ico, 19)}</span>
          <span class="kpi__label">${label}</span>
        </div>
        <div class="kpi__value num">${value}${unit ? `<span>${unit}</span>` : ''}</div>
        <div class="kpi__foot">${foot}</div>
      </${tag}>`;
  }

  async function render(params, view) {
    view.innerHTML = ERP.UI.skeleton(2);

    const isAdmin = ERP.DB.user.role === 'admin';
    const [k, projects, tasks, notifs, activity, pending] = await Promise.all([
      ERP.Api.dashboard.kpis(),
      ERP.Api.projects.list(),
      ERP.Api.tasks.list(),
      ERP.Api.notifications.list(),
      ERP.Api.dashboard.activity(),
      isAdmin ? ERP.Api.admin.users.list().then(us => us.filter(u => !u.active)) : Promise.resolve([])
    ]);

    const active = projects.filter(p => p.status !== 'termine')
      .sort((a, b) => (a.status === 'en_retard' ? -1 : 1) - (b.status === 'en_retard' ? -1 : 1) || b.progress - a.progress);

    const soon = tasks.filter(t => t.status !== 'termine' && ERP.dt.diff(ERP.DB.today, t.due) <= 7)
      .sort((a, b) => a.due.localeCompare(b.due)).slice(0, 6);

    const lateProjects = active.filter(p => p.daysLate > 0);

    view.innerHTML = `
      <div class="hello">
        <div class="hello__txt">
          <h2>Bonjour, ${ERP.DB.user.firstName} 👋</h2>
          <div class="hello__date">${fmt.dateFull(ERP.DB.today)}</div>
        </div>
        <div class="hello__meteo">
          <span style="color:var(--orange)">${icon('alert', 22)}</span>
          <div><b class="num">34°C</b><small>Ariana — vent 18 km/h, coulage déconseillé après 13 h</small></div>
        </div>
      </div>

      <div class="kpis">
        ${kpiCard({ label: 'Projets actifs', value: k.activeProjects, ico: 'building', tone: '', href: '#/projets', foot: `${k.lateProjects} en retard` })}
        ${kpiCard({ label: 'Projets terminés', value: k.doneProjects, ico: 'check', tone: 'kpi__ico--ok', href: '#/projets?statut=termine', foot: 'Livrés depuis 2023' })}
        ${kpiCard({ label: 'Ouvriers présents aujourd\'hui', value: k.present, unit: `/ ${k.scheduled}`, ico: 'hardhat', tone: 'kpi__ico--orange', href: '#/pointage', foot: `${k.absent} absents` })}
        ${kpiCard({ label: 'Heures travaillées aujourd\'hui', value: Math.round(k.hoursToday), unit: 'h', ico: 'clock', tone: '', href: '#/pointage', foot: `Moyenne ${fmt.hours(k.hoursToday / k.present)} par ouvrier` })}
        ${kpiCard({ label: 'Tâches en retard', value: k.lateTasks, ico: 'alert', tone: 'kpi__ico--danger', href: '#/taches', alert: k.lateTasks > 0, foot: 'Échéance dépassée' })}
        ${kpiCard({ label: 'Budget consommé', value: k.burn, unit: '%', ico: 'wallet', tone: 'kpi__ico--warn', href: '#/budgets', foot: `${fmt.moneyShort(k.remaining)} disponibles` })}
      </div>

      ${isAdmin && pending.length ? `
      <div class="alert-band alert-band--danger" id="dashPending" style="margin-bottom:var(--gap)">
        <div class="row" style="gap:12px;flex:1;flex-wrap:wrap;align-items:center">
          <div style="flex:1;min-width:220px">
            <strong>${pending.length} compte${pending.length > 1 ? 's' : ''} ingénieur en attente d'approbation</strong>
            <p>${pending.map(u => esc(u.fullName || u.email)).join(' · ')}</p>
          </div>
          <div class="row" style="gap:8px;flex-wrap:wrap">
            ${pending.slice(0, 3).map(u => `<button class="btn btn--sm btn--primary" data-approve="${u.id}">${icon('check', 16)} Approuver ${esc((u.fullName || u.email).split(' ')[0])}</button>`).join('')}
            <a class="btn btn--sm" href="#/utilisateurs">Voir tout</a>
          </div>
        </div>
      </div>` : ''}

      ${lateProjects.length ? `
      <div class="alert-band" style="margin-bottom:var(--gap)">
        <div class="row" style="gap:12px;flex:1;flex-wrap:wrap">
          <div>
            <strong>${lateProjects.length} chantier${lateProjects.length > 1 ? 's' : ''} en dépassement de délai</strong>
            <p>${lateProjects.map(p => `${esc(p.name)} (+${p.daysLate} j — ${p.latePhases.join(', ')})`).join(' · ')}</p>
          </div>
          <a class="btn btn--sm" href="#/planning" style="margin-left:auto">Ouvrir le planning</a>
        </div>
      </div>` : ''}

      <div class="dash-cols">
        <div class="stack">
          <div class="section-title">
            <h2>Projets en cours</h2>
            <span class="tag">${active.length} chantiers</span>
            <span class="spacer"></span>
            <a class="btn btn--sm" href="#/projets">Tout voir ${icon('chevronRight', 16)}</a>
          </div>
          <div class="stack" id="dashProjects">
            ${active.slice(0, 4).map(p => ERP.Components.projectCard(p)).join('')}
          </div>
        </div>

        <div class="stack">
          <section class="card">
            <div class="card__head">
              <h3>Alertes du jour</h3>
              <span class="spacer"></span>
              <span class="badge badge--danger">${notifs.filter(n => !n.read).length} nouvelles</span>
            </div>
            <div class="card__body card__body--flush">
              ${notifs.slice(0, 4).map(n => `
                <button class="notif notif--${n.level}" data-go="${n.link}">
                  <span class="notif__ico ${n.level === 'danger' ? 'kpi__ico--danger' : n.level === 'warn' ? 'kpi__ico--warn' : 'kpi__ico--ok'}">
                    ${icon(n.level === 'info' ? 'info' : 'alert', 18)}
                  </span>
                  <span class="notif__body">
                    <strong>${esc(n.title)}</strong>
                    <small>${esc(n.text)} · ${n.time}</small>
                  </span>
                </button>`).join('')}
            </div>
          </section>

          <section class="card">
            <div class="card__head">
              <h3>Échéances des 7 prochains jours</h3>
              <span class="spacer"></span>
              <a class="btn btn--sm btn--ghost" href="#/taches">Tâches</a>
            </div>
            <div class="card__body card__body--flush">
              ${soon.length ? soon.map(t => {
                const late = t.due < ERP.DB.today;
                const d = ERP.dt.diff(ERP.DB.today, t.due);
                return `<button class="list-row" data-go="#/taches">
                  <span class="prio prio--${t.priority}" style="height:34px"></span>
                  <span class="list-row__txt">
                    <strong>${esc(t.title)}</strong>
                    <small>${esc(t.projectName)} · ${esc(t.assignee)}</small>
                  </span>
                  <span class="list-row__end">
                    <span class="badge ${late ? 'badge--danger' : d <= 2 ? 'badge--warn' : 'badge--plain'}">
                      ${late ? `+${-d} j de retard` : d === 0 ? 'Aujourd\'hui' : `dans ${d} j`}
                    </span>
                  </span>
                </button>`;
              }).join('') : '<div class="empty" style="padding:28px">Aucune échéance cette semaine.</div>'}
            </div>
          </section>

          <section class="card">
            <div class="card__head"><h3>Activité du chantier</h3></div>
            <div class="card__body card__body--flush">
              ${activity.map(a => `
                <div class="list-row">
                  <span class="list-row__ico ${a.tone === 'ok' ? 'kpi__ico--ok' : a.tone === 'danger' ? 'kpi__ico--danger' : a.tone === 'warn' ? 'kpi__ico--warn' : ''}">
                    ${icon(a.icon, 18)}
                  </span>
                  <span class="list-row__txt">
                    <strong>${esc(a.title)}</strong>
                    <small>${esc(a.meta)}</small>
                  </span>
                  <span class="list-row__end small muted num">${a.time}</span>
                </div>`).join('')}
            </div>
          </section>
        </div>
      </div>`;

    on(view, 'click', '[data-go]', (e, t) => ERP.Router.go(t.dataset.go.replace(/^#/, '')));
    on(view, 'click', '.project-card', (e, t) => ERP.Router.go('/projets/' + t.dataset.id));
    on(view, 'click', '[data-approve]', async (e, t) => {
      t.disabled = true;
      try {
        await ERP.Api.admin.users.update(t.dataset.approve, { active: true });
        ERP.UI.toast('Compte approuvé', 'ok');
        render(params, view);
      } catch (err) {
        ERP.UI.toast('Erreur : ' + (err.message || err), 'danger');
        t.disabled = false;
      }
    });
  }

  ERP.Router.add('/dashboard', { title: 'Tableau de bord', sub: 'Vue globale de l\'activité', render });
})(window.ERP);

</script>
<script>
/* ===== js/projects.js ===== */
/* =========================================================
   BâtiPilot — Module PROJETS (liste + fiche)
   ========================================================= */
window.ERP = window.ERP || {};
ERP.Components = ERP.Components || {};

(function (ERP) {
  'use strict';
  const { icon, fmt, badge, pbar, progressClass, on, esc, toast, confirm } = ERP.UI;

  const STATUS_MOD = { en_retard: 'project-card--late', en_preparation: 'project-card--prep', termine: 'project-card--done' };

  /* ---------- Carte projet (réutilisée par le tableau de bord) ---------- */
  ERP.Components.projectCard = function (p) {
    return `
    <button class="project-card ${STATUS_MOD[p.status] || ''}" data-id="${p.id}" type="button">
      <span class="project-card__stripe"></span>
      <div class="project-card__head">
        <div class="project-card__title">
          <h3>${esc(p.name)}</h3>
          <div class="project-card__meta">
            <span>${icon('users', 14)} ${esc(p.clientName)}</span>
            <span>${icon('pin', 14)} ${esc(p.address)}</span>
            <span>${icon('user', 14)} ${esc(p.manager)}</span>
          </div>
        </div>
        ${badge('project', p.status)}
      </div>

      <div class="project-card__grid">
        <dl class="mini"><dt>Début</dt><dd>${fmt.date(p.start)}</dd></dl>
        <dl class="mini"><dt>Fin prévue</dt><dd>${fmt.date(p.end)}</dd></dl>
        <dl class="mini"><dt>Budget</dt><dd>${fmt.moneyShort(p.budget)}</dd></dl>
        <dl class="mini"><dt>Consommé</dt><dd>${fmt.moneyShort(p.spent)} · ${p.burn} %</dd></dl>
      </div>

      <div class="project-card__prog">
        <div class="lbl"><span>Progression du chantier</span><b class="num">${p.progress} %</b></div>
        ${pbar(p.progress, p.status === 'en_retard' ? 'pbar__fill--danger' : p.status === 'termine' ? 'pbar__fill--ok' : '')}
        ${p.daysLate ? `<div class="row small" style="margin-top:9px;color:var(--danger);font-weight:600">
            ${icon('alert', 15)} Retard de ${p.daysLate} jours — ${esc(p.latePhases.join(', '))}</div>` : ''}
      </div>
    </button>`;
  };

  /* =======================================================
     LISTE
     ======================================================= */
  const FILTERS = [
    ['tous', 'Tous'], ['en_preparation', 'En préparation'], ['en_cours', 'En cours'],
    ['en_retard', 'En retard'], ['termine', 'Terminés']
  ];

  const state = { status: 'tous', q: '', view: 'cards' };

  async function renderList(params, view) {
    const qs = ERP.Router.query();
    if (qs.statut) state.status = qs.statut;

    view.innerHTML = `
      <div class="toolbar">
        <div class="chips" id="prjFilters"></div>
        <span class="spacer"></span>
        <div class="search-field">
          <span class="ico">${icon('search', 19)}</span>
          <input type="search" id="prjSearch" placeholder="Nom, client ou localisation…" value="${esc(state.q)}">
        </div>
        <div class="segmented" id="prjView">
          <button data-v="cards" class="${state.view === 'cards' ? 'is-active' : ''}">${icon('kanban', 17)} Cartes</button>
          <button data-v="table" class="${state.view === 'table' ? 'is-active' : ''}">${icon('list', 17)} Tableau</button>
        </div>
        <button class="btn btn--accent write-guard" id="prjAdd">${icon('plus', 20)} Nouveau projet</button>
      </div>
      <div id="prjResults"></div>`;

    const results = view.querySelector('#prjResults');

    async function refresh() {
      const all = await ERP.Api.projects.list({ q: state.q });
      const counts = FILTERS.reduce((acc, [k]) => {
        acc[k] = k === 'tous' ? all.length : all.filter(p => p.status === k).length; return acc;
      }, {});
      view.querySelector('#prjFilters').innerHTML = FILTERS.map(([k, l]) =>
        `<button class="chip ${state.status === k ? 'is-active' : ''}" data-f="${k}">${l}<span class="chip__n num">${counts[k]}</span></button>`).join('');

      const list = state.status === 'tous' ? all : all.filter(p => p.status === state.status);

      if (!list.length) {
        results.innerHTML = ERP.UI.empty('Aucun projet ne correspond',
          'Modifiez la recherche ou choisissez un autre filtre pour retrouver un chantier.');
        return;
      }

      results.innerHTML = state.view === 'cards'
        ? `<div class="projects-grid">${list.map(ERP.Components.projectCard).join('')}</div>`
        : `<div class="card"><div class="table-wrap"><table class="tbl">
            <thead><tr>
              <th>Projet</th><th>Client</th><th>Localisation</th><th>Période</th>
              <th style="min-width:180px">Progression</th><th class="t-right">Budget</th><th>Statut</th>
            </tr></thead>
            <tbody>${list.map(p => `
              <tr class="is-clickable" data-id="${p.id}">
                <td><div class="cell-main">${esc(p.name)}</div><div class="cell-sub num">${p.ref}</div></td>
                <td>${esc(p.clientName)}</td>
                <td>${esc(p.city)}</td>
                <td class="num">${fmt.date(p.start)} → ${fmt.date(p.end)}</td>
                <td><div class="pbar-row">${pbar(p.progress, p.status === 'en_retard' ? 'pbar__fill--danger' : '', true)}<b class="num">${p.progress}%</b></div></td>
                <td class="t-right"><div class="cell-main num">${fmt.moneyShort(p.budget)}</div><div class="cell-sub num">${p.burn} % consommé</div></td>
                <td>${badge('project', p.status)}</td>
              </tr>`).join('')}</tbody></table></div></div>`;
    }

    await refresh();

    on(view, 'click', '.chip[data-f]', (e, t) => { state.status = t.dataset.f; refresh(); });
    on(view, 'click', '#prjView button', (e, t) => {
      state.view = t.dataset.v;
      view.querySelectorAll('#prjView button').forEach(b => b.classList.toggle('is-active', b === t));
      refresh();
    });
    view.querySelector('#prjSearch').addEventListener('input', ERP.UI.debounce((e) => {
      state.q = e.target.value; refresh();
    }, 200));
    view.querySelector('#prjAdd').onclick = () => openCreate();
    on(view, 'click', '[data-id]', (e, t) => ERP.Router.go('/projets/' + t.dataset.id));
  }

  /* =======================================================
     NOUVEAU PROJET — les tâches sont choisies une par une
     ======================================================= */
  async function openCreate() {
    const clients = ERP.DB.clients;
    const today = ERP.DB.today;
    const catalog = (await ERP.Api.taskCatalog.list()).filter(c => c.active);
    const articles = await ERP.Api.articles.list();
    const artCats = [...new Set(articles.map(a => a.category))];
    const picked = [];     // tâches retenues pour ce chantier
    const pickedMat = [];  // matériaux affectés dès l'ouverture

    const m = ERP.UI.modal({
      title: 'Nouveau projet', sub: 'Ouvrir un chantier dans le portefeuille', size: 'modal--wide',
      body: `<div class="form-grid">
          <div class="field field--full"><label for="n-name">Nom du projet</label>
            <input id="n-name" placeholder="Ex. : Résidence Les Oliviers"></div>
          <div class="field"><label for="n-client">Client</label>
            <select id="n-client">${clients.map(c => `<option value="${c.id}">${esc(c.company)}</option>`).join('')}</select></div>
          <div class="field"><label for="n-type">Nature de l'ouvrage</label>
            <input id="n-type" placeholder="Ex. : Immeuble R+4, 18 logements"></div>
          <div class="field"><label for="n-city">Ville</label><input id="n-city" placeholder="Tunis"></div>
          <div class="field"><label for="n-manager">Chef de projet</label>
            <input id="n-manager" value="${esc(ERP.DB.user.name)}"></div>
          <div class="field field--full"><label for="n-address">Adresse du chantier</label>
            <input id="n-address" placeholder="Rue, quartier, gouvernorat"></div>
          <div class="field"><label for="n-start">Date de début</label><input id="n-start" type="date" value="${today}"></div>
          <div class="field"><label for="n-end">Fin prévue</label><input id="n-end" type="date" value="${ERP.dt.add(today, 180)}"></div>
          <div class="field"><label for="n-budget">Budget prévisionnel (DT)</label>
            <input id="n-budget" type="number" min="0" step="1000" placeholder="150000"></div>
          <div class="field"><label for="n-status">Statut initial</label>
            <select id="n-status">
              <option value="en_preparation">En préparation</option>
              <option value="en_cours">En cours</option>
            </select></div>
        </div>

        <h3 style="margin:22px 0 4px">Tâches du chantier</h3>
        <p class="small muted" style="margin-bottom:12px">
          Choisissez une tâche dans le catalogue, fixez ses dates, ajoutez-la — puis recommencez.
          Chaque tâche retenue devient une ligne de suivi et un lot du planning.</p>

        <div class="pick">
          <div class="pick__form">
            <div class="field"><label for="pk-task">Tâche</label>
              <select id="pk-task">
                ${ERP.DB.taskPhases.map(ph => {
                  const items = catalog.filter(c => c.category === ph);
                  return items.length ? `<optgroup label="${ph}">${items.map(c =>
                    `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</optgroup>` : '';
                }).join('')}
              </select></div>
            <div class="field"><label for="pk-start">Début</label><input id="pk-start" type="date" value="${today}"></div>
            <div class="field"><label for="pk-end">Fin</label><input id="pk-end" type="date" value="${ERP.dt.add(today, 10)}"></div>
            <button class="btn btn--primary pick__add" id="pk-add" type="button">${icon('plus', 19)} Ajouter</button>
          </div>
          <div class="pick__list" id="pk-list"></div>
        </div>

        <h3 style="margin:22px 0 4px">Matériaux affectés</h3>
        <p class="small muted" style="margin-bottom:12px">
          Choisissez un matériau, saisissez la quantité, ajoutez-le. Les quantités sont déduites
          du stock du dépôt à la création du chantier et imputées au poste Matériaux du budget.</p>

        <div class="pick">
          <div class="pick__form" style="grid-template-columns:1.9fr .7fr auto">
            <div class="field"><label for="mk-art">Matériau</label>
              <select id="mk-art">
                ${artCats.map(c => `<optgroup label="${esc(c)}">${articles.filter(a => a.category === c).map(a =>
                  `<option value="${a.id}" ${a.stock === 0 ? 'disabled' : ''}>${esc(a.name)} — ${fmt.dec(a.stock, 0)} ${a.unit} en stock${a.stock === 0 ? ' (rupture)' : ''}</option>`).join('')}</optgroup>`).join('')}
              </select></div>
            <div class="field"><label for="mk-qty">Quantité</label><input id="mk-qty" type="number" min="1" value="10"></div>
            <button class="btn btn--primary pick__add" id="mk-add" type="button">${icon('plus', 19)} Ajouter</button>
          </div>
          <div class="pick__list" id="mk-list"></div>
        </div>`,
      footer: `<button class="btn" data-cancel type="button">Annuler</button>
               <button class="btn btn--primary" data-save type="button">${icon('save', 18)} Créer le projet</button>`
    });

    const q = (sel) => m.body.querySelector(sel);
    const g = (sel) => q(sel).value.trim();

    /* --- Liste des tâches retenues --- */
    function drawPicked() {
      const box = q('#pk-list');
      if (!picked.length) {
        box.innerHTML = '<div class="pick__empty">Aucune tâche retenue pour l\'instant. Un chantier peut être créé sans tâche et complété plus tard.</div>';
        return;
      }
      box.innerHTML = picked.map((t, i) => `
        <div class="pick__row">
          <span class="pick__n">${i + 1}</span>
          <span><span class="pick__name">${esc(t.name)}</span>
            <span class="pick__meta">${esc(t.category)} · ${esc(t.assignee)}</span></span>
          <span class="pick__dates">${fmt.date(t.start)} → ${fmt.date(t.end)}<br>
            <b class="num">${ERP.dt.diff(t.start, t.end)} j</b></span>
          <button class="icon-btn icon-btn--sm icon-btn--danger" data-rm="${i}" type="button" aria-label="Retirer">${icon('trash', 17)}</button>
        </div>`).join('');
    }

    /* Le choix d'une tâche cale automatiquement ses dates sur la précédente */
    function suggestDates() {
      const c = catalog.find(x => x.id === q('#pk-task').value);
      if (!c) return;
      const from = picked.length ? ERP.dt.add(picked[picked.length - 1].end, 1) : g('#n-start');
      q('#pk-start').value = from;
      q('#pk-end').value = ERP.dt.add(from, c.defaultDays);
    }
    q('#pk-task').onchange = suggestDates;
    q('#n-start').onchange = () => { if (!picked.length) suggestDates(); };
    suggestDates();

    q('#pk-add').onclick = () => {
      const c = catalog.find(x => x.id === q('#pk-task').value);
      if (!c) { toast('Choisissez une tâche dans le catalogue', 'danger'); return; }
      if (g('#pk-end') < g('#pk-start')) { toast('La date de fin doit suivre la date de début', 'danger'); return; }
      if (picked.some(t => t.name === c.name)) { toast('Cette tâche est déjà retenue', 'warn'); return; }
      const worker = ERP.DB.workers.find(w => w.trade === c.trade);
      picked.push({
        catalogId: c.id, name: c.name, category: c.category,
        start: g('#pk-start'), end: g('#pk-end'),
        assignee: worker ? worker.name : g('#n-manager') || ERP.DB.user.name
      });
      drawPicked();
      suggestDates();
      toast(`${c.name} ajoutée (${picked.length})`, 'ok', 1600);
    };

    on(m.body, 'click', '[data-rm]', (e, b) => {
      picked.splice(+b.dataset.rm, 1); drawPicked();
    });
    drawPicked();

    /* --- Matériaux retenus --- */
    function drawMaterials() {
      const box = q('#mk-list');
      if (!pickedMat.length) {
        box.innerHTML = '<div class="pick__empty">Aucun matériau affecté. Vous pourrez en ajouter à tout moment depuis la fiche du chantier.</div>';
        return;
      }
      const total = pickedMat.reduce((s, x) => s + x.qty * x.price, 0);
      box.innerHTML = pickedMat.map((x, i) => `
        <div class="pick__row">
          <span class="pick__n">${i + 1}</span>
          <span><span class="pick__name">${esc(x.name)}</span>
            <span class="pick__meta">${esc(x.category)} · ${fmt.dec(x.price, 2)} DT / ${x.unit}
              · reste ${fmt.dec(x.stock - x.qty, 0)} ${x.unit} au dépôt</span></span>
          <span class="pick__dates"><b class="num">${fmt.dec(x.qty, 0)} ${x.unit}</b><br>
            <span class="money num">${fmt.money(x.qty * x.price)}</span></span>
          <button class="icon-btn icon-btn--sm icon-btn--danger" data-rmmat="${i}" type="button" aria-label="Retirer">${icon('trash', 17)}</button>
        </div>`).join('') +
        `<div class="pick__row" style="background:var(--surface-2)">
          <span></span><span class="pick__name">Total matériaux</span>
          <span class="pick__dates"><b class="money num" style="color:var(--orange)">${fmt.money(total)}</b></span><span></span>
        </div>`;
    }

    q('#mk-add').onclick = () => {
      const a = articles.find(x => x.id === q('#mk-art').value);
      if (!a) { toast('Choisissez un matériau', 'danger'); return; }
      const n = Math.max(0, +q('#mk-qty').value || 0);
      if (n < 1) { toast('Indiquez une quantité', 'danger'); return; }
      const already = pickedMat.find(x => x.articleId === a.id);
      const engaged = (already ? already.qty : 0) + n;
      if (engaged > a.stock) {
        toast(`Stock insuffisant : ${fmt.dec(a.stock, 0)} ${a.unit} disponibles`, 'danger'); return;
      }
      if (already) already.qty = engaged;
      else pickedMat.push({
        articleId: a.id, name: a.name, category: a.category,
        unit: a.unit, price: a.price, stock: a.stock, qty: n
      });
      drawMaterials();
      toast(`${a.name} : ${engaged} ${a.unit}`, 'ok', 1600);
    };
    on(m.body, 'click', '[data-rmmat]', (e, b) => { pickedMat.splice(+b.dataset.rmmat, 1); drawMaterials(); });
    drawMaterials();

    /* --- Enregistrement --- */
    m.foot.querySelector('[data-cancel]').onclick = m.close;
    m.foot.querySelector('[data-save]').onclick = async () => {
      if (!g('#n-name')) { toast('Le nom du projet est obligatoire', 'danger'); return; }
      if (g('#n-end') <= g('#n-start')) { toast('La fin prévue doit suivre la date de début', 'danger'); return; }
      const budget = +g('#n-budget');
      if (!budget || budget <= 0) { toast('Indiquez un budget prévisionnel', 'danger'); return; }

      const manager = g('#n-manager') || ERP.DB.user.name;
      const p = await ERP.Api.projects.create({
        name: g('#n-name'),
        clientId: g('#n-client'),
        type: g('#n-type') || 'Non précisée',
        city: g('#n-city') || 'Tunis',
        address: g('#n-address') || g('#n-city') || 'Tunis',
        manager,
        start: g('#n-start'),
        end: g('#n-end'),
        budget,
        status: q('#n-status').value,
        tasks: picked.map(t => ({ name: t.name, start: t.start, end: t.end, assignee: t.assignee }))
      });

      // Les matériaux retenus sortent du stock et sont imputés au chantier
      for (const x of pickedMat) {
        try { await ERP.Api.materials.create({ projectId: p.id, articleId: x.articleId, qty: x.qty, note: 'Dotation initiale du chantier' }); }
        catch (err) { toast(`${x.name} : stock devenu insuffisant, affectation ignorée`, 'warn', 4000); }
      }

      m.close();
      const parts = [];
      if (picked.length) parts.push(`${picked.length} tâche${picked.length > 1 ? 's' : ''}`);
      if (pickedMat.length) parts.push(`${pickedMat.length} matériau${pickedMat.length > 1 ? 'x' : ''}`);
      toast(`Projet « ${p.name} » créé${parts.length ? ' avec ' + parts.join(' et ') : ''}`, 'ok', 3200);
      ERP.Router.go('/projets/' + p.id);
    };
  }

  /* =======================================================
     ATTACHEMENTS DU CHANTIER
     Plans, photos et documents. Sur tablette, « Prendre une
     photo » ouvre directement l'appareil photo arrière.
     ======================================================= */
  const KIND_LABEL = { plan: 'Plan', photo: 'Photo', document: 'Document' };

  function fileKind(file) {
    if (file.type && file.type.startsWith('image/')) return 'photo';
    if (/plan|coffrage|masse|coupe/i.test(file.name)) return 'plan';
    return 'document';
  }

  function fileSize(n) {
    return n >= 1048576 ? (n / 1048576).toFixed(1).replace('.', ',') + ' Mo'
      : Math.max(1, Math.round(n / 1024)) + ' Ko';
  }

  async function openAttachments(p, onChange) {
    const m = ERP.UI.modal({
      title: 'Attachements du chantier', sub: esc(p.name), size: 'modal--wide',
      body: `
        <div class="capture-row" style="margin-bottom:16px">
          <button class="btn btn--accent write-guard" data-photo type="button">${icon('camera', 20)} Prendre une photo</button>
          <button class="btn btn--primary write-guard" data-file type="button">${icon('upload', 20)} Téléverser un fichier</button>
          <span class="spacer"></span>
          <span class="tag" id="att-n">0 pièce</span>
        </div>
        <input type="file" id="att-camera" accept="image/*" capture="environment" hidden>
        <input type="file" id="att-input" multiple hidden>
        <div id="att-body"></div>`,
      footer: `<span class="small muted">Photos et plans restent attachés à ce chantier.</span>
               <span style="flex:1"></span>
               <button class="btn" data-cancel type="button">Fermer</button>`,
      onClose: () => onChange && onChange()
    });

    async function draw() {
      const list = await ERP.Api.attachments.list(p.id);
      m.body.querySelector('#att-n').textContent =
        `${list.length} pièce${list.length > 1 ? 's' : ''}`;
      m.body.querySelector('#att-body').innerHTML = list.length ? `
        <div class="att-grid">${list.map(a => `
          <article class="att" data-att="${a.id}">
            <div class="att__thumb att__thumb--${a.kind}">
              ${a.url ? `<img src="${a.url}" alt="${esc(a.name)}">`
                : icon(a.kind === 'photo' ? 'image' : a.kind === 'plan' ? 'file' : 'file', 34)}
              <span class="att__kind">${KIND_LABEL[a.kind] || 'Pièce'}</span>
            </div>
            <div class="att__body">
              <div class="att__name">${esc(a.name)}</div>
              <div class="att__meta">${fmt.date(a.date)} · ${fileSize(a.size)}<br>${esc(a.author)}</div>
            </div>
            <div class="att__foot">
              <button class="btn btn--sm btn--block" data-open type="button">${icon('eye', 16)} Ouvrir</button>
              <button class="icon-btn icon-btn--sm icon-btn--danger write-guard" data-del type="button" aria-label="Supprimer">${icon('trash', 17)}</button>
            </div>
          </article>`).join('')}</div>`
        : ERP.UI.empty('Aucune pièce jointe',
            'Photographiez l\'avancement du chantier ou téléversez les plans et procès-verbaux.');
    }

    async function addFiles(files, forcedKind) {
      for (const f of files) {
        const isImage = f.type && f.type.startsWith('image/');
        const url = isImage ? URL.createObjectURL(f) : null;
        await ERP.Api.attachments.create(p.id, {
          name: f.name || `Photo chantier ${ERP.DB.today} (${Date.now().toString(36)}).jpg`,
          kind: forcedKind || fileKind(f), size: f.size, url
        });
      }
      await draw();
      onChange && onChange();
      toast(`${files.length} pièce${files.length > 1 ? 's' : ''} attachée${files.length > 1 ? 's' : ''}`, 'ok');
    }

    m.body.querySelector('[data-photo]').onclick = () => m.body.querySelector('#att-camera').click();
    m.body.querySelector('[data-file]').onclick = () => m.body.querySelector('#att-input').click();
    m.body.querySelector('#att-camera').onchange = (e) => {
      if (e.target.files.length) addFiles([...e.target.files], 'photo');
      e.target.value = '';
    };
    m.body.querySelector('#att-input').onchange = (e) => {
      if (e.target.files.length) addFiles([...e.target.files]);
      e.target.value = '';
    };

    on(m.body, 'click', '[data-open]', async (e, b) => {
      const id = b.closest('[data-att]').dataset.att;
      const a = (await ERP.Api.attachments.list(p.id)).find(x => x.id === id);
      if (a.url) window.open(a.url, '_blank');
      else toast('Aperçu indisponible pour cette pièce de démonstration', 'info');
    });
    on(m.body, 'click', '[data-del]', async (e, b) => {
      const id = b.closest('[data-att]').dataset.att;
      const a = (await ERP.Api.attachments.list(p.id)).find(x => x.id === id);
      const ok = await ERP.UI.confirm({
        title: 'Supprimer cette pièce ?', danger: true, confirmLabel: 'Supprimer',
        text: `<b>${esc(a.name)}</b> sera détachée du chantier.`
      });
      if (ok) { await ERP.Api.attachments.remove(p.id, id); await draw(); onChange && onChange(); toast('Pièce supprimée', 'ok'); }
    });
    m.foot.querySelector('[data-cancel]').onclick = m.close;

    await draw();
  }

  /* =======================================================
     FICHE PROJET
     ======================================================= */
  async function renderDetail(params, view) {
    view.innerHTML = ERP.UI.skeleton(2);
    const p = await ERP.Api.projects.get(params.id);
    if (!p) { view.innerHTML = ERP.UI.empty('Projet introuvable', 'Ce chantier n\'existe pas ou a été archivé.'); return; }

    const [tasks, workers, attachments] = await Promise.all([
      ERP.Api.tasks.list({ projectId: p.id }),
      ERP.Api.workers.list({ projectId: p.id }),
      ERP.Api.attachments.list(p.id)
    ]);
    const daysLeft = ERP.dt.diff(ERP.DB.today, p.end);

    view.innerHTML = `
      <div class="backbar">
        <button class="icon-btn" data-back type="button" aria-label="Retour">${icon('arrowLeft', 22)}</button>
        <div>
          <div class="crumb"><a href="#/projets">Projets</a> / <b>${esc(p.ref)}</b></div>

        </div>
        ${badge('project', p.status)}

        <button class="btn btn--sm" data-attach type="button">${icon('paperclip', 18)} Attachements
          <span class="chip__n num" id="attCount">${attachments.length}</span></button>
        <button class="btn btn--sm btn--primary write-guard" data-edit type="button">${icon('edit', 18)} Modifier</button>
        <button class="btn btn--sm btn--danger write-guard" data-del-project type="button">${icon('trash', 18)} Supprimer</button>
