        <div class="kpi"><div class="kpi__top"><span class="kpi__ico kpi__ico--ok">${icon('hardhat', 19)}</span><span class="kpi__label">Taux de présence</span></div>
          <div class="kpi__value num">${presenceRate}<span>%</span></div>
          <div class="kpi__foot">Moyenne sur la période</div></div>
        <div class="kpi"><div class="kpi__top"><span class="kpi__ico">${icon('building', 19)}</span><span class="kpi__label">Progression moyenne</span></div>
          <div class="kpi__value num">${avgProgress}<span>%</span></div>
          <div class="kpi__foot">Sur ${active.length} chantiers actifs</div></div>
        <div class="kpi ${sum.burn >= 80 ? 'kpi--alert' : ''}"><div class="kpi__top"><span class="kpi__ico kpi__ico--warn">${icon('wallet', 19)}</span><span class="kpi__label">Budget consommé</span></div>
          <div class="kpi__value num">${sum.burn}<span>%</span></div>
          <div class="kpi__foot">${fmt.moneyShort(sum.remaining)} restants</div></div>
      </div>

      <section class="card" style="margin-top:var(--gap)">
        <div class="card__head"><span class="eyebrow">Rapport 1</span><h3>Productivité de la main-d'œuvre</h3><span class="spacer"></span>
          <span class="badge ${productivity >= 95 ? 'badge--ok' : productivity >= 85 ? 'badge--warn' : 'badge--danger'}">${productivity} % de rendement</span></div>
        <div class="card__body chart-box" id="rpProd"></div>
        <div class="card__foot">${ERP.Charts.legend([
          { label: 'Heures travaillées', color: C.navy }, { label: 'Heures prévues (8 h/ouvrier)', color: C.orange }
        ])}</div>
      </section>

      <div class="grid-2" style="margin-top:var(--gap);align-items:start">
        <section class="card">
          <div class="card__head"><span class="eyebrow">Rapport 2</span><h3>Projets par statut</h3></div>
          <div class="card__body row" style="gap:24px;justify-content:center;flex-wrap:wrap">
            <div id="rpStatus" style="width:210px"></div>
            <div class="stack" style="gap:10px;min-width:180px">
              ${byStatus.map(s => `<div class="row" style="gap:10px">
                <i style="width:12px;height:12px;border-radius:3px;background:${s.color};flex:none"></i>
                <span style="flex:1">${s.label}</span><b class="num">${s.value}</b></div>`).join('')}
              <div class="row" style="gap:10px;border-top:1px solid var(--border);padding-top:10px">
                <span style="flex:1" class="muted">Total</span><b class="num">${projects.length}</b></div>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="card__head"><span class="eyebrow">Rapport 3</span><h3>Heures par métier — aujourd'hui</h3></div>
          <div class="card__body" id="rpTrades"></div>
        </section>
      </div>

      <section class="card" style="margin-top:var(--gap)">
        <div class="card__head"><span class="eyebrow">Rapport 4</span><h3>Présence et absences</h3><span class="spacer"></span>
          <span class="tag">${attendance.length} jours ouvrés</span></div>
        <div class="card__body chart-box" id="rpPresence"></div>
        <div class="card__foot">${ERP.Charts.legend([
          { label: 'Présents', color: C.ok }, { label: 'Absents', color: C.danger }
        ])}</div>
      </section>

      <section class="card" style="margin-top:var(--gap)">
        <div class="card__head"><span class="eyebrow">Rapport 5</span><h3>Écarts budgétaires par chantier</h3></div>
        <div class="card__body card__body--flush"><div class="table-wrap">
          <table class="tbl"><thead><tr>
            <th>Chantier</th><th class="t-right">Budget prévu</th><th class="t-right">Consommé</th>
            <th class="t-right">Écart</th><th style="min-width:150px">Avancement</th><th style="min-width:150px">Consommation</th><th>Analyse</th>
          </tr></thead><tbody>
            ${active.map(p => {
              const gap = p.burn - p.progress;
              return `<tr class="is-clickable" data-id="${p.id}">
                <td class="cell-main">${esc(p.name)}</td>
                <td class="t-right money num">${fmt.money(p.budget)}</td>
                <td class="t-right money num">${fmt.money(p.spent)}</td>
                <td class="t-right money num" style="color:${p.remaining < 0 ? 'var(--danger)' : 'var(--ok)'}">${p.remaining >= 0 ? '+' : ''}${fmt.money(p.remaining)}</td>
                <td><div class="pbar-row">${pbar(p.progress, '', true)}<b class="num">${p.progress}%</b></div></td>
                <td><div class="pbar-row">${pbar(p.burn, ERP.UI.progressClass(p.burn), true)}<b class="num">${p.burn}%</b></div></td>
                <td>${gap > 10 ? '<span class="badge badge--danger">Dérive des coûts</span>'
                  : gap > 0 ? '<span class="badge badge--warn">À surveiller</span>'
                  : '<span class="badge badge--ok">Maîtrisé</span>'}</td>
              </tr>`;
            }).join('')}
          </tbody></table>
        </div></div>
      </section>`;

    const labels = attendance.map(d => fmt.dateShort(d.date));
    ERP.Charts.line(view.querySelector('#rpProd'), {
      labels,
      series: [
        { name: 'Heures travaillées', color: C.navy, data: attendance.map(d => d.hours), area: true },
        { name: 'Heures prévues', color: C.orange, data: attendance.map(d => d.planned), dashed: true }
      ],
      formatter: (v) => Math.round(v) + ' h', height: 290
    });

    ERP.Charts.donut(view.querySelector('#rpStatus'), {

      formatter: (v) => v + ' h'

    ERP.Charts.bars(view.querySelector('#rpPresence'), {
      labels,
      series: [
        { name: 'Présents', color: C.ok, data: attendance.map(d => d.present) },

      ],
      formatter: (v) => Math.round(v), height: 260
    });

    view.querySelector('#rpPrint').onclick = () => window.print();
    view.querySelector('#rpExport').onclick = () => toast('Rapport exporté en PDF (simulé)', 'ok');

  ERP.Router.add('/rapports', { title: 'Rapports', sub: 'Indicateurs de pilotage', render });

<script>
/* ===== js/users.js =====
   BâtiPilot — Module ENTREPRISES (admin uniquement)
   Un ingénieur = une entreprise : lui-même, ses assistants et toutes ses
   données (chantiers, clients, ouvriers...). L'admin approuve/active les
   comptes, gère les assistants de chaque entreprise et peut amorcer une
   entreprise vide avec des données de démonstration.
   Les policies RLS empêchent un non-admin d'atteindre ces données même en
   forçant l'URL — ce module est une commodité UI, pas la barrière de sécurité. */
window.ERP = window.ERP || {};

(function (ERP) {
  'use strict';
  const { icon, on, esc, toast, confirm, badge } = ERP.UI;

  async function renderList(params, view) {
    if (!ERP.DB.user || ERP.DB.user.role !== 'admin') {
      view.innerHTML = ERP.UI.empty('Accès réservé', 'Cette page est réservée aux administrateurs.');
      return;
    }

    view.innerHTML = `
      <div class="toolbar">
        <span class="spacer"></span>
        <button class="btn btn--accent" id="usInvite">${icon('plus', 20)} Inviter un ingénieur</button>
      </div>
      <section class="card">
        <div class="card__head"><h3>Entreprises</h3><span class="spacer"></span><span class="tag" id="usCount"></span></div>
        <div class="card__body card__body--flush"><div class="table-wrap">
          <table class="tbl"><thead><tr>
            <th>Ingénieur</th><th>E-mail</th><th>Statut</th><th>Assistants</th><th class="t-right">Actions</th>
          </tr></thead><tbody id="usRows"></tbody></table>
        </div></div>
      </section>
      <section class="card" style="margin-top:16px">
        <div class="card__head"><h3>Administrateurs</h3></div>
        <div class="card__body card__body--flush"><div class="table-wrap">
          <table class="tbl"><thead><tr><th>Nom</th><th>E-mail</th><th>Statut</th></tr></thead><tbody id="usAdminRows"></tbody></table>
        </div></div>
      </section>`;

    let allUsers = [];
    async function refresh() {
      allUsers = await ERP.Api.admin.users.list();
      const companies = allUsers.filter(u => u.role === 'ingenieur');
      const admins = allUsers.filter(u => u.role === 'admin');
      const assistantsByCompany = {};
      allUsers.filter(u => u.role === 'assistant').forEach(a => {
        (assistantsByCompany[a.companyId] = assistantsByCompany[a.companyId] || []).push(a);
      });

      view.querySelector('#usCount').textContent = companies.length + ' entreprise' + (companies.length > 1 ? 's' : '');
      const tb = view.querySelector('#usRows');
      tb.innerHTML = companies.length ? companies.map(u => {
        const n = (assistantsByCompany[u.id] || []).length;
        return `
        <tr data-id="${u.id}">
          <td><div class="idcell">
              <span class="avatar avatar--soft">${esc((u.fullName || u.email || '?').slice(0, 2).toUpperCase())}</span>
              <span class="idcell__txt"><div class="cell-main">${esc(u.fullName || '—')}</div></span>
            </div></td>
          <td class="small">${esc(u.email)}</td>
          <td>${badge('userActive', u.active ? 'actif' : 'inactif')}</td>
          <td class="small">${n ? n + ' assistant' + (n > 1 ? 's' : '') : '—'}</td>
          <td class="t-right">
            <button class="btn btn--sm" data-assistants>${icon('users', 16)} Assistants</button>
            <button class="btn btn--sm" data-seed>${icon('download', 16)} Données démo</button>
            <button class="btn btn--sm" data-toggle>${u.active ? 'Désactiver' : 'Activer'}</button>
          </td>
        </tr>`;
      }).join('') : `<tr><td colspan="5">${ERP.UI.empty('Aucune entreprise', 'Invitez un ingénieur pour commencer.')}</td></tr>`;

      const atb = view.querySelector('#usAdminRows');
      atb.innerHTML = admins.length ? admins.map(u => `
        <tr><td>${esc(u.fullName || '—')}</td><td class="small">${esc(u.email)}</td><td>${badge('userActive', u.active ? 'actif' : 'inactif')}</td></tr>
      `).join('') : `<tr><td colspan="3" class="small">Aucun autre administrateur.</td></tr>`;
    }

    await refresh();

    view.querySelector('#usInvite').onclick = () => openInvite(refresh);

    on(view, 'click', '[data-assistants]', (e, t) => {
      const u = allUsers.find(x => x.id === t.closest('tr').dataset.id);
      openAssistants(u, allUsers.filter(x => x.role === 'assistant' && x.companyId === u.id), refresh);
    });

    on(view, 'click', '[data-seed]', async (e, t) => {
      const u = allUsers.find(x => x.id === t.closest('tr').dataset.id);
      const ok = await confirm({
        title: 'Charger les données de démonstration ?',
        confirmLabel: 'Charger',
        text: `Crée des chantiers, clients, ouvriers et articles d'exemple pour ${esc(u.fullName || u.email)}. Uniquement possible si l'entreprise est encore vide.`
      });
      if (!ok) return;
      try {
        await ERP.Api.admin.users.seedDemo(u.id);
        toast('Données de démonstration chargées', 'ok');
      } catch (err) {
        const msg = /company_already_has_data/.test(err.message || '')
          ? 'Cette entreprise a déjà des données — le chargement de démo est réservé aux entreprises vides.'
          : 'Erreur : ' + (err.message || err);
        toast(msg, 'danger');
      }
    });

    on(view, 'click', '[data-toggle]', async (e, t) => {
      const u = allUsers.find(x => x.id === t.closest('tr').dataset.id);
      const ok = await confirm({
        title: u.active ? 'Désactiver ce compte ?' : 'Activer ce compte ?',
        confirmLabel: u.active ? 'Désactiver' : 'Activer',
        danger: u.active,
        text: u.active
          ? 'L\'utilisateur ne pourra plus se connecter tant que le compte n\'est pas réactivé.'
          : 'L\'utilisateur pourra de nouveau se connecter.'
      });
      if (!ok) return;
      await ERP.Api.admin.users.update(u.id, { active: !u.active });
      toast(u.active ? 'Compte désactivé' : 'Compte activé', 'ok');
      refresh();
    });
  }

  /* ---------- Inviter un ingénieur ---------- */
  function openInvite(done) {
    const m = ERP.UI.modal({
      title: 'Inviter un ingénieur',
      sub: 'Un e-mail avec un lien de création de mot de passe lui sera envoyé',
      body: `<div class="form-grid">
          <div class="field field--full"><label for="us-name">Nom complet</label><input id="us-name" placeholder="Ex. : Amine Rebaya"></div>
          <div class="field field--full"><label for="us-email">E-mail</label><input id="us-email" type="email" placeholder="prenom.nom@entreprise.tn"></div>
        </div>`,
      footer: `<button class="btn" data-cancel>Annuler</button>
               <button class="btn btn--primary" data-save>${icon('save', 18)} Envoyer l'invitation</button>`
    });
    m.foot.querySelector('[data-cancel]').onclick = m.close;
    m.foot.querySelector('[data-save]').onclick = async () => {
      const email = m.body.querySelector('#us-email').value.trim();
      const fullName = m.body.querySelector('#us-name').value.trim();
      if (!email) { toast('L\'e-mail est obligatoire', 'danger'); return; }
      try {
        await ERP.Api.admin.users.invite({ email, fullName });
        toast('Invitation envoyée à ' + email, 'ok');
        m.close();
        if (done) done();
      } catch (err) {
        toast('Erreur : ' + (err.message || err), 'danger');
      }
    };
  }

  /* ---------- Assistants d'une entreprise ---------- */
  function openAssistants(company, assistants, done) {
    const m = ERP.UI.modal({
      title: 'Assistants',
      sub: esc(company.fullName || company.email),
      body: `<div class="form-grid">
          <div class="field field--full"><label for="us-as-name">Nom complet</label><input id="us-as-name" placeholder="Ex. : Sarra Bel Haj"></div>
          <div class="field field--full"><label for="us-as-email">E-mail</label><input id="us-as-email" type="email" placeholder="prenom.nom@entreprise.tn"></div>
          <div class="field field--full"><button class="btn btn--sm" id="us-as-add">${icon('plus', 16)} Ajouter un assistant</button></div>
          <div class="field field--full">
            <div class="table-wrap"><table class="tbl"><thead><tr><th>Nom</th><th>E-mail</th><th>Statut</th><th class="t-right">Actions</th></tr></thead>
              <tbody id="us-as-rows">${assistants.map(a => `
                <tr data-id="${a.id}">
                  <td>${esc(a.fullName || '—')}</td>
                  <td class="small">${esc(a.email)}</td>
                  <td>${badge('userActive', a.active ? 'actif' : 'inactif')}</td>
                  <td class="t-right"><button class="btn btn--sm" data-as-toggle>${a.active ? 'Désactiver' : 'Activer'}</button></td>
                </tr>`).join('') || `<tr><td colspan="4" class="small">Aucun assistant.</td></tr>`}</tbody>
            </table></div>
          </div>
        </div>`,
      footer: `<button class="btn" data-cancel>Fermer</button>`
    });
    m.foot.querySelector('[data-cancel]').onclick = m.close;
    m.body.querySelector('#us-as-add').onclick = async () => {
      const email = m.body.querySelector('#us-as-email').value.trim();
      const fullName = m.body.querySelector('#us-as-name').value.trim();
      if (!email) { toast('L\'e-mail est obligatoire', 'danger'); return; }
      try {
        await ERP.Api.admin.users.invite({ email, fullName, role: 'assistant', companyId: company.id });
        toast('Invitation envoyée à ' + email, 'ok');
        m.close();
        if (done) done();
      } catch (err) {
        toast('Erreur : ' + (err.message || err), 'danger');
      }
    };
    on(m.body, 'click', '[data-as-toggle]', async (e, t) => {
      const id = t.closest('tr').dataset.id;
      const a = assistants.find(x => x.id === id);
      await ERP.Api.admin.users.update(a.id, { active: !a.active });
      toast(a.active ? 'Compte désactivé' : 'Compte activé', 'ok');
      m.close();
      if (done) done();
    });
  }

  ERP.Router.add('/utilisateurs', { title: 'Entreprises', sub: 'Ingénieurs, assistants et accès', render: renderList });
})(window.ERP);

</script>
<script>
/* ===== js/my-assistants.js =====
   BâtiPilot — Module MES ASSISTANTS (ingénieur uniquement)
   Un assistant appartient à l'entreprise de l'ingénieur qui l'invite : il a
   un accès en lecture à tout et peut gérer les ouvriers (Pointage). Ce
   module permet à l'ingénieur d'inviter, voir et désactiver ses assistants. */
window.ERP = window.ERP || {};

(function (ERP) {
  'use strict';
  const { icon, on, esc, toast, confirm, badge } = ERP.UI;

  async function render(params, view) {
    if (!ERP.DB.user || ERP.DB.user.role !== 'ingenieur') {
      view.innerHTML = ERP.UI.empty('Accès réservé', 'Cette page est réservée aux ingénieurs.');
      return;
    }

    view.innerHTML = `
      <div class="toolbar">
        <span class="spacer"></span>
        <button class="btn btn--accent" id="asInvite">${icon('plus', 20)} Inviter un assistant</button>
      </div>
      <section class="card">
        <div class="card__head"><h3>Mes assistants</h3><span class="spacer"></span><span class="tag" id="asCount"></span></div>
        <div class="card__body card__body--flush"><div class="table-wrap">
          <table class="tbl"><thead><tr>
            <th>Nom</th><th>E-mail</th><th>Statut</th><th class="t-right">Actions</th>
          </tr></thead><tbody id="asRows"></tbody></table>
        </div></div>
      </section>`;

    async function refresh() {
      const assistants = await ERP.Api.assistants.list();
      view.querySelector('#asCount').textContent = assistants.length + ' assistant' + (assistants.length > 1 ? 's' : '');
      const tb = view.querySelector('#asRows');
      tb.innerHTML = assistants.length ? assistants.map(a => `
        <tr data-id="${a.id}">
          <td><div class="idcell">
              <span class="avatar avatar--soft">${esc((a.fullName || a.email || '?').slice(0, 2).toUpperCase())}</span>
              <span class="idcell__txt"><div class="cell-main">${esc(a.fullName || '—')}</div></span>
            </div></td>
          <td class="small">${esc(a.email)}</td>
          <td>${badge('userActive', a.active ? 'actif' : 'inactif')}</td>
          <td class="t-right"><button class="btn btn--sm" data-toggle>${a.active ? 'Désactiver' : 'Activer'}</button></td>
        </tr>`).join('') : `<tr><td colspan="4">${ERP.UI.empty('Aucun assistant', 'Invitez un assistant pour vous aider sur le terrain.')}</td></tr>`;
    }

    await refresh();

    view.querySelector('#asInvite').onclick = () => openInvite(refresh);

    on(view, 'click', '[data-toggle]', async (e, t) => {
      const id = t.closest('tr').dataset.id;
      const assistants = await ERP.Api.assistants.list();
      const a = assistants.find(x => x.id === id);
      const ok = await confirm({
        title: a.active ? 'Désactiver cet assistant ?' : 'Activer cet assistant ?',
        confirmLabel: a.active ? 'Désactiver' : 'Activer',
        danger: a.active,
        text: a.active
          ? 'L\'assistant ne pourra plus se connecter tant que le compte n\'est pas réactivé.'
          : 'L\'assistant pourra de nouveau se connecter.'
      });
      if (!ok) return;
      await ERP.Api.assistants.update(a.id, { active: !a.active });
      toast(a.active ? 'Assistant désactivé' : 'Assistant activé', 'ok');
      refresh();
    });
  }

  function openInvite(done) {
    const m = ERP.UI.modal({
      title: 'Inviter un assistant',
      sub: 'Un e-mail avec un lien de création de mot de passe lui sera envoyé',
      body: `<div class="form-grid">
          <div class="field field--full"><label for="as-name">Nom complet</label><input id="as-name" placeholder="Ex. : Sarra Bel Haj"></div>
          <div class="field field--full"><label for="as-email">E-mail</label><input id="as-email" type="email" placeholder="prenom.nom@entreprise.tn"></div>
        </div>`,
      footer: `<button class="btn" data-cancel>Annuler</button>
               <button class="btn btn--primary" data-save>${icon('save', 18)} Envoyer l'invitation</button>`
    });
    m.foot.querySelector('[data-cancel]').onclick = m.close;
    m.foot.querySelector('[data-save]').onclick = async () => {
      const email = m.body.querySelector('#as-email').value.trim();
      const fullName = m.body.querySelector('#as-name').value.trim();
      if (!email) { toast('L\'e-mail est obligatoire', 'danger'); return; }
      try {
        await ERP.Api.assistants.invite({ email, fullName });
        toast('Invitation envoyée à ' + email, 'ok');
        m.close();
        if (done) done();
      } catch (err) {
        toast('Erreur : ' + (err.message || err), 'danger');
      }
    };
  }

  ERP.Router.add('/assistants', { title: 'Mes assistants', sub: 'Aides invités sur votre entreprise', render: render });
})(window.ERP);

</script>
<script>
/* ===== js/settings.js ===== */
/* =========================================================
   BâtiPilot — Module PARAMÈTRES & PROFIL
   ========================================================= */
window.ERP = window.ERP || {};

(function (ERP) {
  'use strict';
  const { icon, fmt, on, esc, toast, confirm } = ERP.UI;

  const prefs = {
    language: 'fr', currency: 'DT', dayHours: 8, budgetAlert: 80,
    notifyLate: true, notifyStock: true, notifyAbsence: true
  };

  async function renderSettings(params, view) {
    const u = ERP.DB.user;
    view.innerHTML = `

              <h3 style="margin:22px 0 10px;font-size:16px">Notifications</h3>

                <div class="prop"><dt>Compte</dt><dd style="font-size:14px">${esc(u.email)}</dd></div>

                dans le navigateur.

    view.querySelector('#pSave').onclick = async () => {
      const name = view.querySelector('#p-name').value.trim();

})(window.ERP);

<script>
/* ===== js/auth.js =====
   Authentification Supabase. La clé « anon » ci-dessous est publique par
   conception (protégée côté serveur par les policies RLS) — voir
   supabase/schema.sql. Le rôle (admin/ingénieur) est déterminé par la
   ligne `profiles` de l'utilisateur, jamais par le client. */
window.ERP = window.ERP || {};

(function (ERP) {
  'use strict';

  var SUPABASE_URL = 'https://aqfximfpjaiiitlqwmti.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_K8fKVgp7Ss_a9VpZo8612Q_BPRrhO_t';
  var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function signIn(email, password) {
    var res = await client.auth.signInWithPassword({ email: email, password: password });
    if (res.error) throw res.error;
    return res.data.session;
  }

  async function signOut() {
    await client.auth.signOut();
  }

  async function getSession() {
    var res = await client.auth.getSession();
    return res.data.session || null;
  }

  // Explicit, on-demand refresh — used by the API layer to recover from a
  // single 401 (e.g. the access token expired while the tab was
  // backgrounded and the SDK's own background timer hadn't caught up yet)
  // without waiting for the next automatic refresh cycle.
  async function refreshSession() {
    var res = await client.auth.refreshSession();
    if (res.error) throw res.error;
    return res.data.session;
  }

  async function fetchProfile(userId) {
    var res = await client.from('profiles').select('*').eq('id', userId).single();
    if (res.error) throw res.error;
    return res.data;
  }

  function onAuthStateChange(cb) {
    client.auth.onAuthStateChange(cb);
  }

  /* Inscription — passe par notre API (pas client.auth.signUp direct) car
     la validation du domaine @batipilot.tn doit être faite côté serveur :
     un formulaire côté client ne suffit pas à empêcher un autre domaine. */
  async function signUp(email, password, fullName) {
    var res = await fetch('/api/v1/auth/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password, fullName: fullName })
    });
    var body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.message || body.error || 'Inscription impossible');
    return body;
  }

  ERP.Auth = { client: client, signIn: signIn, signUp: signUp, signOut: signOut, getSession: getSession, refreshSession: refreshSession, fetchProfile: fetchProfile, onAuthStateChange: onAuthStateChange };
})(window.ERP);

</script>
<script>
/* ===== js/app.js ===== */
/* =========================================================
   BâtiPilot — Amorçage de l'application
   ========================================================= */
window.ERP = window.ERP || {};

(function (ERP) {
  'use strict';
  const { icon, fmt, on, esc, toast, confirm, popover, closePopover } = ERP.UI;

  /* ---------- Structure du menu ---------- */
  // L'admin supervise et approuve les comptes — il n'a aucune relation à un
  // chantier en particulier, donc aucun des modules opérationnels ci-dessous
  // ne lui est présenté. Utilisateurs (+ ses propres Paramètres) est tout
  // ce qu'affiche son menu.
  // Trois rôles : admin (Utilisateurs uniquement), ingénieur (tout, +
  // gestion de ses assistants), assistant (lecture seule partout sauf
  // Ouvriers — CRUD complet dans Pointage — imposé côté API/RLS, ces
  // roles: ne sont qu'un raccourci de navigation).
  const OPERATIONAL_ROLES = ['ingenieur', 'assistant'];
  const NAV = [
    {
      group: 'Pilotage', items: [
        { href: '/dashboard', icon: 'home', label: 'Tableau de bord', roles: OPERATIONAL_ROLES },
        { href: '/projets', icon: 'building', label: 'Projets', roles: OPERATIONAL_ROLES, pill: () => ERP.DB.projects.filter(p => p.status === 'en_retard').length },
        { href: '/planning', icon: 'calendar', label: 'Planning', roles: OPERATIONAL_ROLES },
        { href: '/taches', icon: 'checkSquare', label: 'Tâches', roles: OPERATIONAL_ROLES, pill: () => ERP.DB.tasks.filter(t => t.status !== 'termine' && t.due < ERP.DB.today).length }
      ]
    },
    {
      group: 'Terrain', items: [
        { href: '/pointage', icon: 'hardhat', label: 'Pointage', roles: OPERATIONAL_ROLES },
        { href: '/articles', icon: 'package', label: 'Articles', roles: OPERATIONAL_ROLES, pill: () => ERP.DB.articles.filter(a => a.stockStatus !== 'ok').length, muted: true },
        { href: '/fournisseurs', icon: 'truck', label: 'Fournisseurs', roles: OPERATIONAL_ROLES }
      ]
    },
    {
      group: 'Gestion', items: [
        { href: '/clients', icon: 'users', label: 'Clients', roles: OPERATIONAL_ROLES },
        { href: '/budgets', icon: 'wallet', label: 'Budgets & coûts', roles: ['ingenieur'] },
        { href: '/rapports', icon: 'chart', label: 'Rapports', roles: ['ingenieur'] }
      ]
    },
    {
      group: 'Système', items: [
        { href: '/utilisateurs', icon: 'user', label: 'Entreprises', roles: ['admin'] },
        { href: '/assistants', icon: 'users', label: 'Mes assistants', roles: ['ingenieur'] },
        { href: '/parametres', icon: 'settings', label: 'Paramètres' }
      ]
    }
  ];

  const app = document.getElementById('app');
  const nav = document.getElementById('mainNav');

  function buildNav() {
    const role = (ERP.DB.user && ERP.DB.user.role) || 'ingenieur';
    nav.innerHTML = NAV.map(sec => {
      const items = sec.items.filter(it => !it.roles || it.roles.includes(role));
      if (!items.length) return '';
      return `
      <div class="nav__group">${sec.group}</div>
      ${items.map(it => {
        const n = it.pill ? it.pill() : 0;
        return `<button class="nav__item" data-href="${it.href}" type="button" title="${it.label}">
          ${icon(it.icon, 21)}
          <span class="nav__label">${it.label}</span>
          ${n ? `<span class="nav__pill ${it.muted ? 'nav__pill--muted' : ''} num">${n}</span>` : ''}
        </button>`;
      }).join('')}`;
    }).join('');
  }

  function markActive(path) {
    const root = '/' + path.split('/')[1];
    nav.querySelectorAll('.nav__item').forEach(b => {
      b.classList.toggle('is-active', b.dataset.href === root);
    });
  }

  /* ---------- En-tête ---------- */
  function refreshHeader() {
    const u = ERP.DB.user;
    const chip = document.getElementById('btnUser');
    chip.querySelector('.avatar').textContent = u.initials;
    chip.querySelector('strong').textContent = u.name;
    chip.querySelector('small').textContent = u.role;
    document.getElementById('notifCount').textContent = ERP.DB.notifications.filter(n => !n.read).length;
    document.getElementById('notifCount').style.display =
      ERP.DB.notifications.some(n => !n.read) ? '' : 'none';
  }

  function setTitle(def, params) {
    document.getElementById('pageTitle').textContent = def.title;
    document.getElementById('pageSub').textContent = def.sub || '';
  }

  /* ---------- Notifications ---------- */
  function openNotifications(anchor) {
    const list = ERP.DB.notifications;
    const p = popover(anchor, `
      <div class="popover__head">
        <strong style="font-size:16px;flex:1">Notifications</strong>
        <button class="btn btn--sm btn--ghost" data-readall>Tout marquer lu</button>
      </div>
      <div class="popover__list">
        ${list.map(n => `
          <button class="notif notif--${n.level} ${n.read ? 'is-read' : ''}" data-link="${n.link}" data-id="${n.id}">
            <span class="notif__ico ${n.level === 'danger' ? 'kpi__ico--danger' : n.level === 'warn' ? 'kpi__ico--warn' : 'kpi__ico--ok'}">
              ${icon(n.level === 'info' ? 'info' : 'alert', 18)}</span>
            <span class="notif__body"><strong>${esc(n.title)}</strong><small>${esc(n.text)} · ${n.time}</small></span>
          </button>`).join('')}
      </div>
      <div class="popover__foot"><a class="btn btn--sm btn--block" href="#/rapports">Ouvrir le journal complet</a></div>`);

    p.querySelector('[data-readall]').onclick = async () => {
      await ERP.Api.notifications.markAllRead();
      refreshHeader(); closePopover(); toast('Notifications marquées comme lues', 'ok');
    };
    on(p, 'click', '[data-link]', async (e, t) => {
      await ERP.Api.notifications.markRead(t.dataset.id);
      refreshHeader(); closePopover();
      // Company-wide notifications (stock/attendance alerts) legitimately
      // have no target — only navigate when there actually is one.
      if (t.dataset.link) ERP.Router.go(t.dataset.link.replace(/^#/, ''));
    });
  }

  /* ---------- Menu utilisateur ---------- */
  function openUserMenu(anchor) {
    const u = ERP.DB.user;
    const p = popover(anchor, `
      <div class="popover__head">
        <span class="avatar avatar--lg">${u.initials}</span>
        <div style="min-width:0"><strong style="display:block">${esc(u.name)}</strong>
          <small class="muted">${esc(u.email)}</small></div>
      </div>
      <div>
        <button class="menu-item" data-go="/profil">${icon('user', 20)} Mon profil</button>
        <button class="menu-item" data-go="/parametres">${icon('settings', 20)} Préférences</button>
        <button class="menu-item" data-logout>${icon('logout', 20)} Déconnexion</button>
      </div>`, { width: 300 });

    on(p, 'click', '[data-go]', (e, t) => { closePopover(); ERP.Router.go(t.dataset.go); });
    p.querySelector('[data-logout]').onclick = async () => {
      closePopover();
      const ok = await confirm({
        title: 'Se déconnecter ?', confirmLabel: 'Déconnexion', icon: 'logout',
        text: 'Vous devrez vous reconnecter pour accéder à BâtiPilot.'
      });
      if (ok) { await ERP.Auth.signOut(); location.reload(); }
    };
  }

  /* ---------- Recherche globale ---------- */
  function setupSearch() {
    const input = document.getElementById('globalSearch');
    const box = document.getElementById('omnibox');

    const run = ERP.UI.debounce(async () => {
      const q = input.value.trim();
      if (q.length < 2) { box.hidden = true; return; }
      const res = await ERP.Api.search(q);
      if (!res.length) {
        box.innerHTML = `<div class="empty" style="padding:28px"><p>Aucun résultat pour « ${esc(q)} »</p></div>`;
        box.hidden = false; return;
      }
      let html = '', last = '';
      res.forEach(r => {
        if (r.group !== last) { html += `<div class="omnibox__group">${r.group}</div>`; last = r.group; }
        html += `<button class="omnibox__item" data-href="${r.href}">
            <span class="list-row__ico">${icon(r.icon, 18)}</span>
            <span style="min-width:0"><strong>${esc(r.label)}</strong><small>${esc(r.sub)}</small></span>
          </button>`;
      });
      box.innerHTML = html;
      box.hidden = false;
    }, 200);

    input.addEventListener('input', run);
    input.addEventListener('focus', () => { if (input.value.trim().length >= 2) run(); });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { box.hidden = true; input.blur(); }
      if (e.key === 'Enter') { const f = box.querySelector('.omnibox__item'); if (f) f.click(); }
    });
    on(box, 'click', '[data-href]', (e, t) => {
      box.hidden = true; input.value = '';
      ERP.Router.go(t.dataset.href.replace(/^#/, ''));
    });
    document.addEventListener('pointerdown', (e) => {
      if (!box.contains(e.target) && e.target !== input) box.hidden = true;
    });
  }

  /* ---------- Menu latéral ---------- */
  function setupSidebar() {
    const scrim = document.getElementById('sidebarScrim');
    const closeDrawer = () => { app.classList.remove('is-drawer-open'); scrim.hidden = true; };

    const collapseBtn = document.getElementById('btnCollapse');
    collapseBtn.innerHTML = icon('chevronsLeft', 20);
    document.getElementById('btnBurger').innerHTML = icon('menu', 24);
    document.getElementById('searchIcon').innerHTML = icon('search', 19);
    const notifBtn = document.getElementById('btnNotif');
    if (!notifBtn.querySelector('svg')) notifBtn.insertAdjacentHTML('afterbegin', icon('bell', 22));

    collapseBtn.onclick = () => {
      const collapsed = app.classList.toggle('is-collapsed');
      collapseBtn.innerHTML = icon(collapsed ? 'chevronRight' : 'chevronsLeft', 20);
      collapseBtn.setAttribute('aria-label', collapsed ? 'Agrandir le menu' : 'Réduire le menu');
    };
    document.getElementById('btnBurger').onclick = () => {
      app.classList.add('is-drawer-open'); scrim.hidden = false;
    };
    scrim.onclick = closeDrawer;

    on(nav, 'click', '.nav__item', (e, t) => {
      ERP.Router.go(t.dataset.href);
      closeDrawer();
    });
  }

  /* ---------- Connexion ---------- */
  function showLogin(message, okMessage) {
    document.getElementById('app').hidden = true;
    document.getElementById('authScreen').hidden = false;
    document.getElementById('authForm').hidden = false;
    document.getElementById('signupForm').hidden = true;
    document.getElementById('authIntro').textContent = 'Connexion à votre espace';
    document.getElementById('authToggle').textContent = 'Créer un compte ingénieur';
    const err = document.getElementById('authError');
    if (message) { err.textContent = message; err.hidden = false; } else { err.hidden = true; }
    const ok = document.getElementById('authOk');
    if (okMessage) { ok.textContent = okMessage; ok.hidden = false; } else { ok.hidden = true; }
  }

  function wireAuthForm() {
    document.querySelectorAll('[data-pwd-for]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.pwdFor);
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.classList.toggle('is-visible', show);
        btn.setAttribute('aria-pressed', String(show));
        btn.setAttribute('aria-label', show ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
      });
    });

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;
      const btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true;
      try {
        const session = await ERP.Auth.signIn(email, password);
        await enterApp(session);
      } catch (err) {
        showLogin(err.message === 'Invalid login credentials'
          ? 'E-mail ou mot de passe incorrect.'
          : 'Connexion impossible : ' + err.message);
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('authToggle').addEventListener('click', () => {
      const showingSignup = !document.getElementById('signupForm').hidden;
      document.getElementById('authForm').hidden = !showingSignup;
      document.getElementById('signupForm').hidden = showingSignup;
      document.getElementById('authIntro').textContent = showingSignup ? 'Connexion à votre espace' : 'Créer un compte ingénieur';
      document.getElementById('authToggle').textContent = showingSignup ? 'Créer un compte ingénieur' : 'J\'ai déjà un compte';
      document.getElementById('authError').hidden = true;
      document.getElementById('authOk').hidden = true;
    });

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fullName = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const btn = e.target.querySelector('button[type=submit]');
      const err = document.getElementById('signupError');
      btn.disabled = true;
      err.hidden = true;
      try {
        const res = await ERP.Auth.signUp(email, password, fullName);
        e.target.reset();
        showLogin(null, res.message || 'Compte créé. Un administrateur doit approuver votre accès.');
      } catch (ex) {
        err.textContent = ex.message;
        err.hidden = false;
      } finally {
        btn.disabled = false;
      }
    });
  }

  /* ---------- Entrée dans l'application (après connexion) ---------- */
  async function enterApp(session) {
    ERP.Api.config.token = session.access_token;

    // fetchProfile() can fail for reasons that have nothing to do with
    // approval — a network blip, a cold RLS/connection hiccup right after
    // sign-in. Only a genuinely fetched profile with active:false means
    // "not approved" (the self-select policy lets a user read their own
    // row regardless of active). Any other failure gets one retry before
    // giving up, and never signs the user out on its own — a real invalid
    // session is reported by Supabase itself via the SIGNED_OUT event.
    let profile;
    try {
      profile = await ERP.Auth.fetchProfile(session.user.id);
    } catch (err) {
      console.warn('[auth] fetchProfile failed, retrying once…', err);
      await new Promise((r) => setTimeout(r, 800));
      try {
        profile = await ERP.Auth.fetchProfile(session.user.id);
      } catch (err2) {
        console.warn('[auth] fetchProfile retry also failed — treating as transient, not signing out', err2);
        showLogin('Connexion au serveur impossible pour le moment. Réessayez.');
        return;
      }
    }

    if (!profile.active) {
      console.warn('[auth] profile.active is false — signing out');
      await ERP.Auth.signOut();
      showLogin('Votre compte n\'est pas encore approuvé par un administrateur.');
      return;
    }

    const displayName = (profile && profile.full_name) || session.user.email;
    ERP.DB.user = {
      id: session.user.id,
      name: displayName,
      firstName: displayName.split(' ')[0],
      initials: (profile && profile.initials) || (session.user.email || '?').slice(0, 2).toUpperCase(),
      role: (profile && profile.role) || 'ingenieur',
      email: session.user.email,
      phone: (profile && profile.phone) || '',
      agency: (profile && profile.agency) || '',
      since: (profile && profile.since) || ''
    };

    // Remplace le jeu de démo statique (data.js) par les vraies données,
    // scopées par la RLS selon le rôle. Plusieurs modules (Pointage,
    // Articles, Fournisseurs, création de projet…) lisent encore ERP.DB.X
    // en synchrone pour leurs listes déroulantes au lieu de repasser par
    // ERP.Api à chaque rendu — recharger ici au moins au login évite qu'ils
    // affichent en permanence les 20 clients / 50 ouvriers de démonstration
    // au lieu des vraies données Supabase. (Une création faite en cours de
    // session n'apparaîtra dans ces listes qu'après la prochaine connexion —
    // limite connue, pas un blocage pour l'usage courant.)
    try {
      ERP.DB.projects = await ERP.Api.projects.list();
      ERP.DB.tasks = await ERP.Api.tasks.list();
      ERP.DB.articles = await ERP.Api.articles.list();
      ERP.DB.notifications = await ERP.Api.notifications.list();
      ERP.DB.clients = await ERP.Api.clients.list();
      ERP.DB.workers = await ERP.Api.workers.list();
      ERP.DB.suppliers = await ERP.Api.suppliers.list();
    } catch (_) { /* les badges/listes resteront sur les données de démo si l'API est indisponible */ }

    document.getElementById('authScreen').hidden = true;
    document.getElementById('app').hidden = false;

    // Un assistant est en lecture seule partout sauf sur les ouvriers
    // (Pointage) — la RLS l'impose côté serveur ; cette classe masque juste
    // les boutons de création/édition/suppression correspondants côté UI.
    document.body.classList.toggle('role-assistant', ERP.DB.user.role === 'assistant');

    buildNav();
    setupSidebar();
    setupSearch();
    refreshHeader();

    document.getElementById('btnNotif').onclick = (e) => openNotifications(e.currentTarget);
    document.getElementById('btnUser').onclick = (e) => openUserMenu(e.currentTarget);
    document.getElementById('btnUser').querySelector('.userchip__caret').innerHTML = icon('chevronDown', 16);

    // Raccourci clavier : « / » place le curseur dans la recherche
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
        e.preventDefault(); document.getElementById('globalSearch').focus();
      }
    });

    ERP.Router.start((cur) => {
      markActive(cur.path);
      setTitle(cur.route.def, cur.params);
      buildNav();
      markActive(cur.path);
      refreshHeader();
      ERP.UI.closePopover();
    });

    console.info('%cBâtiPilot', 'font:600 16px Barlow Semi Condensed;color:#E4651A',
      '— connecté en tant que ' + ERP.DB.user.name + ' (' + ERP.DB.user.role + ')');
  }

  /* ---------- Démarrage ---------- */
  function boot() {
    wireAuthForm();

    // Chaque déconnexion gère elle-même sa transition d'écran (voir
    // openUserMenu et le contrôle de compte non approuvé dans enterApp) —
    // pas de rechargement automatique ici, qui écraserait un message affiché.
    // SIGNED_OUT est le SEUL événement qui renvoie vers l'écran de
    // connexion depuis ici : c'est Supabase lui-même qui déclare la
    // session définitivement morte (jeton de rafraîchissement révoqué/
    // expiré), pas une simple requête API en échec (voir js/api.js, qui
    // tente déjà un rafraîchissement silencieux avant d'abandonner).
    ERP.Auth.onAuthStateChange((event, session) => {
      if (event === 'TOKEN_REFRESHED' && session) {
        console.warn('[auth] token silently refreshed');
        ERP.Api.config.token = session.access_token;
      }
      if (event === 'SIGNED_OUT') {
        console.warn('[auth] SIGNED_OUT — session is really gone, returning to login');
        ERP.DB.user = null;
        showLogin();
      }
    });

    // Un onglet remis au premier plan après une longue mise en veille peut
    // avoir manqué le cycle de rafraîchissement automatique du SDK (les
    // timers sont limités/suspendus en arrière-plan par le navigateur).
    // On resynchronise juste le jeton ici — jamais de re-rendu, de
    // navigation ni de déconnexion : la prochaine requête API a de toute
    // façon son propre repli si ce n'est pas suffisant.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible' || !ERP.DB.user) return;
      ERP.Auth.getSession()
        .then((session) => { if (session) ERP.Api.config.token = session.access_token; })
        .catch((err) => console.warn('[auth] visibility token sync failed (ignored)', err));
    });

    function tryEnter(session, retriedOnNull) {
      if (session) { enterApp(session); return; }
      if (!retriedOnNull) {
        // getSession() can briefly return nothing while the SDK is still
        // restoring a persisted session from storage on first load — one
        // short re-check avoids flashing the login screen for that.
        setTimeout(() => ERP.Auth.getSession().then((s) => tryEnter(s, true)), 300);
        return;
      }
      showLogin();
    }

    ERP.Auth.getSession().then((session) => tryEnter(session, false));
  }

  ERP.App = { refreshHeader, buildNav };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, { once: true });
  else boot();
})(window.ERP);

</script>
</body>
</html>
