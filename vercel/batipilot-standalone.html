<script>
/* ===== js/projects.js ===== */
/* =========================================================
   BâtiPilot — Module PROJETS (liste + fiche)
   ========================================================= */
window.ERP = window.ERP || {};
ERP.Components = ERP.Components || {};

(function (ERP) {
  'use strict';
  const { icon, fmt, badge, pbar, progressClass, on, esc, toast, confirm } = ERP.UI;

  const STATUS_MOD = { en_retard: 'project-card--late', en_preparation: 'project-card--prep', termine: 'project-card--done' };

  /* ---------- Carte projet (réutilisée par le tableau de bord) ---------- */

      <div class="project-card__grid">

        ${p.daysLate ? `<div class="row small" style="margin-top:9px;color:var(--danger);font-weight:600">
            ${icon('alert', 15)} Retard de ${p.daysLate} jours — ${esc(p.latePhases.join(', '))}</div>` : ''}
      </div>
    </button>`;
  };

  /* =======================================================
     LISTE
     ======================================================= */
  const FILTERS = [
    ['tous', 'Tous'], ['en_preparation', 'En préparation'], ['en_cours', 'En cours'],
    ['en_retard', 'En retard'], ['termine', 'Terminés']
  ];

  const state = { status: 'tous', q: '', view: 'cards' };

  async function renderList(params, view) {
    const qs = ERP.Router.query();
    if (qs.statut) state.status = qs.statut;

    view.innerHTML = `
      <div class="toolbar">

        </div>
        <div class="segmented" id="prjView">

        </div>
        <button class="btn btn--accent" id="prjAdd">${icon('plus', 20)} Nouveau projet</button>
      </div>
      <div id="prjResults"></div>`;

    const results = view.querySelector('#prjResults');

    async function refresh() {
      const all = await ERP.Api.projects.list({ q: state.q });

          'Modifiez la recherche ou choisissez un autre filtre pour retrouver un chantier.');
        return;
      }

      results.innerHTML = state.view === 'cards'
        ? `<div class="projects-grid">${list.map(ERP.Components.projectCard).join('')}</div>`
        : `<div class="card"><div class="table-wrap"><table class="tbl">
            <thead><tr>
              <th>Projet</th><th>Client</th><th>Localisation</th><th>Période</th>

            <span class="pick__meta">${esc(t.category)} · ${esc(t.assignee)}</span></span>
          <span class="pick__dates">${fmt.date(t.start)} → ${fmt.date(t.end)}<br>
            <b class="num">${ERP.dt.diff(t.start, t.end)} j</b></span>
          <button class="icon-btn icon-btn--sm icon-btn--danger" data-rm="${i}" type="button" aria-label="Retirer">${icon('trash', 17)}</button>
        </div>`).join('');
    }

    /* Le choix d'une tâche cale automatiquement ses dates sur la précédente */
    function suggestDates() {
      const c = catalog.find(x => x.id === q('#pk-task').value);
      if (!c) return;
      const from = picked.length ? ERP.dt.add(picked[picked.length - 1].end, 1) : g('#n-start');
      q('#pk-start').value = from;
      q('#pk-end').value = ERP.dt.add(from, c.defaultDays);
    }
    q('#pk-task').onchange = suggestDates;
    q('#n-start').onchange = () => { if (!picked.length) suggestDates(); };
    suggestDates();

    q('#pk-add').onclick = () => {
      const c = catalog.find(x => x.id === q('#pk-task').value);
      if (!c) { toast('Choisissez une tâche dans le catalogue', 'danger'); return; }
      if (g('#pk-end') < g('#pk-start')) { toast('La date de fin doit suivre la date de début', 'danger'); return; }
      if (picked.some(t => t.name === c.name)) { toast('Cette tâche est déjà retenue', 'warn'); return; }
      const worker = ERP.DB.workers.find(w => w.trade === c.trade);
      picked.push({
        catalogId: c.id, name: c.name, category: c.category,
        start: g('#pk-start'), end: g('#pk-end'),
        assignee: worker ? worker.name : g('#n-manager') || ERP.DB.user.name
      });
      drawPicked();
      suggestDates();
      toast(`${c.name} ajoutée (${picked.length})`, 'ok', 1600);
    };

    on(m.body, 'click', '[data-rm]', (e, b) => {
      picked.splice(+b.dataset.rm, 1); drawPicked();
    });
    drawPicked();

    /* --- Matériaux retenus --- */
    function drawMaterials() {
      const box = q('#mk-list');
      if (!pickedMat.length) {
        box.innerHTML = '<div class="pick__empty">Aucun matériau affecté. Vous pourrez en ajouter à tout moment depuis la fiche du chantier.</div>';
        return;
      }
      const total = pickedMat.reduce((s, x) => s + x.qty * x.price, 0);
      box.innerHTML = pickedMat.map((x, i) => `
        <div class="pick__row">
          <span class="pick__n">${i + 1}</span>
          <span><span class="pick__name">${esc(x.name)}</span>
            <span class="pick__meta">${esc(x.category)} · ${fmt.dec(x.price, 2)} DT / ${x.unit}
              · reste ${fmt.dec(x.stock - x.qty, 0)} ${x.unit} au dépôt</span></span>
          <span class="pick__dates"><b class="num">${fmt.dec(x.qty, 0)} ${x.unit}</b><br>
            <span class="money num">${fmt.money(x.qty * x.price)}</span></span>
          <button class="icon-btn icon-btn--sm icon-btn--danger" data-rmmat="${i}" type="button" aria-label="Retirer">${icon('trash', 17)}</button>
        </div>`).join('') +
        `<div class="pick__row" style="background:var(--surface-2)">
          <span></span><span class="pick__name">Total matériaux</span>
          <span class="pick__dates"><b class="money num" style="color:var(--orange)">${fmt.money(total)}</b></span><span></span>
        </div>`;
    }

    q('#mk-add').onclick = () => {
      const a = articles.find(x => x.id === q('#mk-art').value);
      if (!a) { toast('Choisissez un matériau', 'danger'); return; }
      const n = Math.max(0, +q('#mk-qty').value || 0);
      if (n < 1) { toast('Indiquez une quantité', 'danger'); return; }
      const already = pickedMat.find(x => x.articleId === a.id);
      const engaged = (already ? already.qty : 0) + n;
      if (engaged > a.stock) {
        toast(`Stock insuffisant : ${fmt.dec(a.stock, 0)} ${a.unit} disponibles`, 'danger'); return;
      }
      if (already) already.qty = engaged;
      else pickedMat.push({
        articleId: a.id, name: a.name, category: a.category,
        unit: a.unit, price: a.price, stock: a.stock, qty: n
      });
      drawMaterials();
      toast(`${a.name} : ${engaged} ${a.unit}`, 'ok', 1600);
    };
    on(m.body, 'click', '[data-rmmat]', (e, b) => { pickedMat.splice(+b.dataset.rmmat, 1); drawMaterials(); });
    drawMaterials();

    /* --- Enregistrement --- */
    m.foot.querySelector('[data-cancel]').onclick = m.close;
    m.foot.querySelector('[data-save]').onclick = async () => {
      if (!g('#n-name')) { toast('Le nom du projet est obligatoire', 'danger'); return; }
      if (g('#n-end') <= g('#n-start')) { toast('La fin prévue doit suivre la date de début', 'danger'); return; }
      const budget = +g('#n-budget');
      if (!budget || budget <= 0) { toast('Indiquez un budget prévisionnel', 'danger'); return; }

      const manager = g('#n-manager') || ERP.DB.user.name;
      const p = await ERP.Api.projects.create({
        name: g('#n-name'),
        clientId: g('#n-client'),
        type: g('#n-type') || 'Non précisée',
        city: g('#n-city') || 'Tunis',
        address: g('#n-address') || g('#n-city') || 'Tunis',
        manager,
        start: g('#n-start'),
        end: g('#n-end'),
        budget,
        status: q('#n-status').value,
        tasks: picked.map(t => ({ name: t.name, start: t.start, end: t.end, assignee: t.assignee }))
      });

      // Les matériaux retenus sortent du stock et sont imputés au chantier
      for (const x of pickedMat) {
        try { await ERP.Api.materials.create({ projectId: p.id, articleId: x.articleId, qty: x.qty, note: 'Dotation initiale du chantier' }); }
        catch (err) { toast(`${x.name} : stock devenu insuffisant, affectation ignorée`, 'warn', 4000); }
      }

      m.close();
      const parts = [];
      if (picked.length) parts.push(`${picked.length} tâche${picked.length > 1 ? 's' : ''}`);
      if (pickedMat.length) parts.push(`${pickedMat.length} matériau${pickedMat.length > 1 ? 'x' : ''}`);
      toast(`Projet « ${p.name} » créé${parts.length ? ' avec ' + parts.join(' et ') : ''}`, 'ok', 3200);
      ERP.Router.go('/projets/' + p.id);
    };
  }

  /* =======================================================
     ATTACHEMENTS DU CHANTIER
     Plans, photos et documents. Sur tablette, « Prendre une
     photo » ouvre directement l'appareil photo arrière.
     ======================================================= */
  const KIND_LABEL = { plan: 'Plan', photo: 'Photo', document: 'Document' };

  function fileKind(file) {
    if (file.type && file.type.startsWith('image/')) return 'photo';
    if (/plan|coffrage|masse|coupe/i.test(file.name)) return 'plan';
    return 'document';
  }

  function fileSize(n) {
    return n >= 1048576 ? (n / 1048576).toFixed(1).replace('.', ',') + ' Mo'
      : Math.max(1, Math.round(n / 1024)) + ' Ko';
  }

  async function openAttachments(p, onChange) {
    const m = ERP.UI.modal({
      title: 'Attachements du chantier', sub: esc(p.name), size: 'modal--wide',
      body: `
        <div class="capture-row" style="margin-bottom:16px">
          <button class="btn btn--accent" data-photo type="button">${icon('camera', 20)} Prendre une photo</button>
          <button class="btn btn--primary" data-file type="button">${icon('upload', 20)} Téléverser un fichier</button>
          <span class="spacer"></span>
          <span class="tag" id="att-n">0 pièce</span>
        </div>
        <input type="file" id="att-camera" accept="image/*" capture="environment" hidden>
        <input type="file" id="att-input" multiple hidden>
        <div id="att-body"></div>`,
      footer: `<span class="small muted">Photos et plans restent attachés à ce chantier.</span>
               <span style="flex:1"></span>
               <button class="btn" data-cancel type="button">Fermer</button>`,
      onClose: () => onChange && onChange()
    });

    async function draw() {
      const list = await ERP.Api.attachments.list(p.id);
      m.body.querySelector('#att-n').textContent =
        `${list.length} pièce${list.length > 1 ? 's' : ''}`;
      m.body.querySelector('#att-body').innerHTML = list.length ? `
        <div class="att-grid">${list.map(a => `
          <article class="att" data-att="${a.id}">
            <div class="att__thumb att__thumb--${a.kind}">
              ${a.url ? `<img src="${a.url}" alt="${esc(a.name)}">`
                : icon(a.kind === 'photo' ? 'image' : a.kind === 'plan' ? 'file' : 'file', 34)}
              <span class="att__kind">${KIND_LABEL[a.kind] || 'Pièce'}</span>
            </div>
            <div class="att__body">
              <div class="att__name">${esc(a.name)}</div>
              <div class="att__meta">${fmt.date(a.date)} · ${fileSize(a.size)}<br>${esc(a.author)}</div>
            </div>
            <div class="att__foot">
              <button class="btn btn--sm btn--block" data-open type="button">${icon('eye', 16)} Ouvrir</button>
              <button class="icon-btn icon-btn--sm icon-btn--danger" data-del type="button" aria-label="Supprimer">${icon('trash', 17)}</button>
            </div>
          </article>`).join('')}</div>`
        : ERP.UI.empty('Aucune pièce jointe',
            'Photographiez l\'avancement du chantier ou téléversez les plans et procès-verbaux.');
    }

    async function addFiles(files, forcedKind) {
      for (const f of files) {
        const isImage = f.type && f.type.startsWith('image/');
        const url = isImage ? URL.createObjectURL(f) : null;
        await ERP.Api.attachments.create(p.id, {
          name: f.name || `Photo chantier ${ERP.DB.today} (${(ERP.DB.attachments[p.id] || []).length + 1}).jpg`,
          kind: forcedKind || fileKind(f), size: f.size, url
        });
      }
      await draw();
      onChange && onChange();
      toast(`${files.length} pièce${files.length > 1 ? 's' : ''} attachée${files.length > 1 ? 's' : ''}`, 'ok');
    }

    m.body.querySelector('[data-photo]').onclick = () => m.body.querySelector('#att-camera').click();
    m.body.querySelector('[data-file]').onclick = () => m.body.querySelector('#att-input').click();
    m.body.querySelector('#att-camera').onchange = (e) => {
      if (e.target.files.length) addFiles([...e.target.files], 'photo');
      e.target.value = '';
    };
    m.body.querySelector('#att-input').onchange = (e) => {
      if (e.target.files.length) addFiles([...e.target.files]);
      e.target.value = '';
    };

    on(m.body, 'click', '[data-open]', async (e, b) => {
      const id = b.closest('[data-att]').dataset.att;
      const a = (await ERP.Api.attachments.list(p.id)).find(x => x.id === id);
      if (a.url) window.open(a.url, '_blank');
      else toast('Aperçu indisponible pour cette pièce de démonstration', 'info');
    });
    on(m.body, 'click', '[data-del]', async (e, b) => {
      const id = b.closest('[data-att]').dataset.att;
      const a = (await ERP.Api.attachments.list(p.id)).find(x => x.id === id);
      const ok = await ERP.UI.confirm({
        title: 'Supprimer cette pièce ?', danger: true, confirmLabel: 'Supprimer',
        text: `<b>${esc(a.name)}</b> sera détachée du chantier.`
      });
      if (ok) { await ERP.Api.attachments.remove(p.id, id); await draw(); onChange && onChange(); toast('Pièce supprimée', 'ok'); }
    });
    m.foot.querySelector('[data-cancel]').onclick = m.close;

    await draw();
  }

          <div class="kpi__value num">${p.presentToday}<span>/ ${p.teamSize}</span></div>

              ${workers.slice(0, 6).map(w => `
                <button class="list-row" data-worker="${w.id}">
                  <span class="avatar avatar--soft">${w.name.split(' ').map(s => s[0]).slice(0, 2).join('')}</span>
                  <span class="list-row__txt"><strong>${esc(w.name)}</strong><small>${esc(w.trade)}</small></span>

        const fresh = await ERP.Api.projects.get(p.id);
        const kpi = view.querySelector('#prjTaskKpi');
        if (!kpi) return;
        kpi.querySelector('.kpi__foot').textContent =
          `${fresh.tasksDone}/${fresh.tasksTotal} tâches terminées` +
          (fresh.tasksLate ? ` · ${fresh.tasksLate} en retard` : '');
      }
    });

    ERP.Components.materialRows(view.querySelector('#prjMaterials'), {
      projectId: p.id,
      onChange: async () => {
        // Toute sortie de stock est imputée au budget du chantier
        const fresh = await ERP.Api.projects.get(p.id);
        const kpi = view.querySelector('#prjBudgetKpi');
        if (!kpi) return;
        kpi.querySelector('.kpi__value').innerHTML = `${fresh.burn}<span>%</span>`;
        kpi.querySelector('.kpi__foot').textContent = `${fmt.money(fresh.remaining)} restants`;
        kpi.classList.toggle('kpi--alert', fresh.burn >= 90);
        const cats = await ERP.Api.budget.categories({ projectId: p.id });
        const host = view.querySelector('#prjCats');
        if (host) ERP.Charts.hbars(host, { items: cats, formatter: fmt.moneyShort });
      }
    });

    /* Planning du projet (barres de Gantt) */
    const rows = await ERP.Api.planning.rows({ projectId: p.id });
    const ganttHost = view.querySelector('#prjGantt');
    if (ganttHost) ERP.Gantt.render(ganttHost, rows, { scale: 'mois', compact: true });

    /* Répartition budgétaire du projet */
    const cats = await ERP.Api.budget.categories({ projectId: p.id });
    const catHost = view.querySelector('#prjCats');
    if (catHost) ERP.Charts.hbars(catHost, { items: cats, formatter: fmt.moneyShort });
    if (!ganttHost) return; // l'utilisateur a déjà changé de page

    view.querySelector('[data-back]').onclick = () => history.back();
    view.querySelector('[data-edit]').onclick = () => openEdit(p);
    const delBtn = view.querySelector('[data-del-project]');
    if (delBtn) delBtn.onclick = async () => {
      const ok = await confirm({
        title: 'Supprimer ce projet ?', danger: true, confirmLabel: 'Supprimer',
        text: `<b>${esc(p.name)}</b> et ses tâches associées seront supprimés. Cette action est irréversible.`
      });
      if (!ok) return;
      await ERP.Api.projects.remove(p.id);
      toast('Projet supprimé', 'ok');
      ERP.Router.go('/projets');
    };
    view.querySelector('[data-attach]').onclick = () => openAttachments(p, () => {
      const c = view.querySelector('#attCount');
      if (c) c.textContent = (ERP.DB.attachments[p.id] || []).length;
    });
    view.querySelector('[data-report]').onclick = () => {
      toast('Rapport de chantier généré (PDF simulé)', 'ok'); window.print();
    };
    on(view, 'click', '[data-worker]', (e, t) => ERP.Router.go('/pointage/' + t.dataset.worker));
  }

  /* ---------- Édition projet ---------- */
  function openEdit(p) {
    const m = ERP.UI.modal({
      title: 'Modifier le projet', sub: esc(p.name),
      body: `<div class="form-grid">
          <div class="field field--full"><label for="e-name">Nom du projet</label><input id="e-name" value="${esc(p.name)}"></div>
          <div class="field"><label for="e-start">Date de début</label><input id="e-start" type="date" value="${p.start}"></div>
          <div class="field"><label for="e-end">Fin prévue</label><input id="e-end" type="date" value="${p.end}"></div>
          <div class="field"><label for="e-status">Statut</label>
            <select id="e-status">${Object.entries(ERP.UI.STATUS.project).map(([k, v]) =>
              `<option value="${k}" ${p.status === k ? 'selected' : ''}>${v[0]}</option>`).join('')}</select></div>
          <div class="field"><label for="e-progress">Progression (%)</label><input id="e-progress" type="number" min="0" max="100" value="${p.progress}"></div>
          <div class="field"><label for="e-budget">Budget initial (DT)</label><input id="e-budget" type="number" value="${p.budget}"></div>
          <div class="field"><label for="e-manager">Chef de projet</label><input id="e-manager" value="${esc(p.manager)}"></div>
          <div class="field field--full"><label for="e-address">Adresse du chantier</label><input id="e-address" value="${esc(p.address)}"></div>
        </div>`,
      footer: `<button class="btn" data-cancel type="button">Annuler</button>
               <button class="btn btn--primary" data-save type="button">${icon('save', 18)} Enregistrer</button>`
    });
    m.foot.querySelector('[data-cancel]').onclick = m.close;
    m.foot.querySelector('[data-save]').onclick = async () => {
      const payload = {
        name: m.body.querySelector('#e-name').value.trim() || p.name,
        start: m.body.querySelector('#e-start').value,
        end: m.body.querySelector('#e-end').value,
        status: m.body.querySelector('#e-status').value,
        progress: Math.max(0, Math.min(100, +m.body.querySelector('#e-progress').value || 0)),
        budget: +m.body.querySelector('#e-budget').value || p.budget,
        manager: m.body.querySelector('#e-manager').value.trim(),
        address: m.body.querySelector('#e-address').value.trim()
      };
      try {
        await ERP.Api.projects.update(p.id, payload);
        m.close();
        toast('Projet mis à jour', 'ok');
        ERP.Router.go('/projets/' + p.id);
      } catch (err) {
        toast('Erreur : ' + (err.message || err), 'danger');
      }
    };
  }

  ERP.Router.add('/projets', { title: 'Projets', sub: 'Portefeuille de chantiers', render: renderList });
  ERP.Router.add('/projets/:id', { title: 'Fiche projet', sub: 'Détail du chantier', render: renderDetail });
})(window.ERP);

</script>
<script>
/* ===== js/planning.js ===== */
/* =========================================================
   BâtiPilot — Module PLANNING / TIMELINE
   ERP.Gantt est réutilisé par la fiche projet.
   ========================================================= */
window.ERP = window.ERP || {};

(function (ERP) {
  'use strict';
  const { icon, fmt, badge, pbar, on, esc } = ERP.UI;
  const dt = ERP.dt;

  const SCALES = {
    jour: { ppd: 44, minor: 'day' },
    semaine: { ppd: 13, minor: 'week' },
    mois: { ppd: 4.6, minor: 'week' }
  };

  /* =======================================================
     MOTEUR DE GANTT
     ======================================================= */
  function render(container, rows, { scale = 'mois', compact = false } = {}) {
    if (!container) return;
    if (!rows.length) {
      container.innerHTML = ERP.UI.empty('Rien à planifier', 'Aucune tâche n\'est programmée sur cette sélection.');
      return;
    }
    const cfg = SCALES[scale] || SCALES.mois;
    const ppd = cfg.ppd;

    const starts = rows.map(r => r.start).sort();
    const ends = rows.map(r => r.end).sort();
    let from = dt.add(starts[0], scale === 'jour' ? -2 : -6);
    let to = dt.add(ends[ends.length - 1], scale === 'jour' ? 2 : 8);
    // La date du jour reste toujours visible
    if (ERP.DB.today < from) from = dt.add(ERP.DB.today, -3);
    if (ERP.DB.today > to) to = dt.add(ERP.DB.today, 3);

    const days = dt.diff(from, to) + 1;
    const W = Math.round(days * ppd);
    const x = (iso) => Math.round(dt.diff(from, iso) * ppd);

    /* --- En-tête : mois (majeur) + jours ou semaines (mineur) --- */
    let major = '', minor = '', grid = '';
    let cursor = from;
    while (cursor <= to) {
      const d = dt.parse(cursor);
      const monthStart = cursor;
      const last = new Date(d.getFullYear(), d.getMonth() + 1, 0);
      const monthEnd = dt.iso(last) > to ? to : dt.iso(last);
      const left = x(monthStart), w = x(monthEnd) - left + ppd;
      major += `<div class="gantt__head-major" style="left:${left}px;width:${w}px">
                  ${fmt.monthsShort[d.getMonth()]}. ${String(d.getFullYear()).slice(2)}</div>`;
      grid += `<div class="gantt__gridline" style="left:${left}px"></div>`;
      cursor = dt.add(monthEnd, 1);
    }

    if (cfg.minor === 'day') {
      for (let i = 0; i < days; i++) {
        const iso = dt.add(from, i), d = dt.parse(iso), we = [0, 6].includes(d.getDay());
        minor += `<div class="gantt__head-minor ${we ? 'is-weekend' : ''}" style="left:${x(iso)}px;width:${ppd}px">
                    <span>${fmt.daysShort[d.getDay()]}<b style="display:block;font-weight:600">${d.getDate()}</b></span></div>`;
        if (we) grid += `<div class="gantt__gridband" style="left:${x(iso)}px;width:${ppd}px"></div>`;
      }
    } else {
      let c = from;
      // aligner sur le lundi
      while (dt.parse(c).getDay() !== 1 && c > dt.add(from, -7)) c = dt.add(c, -1);
      while (c <= to) {
        const left = x(c), w = 7 * ppd;
        minor += `<div class="gantt__head-minor" style="left:${left}px;width:${w}px">${dt.parse(c).getDate()}</div>`;
        grid += `<div class="gantt__gridline" style="left:${left}px"></div>`;
        c = dt.add(c, 7);
      }
    }

    const todayX = x(ERP.DB.today);

    const barCls = (r) => r.status === 'termine' ? 'gantt__bar--done'
      : r.status === 'en_retard' ? 'gantt__bar--late'
        : r.status === 'en_preparation' ? 'gantt__bar--prep' : '';

    container.innerHTML = `
      <div class="gantt">
        <div class="gantt__side">
          <div class="gantt__side-head"><span>Lot / chantier</span></div>
          ${rows.map(r => `<div class="gantt__row-label">
              <strong>${esc(r.label)}</strong><small>${esc(r.sub || '')}</small></div>`).join('')}
        </div>
        <div class="gantt__scroll">
          <div class="gantt__inner" style="width:${W}px">
            <div class="gantt__head">${major}${minor}</div>
            <div class="gantt__body">
              <div class="gantt__grid">${grid}</div>
              ${rows.map(r => {
                const left = x(r.start);
                const w = Math.max(ppd, x(r.end) - left + ppd);
                const late = r.status === 'en_retard' || (r.progress < 100 && r.end < ERP.DB.today);
                return `<div class="gantt__row">
                  <div class="gantt__bar ${late ? 'gantt__bar--late' : barCls(r)}" style="left:${left}px;width:${w}px"
                       title="${esc(r.label)} — ${fmt.date(r.start)} → ${fmt.date(r.end)} · ${r.progress} %">
                    <div class="gantt__bar-fill" style="width:${r.progress}%"></div>
                    <span class="gantt__bar-txt">${r.progress} %${late ? ' · retard' : ''}</span>
                  </div>
                </div>`;
              }).join('')}
              <div class="gantt__today" style="left:${todayX}px"></div>
            </div>
          </div>
        </div>
      </div>
      ${compact ? '' : `<div class="gantt-legend">
        <span><i style="background:var(--navy-600)"></i>En cours</span>
        <span><i style="background:var(--ok)"></i>Terminé</span>
        <span><i class="hazard" style="background:var(--danger)"></i>En retard</span>
        <span><i style="background:var(--faint)"></i>À démarrer</span>
        <span><i style="background:var(--orange);width:3px"></i>Date du jour</span>
      </div>`}`;

    // Centrer la vue sur aujourd'hui
    const sc = container.querySelector('.gantt__scroll');
    sc.scrollLeft = Math.max(0, todayX - sc.clientWidth / 3);
  }

  ERP.Gantt = { render };

  /* =======================================================
     PAGE PLANNING
     ======================================================= */
  const state = { projectId: 'tous', scale: 'mois' };

  async function renderPage(params, view) {
    const qs = ERP.Router.query();
    if (qs.projet) state.projectId = qs.projet;

    const projects = (await ERP.Api.projects.list()).filter(p => p.status !== 'termine');

    view.innerHTML = `
      <div class="toolbar">
        <div class="field" style="min-width:280px">
          <select id="plProject" aria-label="Choisir un chantier">
            <option value="tous">Tous les chantiers actifs</option>
            ${projects.map(p => `<option value="${p.id}" ${state.projectId === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
          </select>
        </div>
        <span class="spacer"></span>
        <button class="btn btn--sm" id="plToday">${icon('calendar', 17)} Aujourd'hui</button>
        <div class="segmented" id="plScale">
          ${['jour', 'semaine', 'mois'].map(s =>
            `<button data-s="${s}" class="${state.scale === s ? 'is-active' : ''}">${s[0].toUpperCase() + s.slice(1)}</button>`).join('')}
        </div>
      </div>

      <div class="card" style="padding:0;overflow:hidden">
        <div id="ganttHost"></div>
      </div>
      <div id="ganttLegend"></div>

      <section class="card" style="margin-top:var(--gap)">
        <div class="card__head"><h3>Détail des lots planifiés</h3><span class="spacer"></span>
          <span class="tag" id="plCount"></span></div>
        <div class="card__body card__body--flush"><div class="table-wrap">
          <table class="tbl">
            <thead><tr><th>Lot / chantier</th><th>Responsable</th><th>Début</th><th>Fin prévue</th>
              <th>Durée</th><th style="min-width:160px">Progression</th><th>État</th></tr></thead>
            <tbody id="plRows"></tbody>
          </table>
        </div></div>
      </section>`;

    const host = view.querySelector('#ganttHost');

    async function refresh() {
      const rows = await ERP.Api.planning.rows({ projectId: state.projectId });
      render(host, rows, { scale: state.scale });
      view.querySelector('#ganttLegend').innerHTML = '';
      view.querySelector('#plCount').textContent = rows.length + ' lignes';
      view.querySelector('#plRows').innerHTML = rows.map(r => {
        const late = r.progress < 100 && r.end < ERP.DB.today;
        const dur = dt.diff(r.start, r.end) + 1;
        return `<tr class="is-clickable" data-go="/projets/${r.projectId}">
          <td class="cell-main">${esc(r.label)}</td>
          <td>${esc(r.sub || '—')}</td>
          <td class="num">${fmt.date(r.start)}</td>
          <td class="num" ${late ? 'style="color:var(--danger);font-weight:600"' : ''}>${fmt.date(r.end)}</td>
          <td class="num">${dur} j</td>
          <td><div class="pbar-row">${pbar(r.progress, late ? 'pbar__fill--danger' : r.progress === 100 ? 'pbar__fill--ok' : '', true)}<b class="num">${r.progress}%</b></div></td>
          <td>${late ? `<span class="badge badge--danger">Retard ${dt.diff(r.end, ERP.DB.today)} j</span>` : badge('project', r.status)}</td>
        </tr>`;
      }).join('');
    }

    await refresh();

    view.querySelector('#plProject').onchange = (e) => { state.projectId = e.target.value; refresh(); };
    on(view, 'click', '#plScale button', (e, t) => {
      state.scale = t.dataset.s;
      view.querySelectorAll('#plScale button').forEach(b => b.classList.toggle('is-active', b === t));
      refresh();
    });
    view.querySelector('#plToday').onclick = () => {
      const sc = host.querySelector('.gantt__scroll');
      const line = host.querySelector('.gantt__today');
      sc.scrollTo({ left: Math.max(0, parseFloat(line.style.left) - sc.clientWidth / 3), behavior: 'smooth' });
    };
    on(view, 'click', '[data-go]', (e, t) => ERP.Router.go(t.dataset.go));
  }

  ERP.Router.add('/planning', { title: 'Planning', sub: 'Timeline des lots et des chantiers', render: renderPage });
})(window.ERP);

</script>
<script>
/* ===== js/workers.js ===== */
/* =========================================================
   BâtiPilot — Module POINTAGE DES OUVRIERS
   ========================================================= */
window.ERP = window.ERP || {};

(function (ERP) {
  'use strict';
  const { icon, fmt, badge, on, esc, toast } = ERP.UI;
  const dt = ERP.dt;

  const toMin = (v) => { if (!v) return null; const [h, m] = v.split(':').map(Number); return h * 60 + m; };
  const toHHMM = (min) => min == null ? '' : `${String(Math.floor(min / 60)).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}`;

  const state = { date: null, projectId: 'tous', trade: 'tous', status: 'tous', q: '' };

  /* =======================================================
     PAGE POINTAGE DU JOUR
     ======================================================= */
  async function renderPage(params, view) {
    if (!state.date) state.date = ERP.DB.today;
    const qs = ERP.Router.query();
    if (qs.projet) state.projectId = qs.projet;

    const projects = (await ERP.Api.projects.list()).filter(p => p.status !== 'termine');
    const trades = [...new Set(ERP.DB.workers.map(w => w.trade))].sort();

    view.innerHTML = `
      <div class="toolbar">
        <div class="day-nav">
          <button class="icon-btn icon-btn--ghost" data-day="-1" aria-label="Jour précédent">${icon('chevronLeft', 20)}</button>
          <span class="day-nav__label" id="ptDate"></span>
          <button class="icon-btn icon-btn--ghost" data-day="1" aria-label="Jour suivant">${icon('chevronRight', 20)}</button>
        </div>
        <button class="btn btn--sm" id="ptToday">Aujourd'hui</button>
        <span class="spacer"></span>
        <button class="btn" id="ptWorker">${icon('hardhat', 20)} Nouvel ouvrier</button>
        <button class="btn btn--accent" id="ptAdd">${icon('plus', 20)} Ajouter un pointage</button>
      </div>

      <div class="kpis" style="grid-template-columns:repeat(5,minmax(0,1fr))" id="ptKpis"></div>

      <div class="toolbar">
        <div class="chips" id="ptStatus">
          ${[['tous', 'Tous'], ['present', 'Présents'], ['retard', 'En retard'], ['absent', 'Absents']].map(([k, l]) =>
            `<button class="chip ${state.status === k ? 'is-active' : ''}" data-s="${k}">${l}</button>`).join('')}
        </div>
        <span class="spacer"></span>
        <div class="field" style="min-width:200px">
          <select id="ptProject" aria-label="Filtrer par chantier">
            <option value="tous">Tous les chantiers</option>
            ${projects.map(p => `<option value="${p.id}" ${state.projectId === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="min-width:170px">
          <select id="ptTrade" aria-label="Filtrer par métier">
            <option value="tous">Tous les métiers</option>
            ${trades.map(t => `<option value="${t}" ${state.trade === t ? 'selected' : ''}>${t}</option>`).join('')}
          </select>
        </div>
        <div class="search-field" style="flex:0 1 240px">
          <span class="ico">${icon('search', 19)}</span>
          <input type="search" id="ptSearch" placeholder="Nom de l'ouvrier…" value="${esc(state.q)}">
        </div>
      </div>

      <section class="card">
        <div class="card__head"><h3>Feuille de pointage</h3><span class="spacer"></span>
          <span class="tag" id="ptCount"></span>
          <button class="btn btn--sm" id="ptExport">${icon('download', 17)} Exporter</button>
        </div>
        <div class="card__body card__body--flush"><div class="table-wrap">
          <table class="tbl">
            <thead><tr>
              <th>Ouvrier</th><th>Métier</th><th>Chantier</th>
              <th class="t-center">Arrivée</th><th class="t-center">Départ</th><th class="t-center">Pause</th>
              <th class="t-right">Heures</th><th style="min-width:150px">Amplitude</th><th>Statut</th><th></th>
            </tr></thead>
            <tbody id="ptRows"></tbody>
          </table>
        </div></div>
      </section>`;

    async function refresh() {
      view.querySelector('#ptDate').textContent = fmt.dateFull(state.date);
      const [rows, sum] = await Promise.all([
        ERP.Api.timesheets.list(state),
        ERP.Api.timesheets.summary({ date: state.date })
      ]);

      view.querySelector('#ptKpis').innerHTML = [
        { l: 'Ouvriers prévus', v: sum.scheduled, i: 'users', t: '' },
        { l: 'Présents', v: sum.present, i: 'hardhat', t: 'kpi__ico--ok', f: `${sum.late} arrivées tardives` },
        { l: 'Absents', v: sum.absent, i: 'alert', t: 'kpi__ico--danger', f: sum.absent ? 'À justifier' : 'Effectif complet', alert: sum.absent > 0 },
        { l: 'Heures travaillées', v: Math.round(sum.hours), u: ' h', i: 'clock', t: 'kpi__ico--orange', f: `Moyenne ${fmt.hours(sum.hours / (sum.present || 1))}` },
        { l: 'Coût main-d\'œuvre', v: fmt.moneyShort(sum.cost), i: 'wallet', t: 'kpi__ico--warn', f: 'Estimation du jour' }
      ].map(k => `
        <div class="kpi ${k.alert ? 'kpi--alert' : ''}">
          <div class="kpi__top"><span class="kpi__ico ${k.t}">${icon(k.i, 19)}</span><span class="kpi__label">${k.l}</span></div>
          <div class="kpi__value num">${k.v}${k.u ? `<span>${k.u}</span>` : ''}</div>
          <div class="kpi__foot">${k.f || ''}</div>
        </div>`).join('');

      view.querySelector('#ptCount').textContent = rows.length + ' lignes';
      const tbody = view.querySelector('#ptRows');

      if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="10">${ERP.UI.empty('Aucun pointage',
          'Aucune ligne ne correspond aux filtres choisis pour cette journée.')}</td></tr>`;
        return;
      }

      tbody.innerHTML = rows.map(r => {
        const span = r.in != null ? `
          <div class="timeline-hours" title="${fmt.time(r.in)} → ${fmt.time(r.out)}">
            <div class="timeline-hours__seg" style="left:${((r.in - 360) / 720 * 100).toFixed(1)}%;width:${((r.out - r.in) / 720 * 100).toFixed(1)}%"></div>
            <div class="timeline-hours__pause" style="left:${((r.in + (r.out - r.in) / 2 - r.breakMin / 2 - 360) / 720 * 100).toFixed(1)}%;width:${(r.breakMin / 720 * 100).toFixed(1)}%"></div>
          </div>` : '<span class="muted small">—</span>';
        return `<tr class="is-clickable" data-worker="${r.workerId}">
          <td><div class="idcell">
                <span class="avatar avatar--soft">${r.worker.split(' ').map(s => s[0]).slice(0, 2).join('')}</span>
                <span class="idcell__txt"><div class="cell-main">${esc(r.worker)}</div>
                <div class="cell-sub">${r.note ? esc(r.note) : 'Matricule ' + (ERP.DB.workers.find(w => w.id === r.workerId) || {}).matricule}</div></span>
              </div></td>
          <td>${esc(r.trade)}</td>
          <td class="small">${esc(r.projectName)}</td>
          <td class="t-center num">${fmt.time(r.in)}</td>
          <td class="t-center num">${fmt.time(r.out)}</td>
          <td class="t-center num">${r.breakMin ? r.breakMin + ' min' : '—'}</td>
          <td class="t-right"><span class="hours-cell">${r.status === 'absent' ? '—' : fmt.hours(r.hours)}</span></td>
          <td>${span}</td>
          <td>${badge('presence', r.status)}</td>
          <td class="t-right"><button class="icon-btn icon-btn--ghost" data-edit="${r.workerId}" aria-label="Modifier le pointage">${icon('edit', 18)}</button></td>
        </tr>`;
      }).join('');
    }

    await refresh();

    on(view, 'click', '[data-day]', (e, t) => { state.date = dt.add(state.date, +t.dataset.day); refresh(); });
    view.querySelector('#ptToday').onclick = () => { state.date = ERP.DB.today; refresh(); };
    on(view, 'click', '#ptStatus .chip', (e, t) => {
      state.status = t.dataset.s;
      view.querySelectorAll('#ptStatus .chip').forEach(c => c.classList.toggle('is-active', c === t));
      refresh();
    });
    view.querySelector('#ptProject').onchange = (e) => { state.projectId = e.target.value; refresh(); };
    view.querySelector('#ptTrade').onchange = (e) => { state.trade = e.target.value; refresh(); };
    view.querySelector('#ptSearch').addEventListener('input', ERP.UI.debounce(e => { state.q = e.target.value; refresh(); }, 200));
    view.querySelector('#ptAdd').onclick = () => openForm(null, refresh);
    view.querySelector('#ptWorker').onclick = () => openWorkerForm(null, refresh);
    view.querySelector('#ptExport').onclick = () => toast('Feuille de pointage exportée (CSV simulé)', 'ok');
    on(view, 'click', '[data-edit]', (e, t) => { e.stopPropagation(); openForm(t.dataset.edit, refresh); });
    on(view, 'click', '[data-worker]', (e, t) => ERP.Router.go('/pointage/' + t.dataset.worker));
  }

  /* =======================================================
     FORMULAIRE DE POINTAGE
     ======================================================= */

  function openWorkerForm(worker, done) {
    const projects = ERP.DB.projects.filter(p => p.status !== 'termine');
    const trades = [...new Set(ERP.DB.workers.map(w => w.trade))].sort();
    const m = ERP.UI.modal({
      title: worker ? 'Modifier l\'ouvrier' : 'Nouvel ouvrier',
      sub: worker ? esc(worker.name) : 'Ajouter un membre d\'équipe',
      body: `<div class="form-grid">
          <div class="field field--full"><label for="w-name">Nom complet</label>
            <input id="w-name" value="${worker ? esc(worker.name) : ''}" placeholder="Prénom Nom"></div>
          <div class="field"><label for="w-trade">Métier</label>
            <input id="w-trade" list="w-trades" value="${worker ? esc(worker.trade) : ''}" placeholder="Maçon">
            <datalist id="w-trades">${trades.map(t => `<option value="${esc(t)}">`).join('')}</datalist></div>
          <div class="field"><label for="w-rate">Taux horaire (DT)</label>
            <input id="w-rate" type="number" min="1" step="0.5" value="${worker ? worker.rate : 15}"></div>
          <div class="field"><label for="w-phone">Téléphone</label>
            <input id="w-phone" value="${worker ? esc(worker.phone || '') : '+216 '}"></div>
          <div class="field"><label for="w-project">Chantier affecté</label>
            <select id="w-project">
              <option value="">— Non affecté —</option>
              ${projects.map(p => `<option value="${p.id}" ${worker && worker.projectId === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
            </select></div>
        </div>`,
      footer: `${worker ? `<button class="btn btn--danger" data-del type="button">${icon('trash', 18)} Supprimer</button>` : ''}
               <span style="flex:1"></span>
               <button class="btn" data-cancel type="button">Annuler</button>
               <button class="btn btn--primary" data-save type="button">${icon('save', 18)} ${worker ? 'Enregistrer' : 'Créer'}</button>`
    });
    m.foot.querySelector('[data-cancel]').onclick = m.close;
    m.foot.querySelector('[data-save]').onclick = async () => {
      const g = (id) => m.body.querySelector(id).value.trim();
      if (!g('#w-name')) { toast('Le nom est obligatoire', 'danger'); return; }
      const payload = {
        name: g('#w-name'), trade: g('#w-trade') || 'Maçon',
        rate: +g('#w-rate') || 15, phone: g('#w-phone'),
        projectId: g('#w-project') || null
      };
      try {
        if (worker) {
          await ERP.Api.workers.update(worker.id, payload);
          toast('Ouvrier mis à jour', 'ok');
        } else {
          await ERP.Api.workers.create(payload);
          toast('Ouvrier créé', 'ok');
        }
        m.close();
        if (done) done();
      } catch (err) {
        toast('Erreur : ' + (err.message || err), 'danger');
      }
    };
    if (worker) {
      m.foot.querySelector('[data-del]').onclick = async () => {
        const ok = await confirm({
          title: 'Supprimer cet ouvrier ?', danger: true, confirmLabel: 'Supprimer',
          text: `<b>${esc(worker.name)}</b> sera retiré de l\'effectif.`
        });
        if (!ok) return;
        await ERP.Api.workers.remove(worker.id);
        m.close();
        toast('Ouvrier supprimé', 'ok');
        if (done) done();
      };
    }
  }

  function openForm(workerId, done) {
    const workers = ERP.DB.workers;
    const projects = ERP.DB.projects.filter(p => p.status !== 'termine');
    const existing = workerId ? ERP.DB.timesheets(state.date).find(r => r.workerId === workerId) : null;
    const w = workerId ? workers.find(x => x.id === workerId) : null;

    const m = ERP.UI.modal({
      title: existing ? 'Modifier le pointage' : 'Ajouter un pointage',
      sub: fmt.dateFull(state.date),
      body: `
        <div class="form-grid">
          <div class="field field--full">
            <label for="f-worker">Ouvrier</label>
            <select id="f-worker">${workers.map(x =>
              `<option value="${x.id}" ${workerId === x.id ? 'selected' : ''}>${esc(x.name)} — ${esc(x.trade)}</option>`).join('')}</select>
          </div>
          <div class="field">
            <label for="f-project">Chantier</label>
            <select id="f-project">${projects.map(p =>
              `<option value="${p.id}" ${(existing ? existing.projectId : w && w.projectId) === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>
          </div>
          <div class="field"><label for="f-date">Date</label><input id="f-date" type="date" value="${state.date}"></div>
          <div class="field"><label for="f-in">Heure d'arrivée</label><input id="f-in" type="time" value="${existing && existing.in != null ? toHHMM(existing.in) : '07:00'}"></div>
          <div class="field"><label for="f-out">Heure de départ</label><input id="f-out" type="time" value="${existing && existing.out != null ? toHHMM(existing.out) : '16:00'}"></div>
          <div class="field"><label for="f-break">Pause (minutes)</label><input id="f-break" type="number" min="0" step="5" value="${existing ? existing.breakMin : 60}"></div>
          <div class="field"><label for="f-status">Statut</label>
            <select id="f-status">
              <option value="present" ${existing && existing.status === 'present' ? 'selected' : ''}>Présent</option>
              <option value="retard" ${existing && existing.status === 'retard' ? 'selected' : ''}>Arrivée tardive</option>
              <option value="absent" ${existing && existing.status === 'absent' ? 'selected' : ''}>Absent</option>
            </select></div>
          <div class="field field--full"><label for="f-note">Observation</label>
            <textarea id="f-note" placeholder="Ex. : intempéries, départ anticipé, tâche exceptionnelle…">${existing ? esc(existing.note) : ''}</textarea></div>
        </div>
        <div class="alert-band" style="margin-top:16px">
          <div><strong>Total calculé : <span id="f-total" class="num">—</span></strong>
          <p>Le total retire automatiquement la pause de l'amplitude horaire.</p></div>
        </div>`,
      footer: `<button class="btn" data-cancel type="button">Annuler</button>
               <button class="btn btn--primary" data-save type="button">${icon('save', 18)} Enregistrer le pointage</button>`
    });

    const g = (id) => m.body.querySelector(id);
    function total() {
      const a = toMin(g('#f-in').value), b = toMin(g('#f-out').value), br = +g('#f-break').value || 0;
      const absent = g('#f-status').value === 'absent';
      const h = (a == null || b == null || b <= a) ? null : (b - a - br) / 60;
      g('#f-total').textContent = absent ? '0h00 (absent)' : (h == null ? 'horaires invalides' : fmt.hours(h));
      return h;
    }
    ['#f-in', '#f-out', '#f-break', '#f-status'].forEach(s => g(s).addEventListener('input', total));
    total();

    m.foot.querySelector('[data-cancel]').onclick = m.close;
    m.foot.querySelector('[data-save]').onclick = async () => {
      const status = g('#f-status').value;
      const a = toMin(g('#f-in').value), b = toMin(g('#f-out').value);
      if (status !== 'absent' && (a == null || b == null || b <= a)) {
        toast('L\'heure de départ doit être postérieure à l\'heure d\'arrivée', 'danger');
        return;
      }
      await ERP.Api.timesheets.create({
        workerId: g('#f-worker').value,
        projectId: g('#f-project').value,
        date: g('#f-date').value,
        in: status === 'absent' ? null : a,
        out: status === 'absent' ? null : b,
        breakMin: status === 'absent' ? 0 : (+g('#f-break').value || 0),
        status,
        note: g('#f-note').value.trim()
      });
      state.date = g('#f-date').value;
      m.close();
      toast('Pointage enregistré', 'ok');
      if (done) done();
    };
  }

  /* =======================================================
     FICHE OUVRIER
     ======================================================= */
  async function renderWorker(params, view) {
    const w = await ERP.Api.workers.get(params.id);
    if (!w) { view.innerHTML = ERP.UI.empty('Ouvrier introuvable', 'Cette fiche n\'existe pas.'); return; }

    const history = [];
    for (let i = 0; i < 12; i++) {
      const d = dt.add(ERP.DB.today, -i);
      if (dt.isWeekend(d)) continue;
      const e = ERP.DB.timesheets(d).find(t => t.workerId === w.id);
      if (e) history.push(e);
    }

    view.innerHTML = `
      <div class="backbar">
        <button class="icon-btn" data-back type="button" aria-label="Retour">${icon('arrowLeft', 22)}</button>
        <span class="avatar avatar--lg avatar--orange">${w.name.split(' ').map(s => s[0]).slice(0, 2).join('')}</span>
        <div>
          <h2 style="font-size:24px">${esc(w.name)}</h2>
          <div class="crumb">${esc(w.trade)} · Matricule <b class="num">${w.matricule}</b> · ${esc(w.contract)}</div>
        </div>
        ${badge('presence', w.todayStatus)}
        <span class="spacer"></span>
        <button class="btn btn--sm" data-call type="button">${icon('phone', 18)} Appeler</button>
        <button class="btn btn--sm" data-edit-worker type="button">${icon('edit', 18)} Modifier</button>
        <button class="btn btn--sm btn--accent" data-point type="button">${icon('plus', 18)} Pointer</button>
      </div>

      <div class="kpis" style="grid-template-columns:repeat(4,minmax(0,1fr))">
        <div class="kpi"><div class="kpi__top"><span class="kpi__ico kpi__ico--orange">${icon('clock', 19)}</span><span class="kpi__label">Heures — 30 derniers jours</span></div>
          <div class="kpi__value num">${w.monthHours}<span>h</span></div><div class="kpi__foot">Sur ${history.length} jours pointés</div></div>
        <div class="kpi"><div class="kpi__top"><span class="kpi__ico">${icon('wallet', 19)}</span><span class="kpi__label">Coût main-d'œuvre</span></div>
          <div class="kpi__value num">${fmt.moneyShort(w.monthCost)}</div><div class="kpi__foot">${w.rate} DT / heure</div></div>
        <div class="kpi"><div class="kpi__top"><span class="kpi__ico">${icon('building', 19)}</span><span class="kpi__label">Chantier affecté</span></div>
          <div class="kpi__value" style="font-size:20px;line-height:1.2">${esc(w.projectName)}</div><div class="kpi__foot">Affectation courante</div></div>
        <div class="kpi"><div class="kpi__top"><span class="kpi__ico kpi__ico--ok">${icon('check', 19)}</span><span class="kpi__label">Ancienneté</span></div>
          <div class="kpi__value num">${new Date().getFullYear() - +w.since.slice(0, 4)}<span>ans</span></div>
          <div class="kpi__foot">Depuis le ${fmt.date(w.since)}</div></div>
      </div>

      <div class="dash-cols">
        <section class="card">
          <div class="card__head"><h3>Historique des pointages</h3><span class="spacer"></span>
            <span class="tag">12 derniers jours ouvrés</span></div>
          <div class="card__body card__body--flush"><div class="table-wrap">
            <table class="tbl"><thead><tr>
              <th>Date</th><th>Chantier</th><th class="t-center">Arrivée</th><th class="t-center">Départ</th>
              <th class="t-center">Pause</th><th class="t-right">Heures</th><th>Statut</th></tr></thead>
              <tbody>${history.map(e => `<tr>
                <td class="cell-main num">${fmt.date(e.date)}</td>
                <td class="small">${esc((ERP.DB.projects.find(p => p.id === e.projectId) || {}).name || '—')}</td>
                <td class="t-center num">${fmt.time(e.in)}</td>
                <td class="t-center num">${fmt.time(e.out)}</td>
                <td class="t-center num">${e.breakMin ? e.breakMin + ' min' : '—'}</td>
                <td class="t-right"><span class="hours-cell">${e.status === 'absent' ? '—' : fmt.hours(e.hours)}</span></td>
                <td>${badge('presence', e.status)}</td></tr>`).join('')}
              </tbody></table>
          </div></div>
        </section>

        <div class="stack">
          <section class="card">
            <div class="card__head"><h3>Informations</h3></div>
            <div class="card__body">
              <dl class="props">
                <div class="prop"><dt>Métier</dt><dd>${esc(w.trade)}</dd></div>
                <div class="prop"><dt>Contrat</dt><dd>${esc(w.contract)}</dd></div>
                <div class="prop"><dt>Téléphone</dt><dd class="num">${esc(w.phone)}</dd></div>
                <div class="prop"><dt>N° CNSS</dt><dd class="num">${esc(w.cnss)}</dd></div>
                <div class="prop"><dt>Taux horaire</dt><dd class="num">${w.rate} DT</dd></div>
                <div class="prop"><dt>Embauche</dt><dd class="num">${fmt.date(w.since)}</dd></div>
              </dl>
            </div>
          </section>
          <section class="card">
            <div class="card__head"><h3>Heures par jour</h3></div>
            <div class="card__body chart-box" id="wkChart"></div>
          </section>
        </div>
      </div>`;

    const h = history.slice().reverse();
    ERP.Charts.bars(view.querySelector('#wkChart'), {
      labels: h.map(e => fmt.dateShort(e.date)),
      series: [{ name: 'Heures', color: ERP.Charts.colors.navy, data: h.map(e => +e.hours.toFixed(1)) }],
      formatter: (v) => v + ' h', height: 240
    });

    view.querySelector('[data-back]').onclick = () => history.length ? window.history.back() : ERP.Router.go('/pointage');
    view.querySelector('[data-call]').onclick = () => toast('Appel vers ' + w.phone + ' (simulé)', 'info');
    view.querySelector('[data-point]').onclick = () => openForm(w.id, () => renderWorker(params, view));
    view.querySelector('[data-edit-worker]').onclick = () => openWorkerForm(w, () => renderWorker(params, view));
  }

  ERP.Router.add('/pointage', { title: 'Pointage', sub: 'Présence et heures des ouvriers', render: renderPage });
  ERP.Router.add('/pointage/:id', { title: 'Fiche ouvrier', sub: 'Historique et affectation', render: renderWorker });
})(window.ERP);

</script>
<script>
/* ===== js/clients.js ===== */
/* =========================================================
   BâtiPilot — Module CLIENTS (mini CRM)
   ========================================================= */
window.ERP = window.ERP || {};

(function (ERP) {
  'use strict';
  const { icon, fmt, badge, pbar, on, esc, toast } = ERP.UI;

  const state = { status: 'tous', q: '' };
  const FILTERS = [['tous', 'Tous'], ['actif', 'Actifs'], ['prospect', 'Prospects'], ['inactif', 'Inactifs']];

  async function renderList(params, view) {
    view.innerHTML = `
      <div class="toolbar">
        <div class="chips" id="clFilters"></div>
        <span class="spacer"></span>
        <div class="search-field">
          <span class="ico">${icon('search', 19)}</span>
          <input type="search" id="clSearch" placeholder="Société, contact ou ville…" value="${esc(state.q)}">
        </div>
        <button class="btn btn--accent" id="clAdd">${icon('plus', 20)} Nouveau client</button>
      </div>
      <section class="card">
        <div class="card__head"><h3>Portefeuille clients</h3><span class="spacer"></span><span class="tag" id="clCount"></span></div>
        <div class="card__body card__body--flush"><div class="table-wrap">
          <table class="tbl"><thead><tr>
            <th>Client</th><th>Contact</th><th>Téléphone</th><th>E-mail</th>
            <th class="t-center">Projets</th><th class="t-right">Montant total</th><th>Dernier projet</th><th>Statut</th>
          </tr></thead><tbody id="clRows"></tbody></table>
        </div></div>
      </section>`;

    async function refresh() {
      const all = await ERP.Api.clients.list({ q: state.q });
      view.querySelector('#clFilters').innerHTML = FILTERS.map(([k, l]) => {
        const n = k === 'tous' ? all.length : all.filter(c => c.status === k).length;
        return `<button class="chip ${state.status === k ? 'is-active' : ''}" data-f="${k}">${l}<span class="chip__n num">${n}</span></button>`;
      }).join('');

      const list = state.status === 'tous' ? all : all.filter(c => c.status === state.status);
      view.querySelector('#clCount').textContent = list.length + ' clients';
      const tb = view.querySelector('#clRows');

      if (!list.length) {
        tb.innerHTML = `<tr><td colspan="8">${ERP.UI.empty('Aucun client', 'Aucune fiche ne correspond à cette recherche.')}</td></tr>`;
        return;
      }
      tb.innerHTML = list.map(c => `
        <tr class="is-clickable" data-id="${c.id}">
          <td><div class="idcell">
              <span class="avatar avatar--soft">${c.company.replace(/[^A-Za-zÀ-ÿ ]/g, '').split(' ').filter(Boolean).map(s => s[0]).slice(0, 2).join('')}</span>
              <span class="idcell__txt"><div class="cell-main">${esc(c.company)}</div><div class="cell-sub">${esc(c.city)}</div></span>
            </div></td>
          <td>${esc(c.contact)}</td>
          <td class="num">${esc(c.phone)}</td>
          <td class="small">${esc(c.email)}</td>
          <td class="t-center"><span class="tag num">${c.projectCount}</span></td>
          <td class="t-right"><span class="money num">${fmt.moneyShort(c.totalAmount)}</span></td>
          <td class="small">${esc(c.lastProject)}</td>
          <td>${badge('client', c.status)}</td>
        </tr>`).join('');
    }

    await refresh();
    on(view, 'click', '.chip[data-f]', (e, t) => { state.status = t.dataset.f; refresh(); });
    view.querySelector('#clSearch').addEventListener('input', ERP.UI.debounce(e => { state.q = e.target.value; refresh(); }, 200));
    view.querySelector('#clAdd').onclick = () => openForm(refresh);
    on(view, 'click', 'tr[data-id]', (e, t) => ERP.Router.go('/clients/' + t.dataset.id));
  }

  /* ---------- Fiche client ---------- */
  async function renderDetail(params, view) {
    const c = await ERP.Api.clients.get(params.id);
    if (!c) { view.innerHTML = ERP.UI.empty('Client introuvable', 'Cette fiche n\'existe pas.'); return; }

    const TONE = { info: 'kpi__ico--orange', ok: 'kpi__ico--ok', warn: 'kpi__ico--warn', neutral: '' };

    view.innerHTML = `
      <div class="backbar">
        <button class="icon-btn" data-back type="button" aria-label="Retour">${icon('arrowLeft', 22)}</button>
        <span class="avatar avatar--lg">${c.company.replace(/[^A-Za-zÀ-ÿ ]/g, '').split(' ').filter(Boolean).map(s => s[0]).slice(0, 2).join('')}</span>
        <div><h2 style="font-size:24px">${esc(c.company)}</h2>
          <div class="crumb">${esc(c.contact)} · Client depuis ${fmt.dateLong(c.since)}</div></div>
        ${badge('client', c.status)}
        <span class="spacer"></span>
        <button class="btn btn--sm" data-call>${icon('phone', 18)} Appeler</button>
        <button class="btn btn--sm" data-mail>${icon('mail', 18)} Écrire</button>
        <button class="btn btn--sm btn--primary" data-quote>${icon('file', 18)} Nouveau devis</button>
      </div>

      <div class="kpis" style="grid-template-columns:repeat(4,minmax(0,1fr))">
        <div class="kpi"><div class="kpi__top"><span class="kpi__ico">${icon('building', 19)}</span><span class="kpi__label">Projets confiés</span></div>
          <div class="kpi__value num">${c.projectCount}</div><div class="kpi__foot">${c.openCount} en cours</div></div>
        <div class="kpi"><div class="kpi__top"><span class="kpi__ico kpi__ico--warn">${icon('wallet', 19)}</span><span class="kpi__label">Montant total</span></div>
          <div class="kpi__value num" style="font-size:30px">${fmt.moneyShort(c.totalAmount)}</div><div class="kpi__foot">Cumul des budgets</div></div>
        <div class="kpi"><div class="kpi__top"><span class="kpi__ico kpi__ico--ok">${icon('check', 19)}</span><span class="kpi__label">Projets livrés</span></div>
          <div class="kpi__value num">${c.projectCount - c.openCount}</div><div class="kpi__foot">Réceptionnés</div></div>
        <div class="kpi"><div class="kpi__top"><span class="kpi__ico">${icon('clock', 19)}</span><span class="kpi__label">Dernier projet</span></div>
          <div class="kpi__value" style="font-size:18px;line-height:1.25">${esc(c.lastProject)}</div><div class="kpi__foot">Le plus récent</div></div>
      </div>

      <div class="dash-cols">
        <div class="stack">
          <section class="card">
            <div class="card__head"><h3>Projets associés</h3><span class="spacer"></span><span class="tag">${c.projects.length}</span></div>
            <div class="card__body card__body--flush">
              ${c.projects.length ? c.projects.map(p => `
                <button class="list-row" data-project="${p.id}">
                  <span class="list-row__ico ${p.status === 'en_retard' ? 'kpi__ico--danger' : p.status === 'termine' ? 'kpi__ico--ok' : ''}">${icon('building', 18)}</span>
                  <span class="list-row__txt">
                    <strong>${esc(p.name)}</strong>
                    <small>${p.ref} · ${fmt.date(p.start)} → ${fmt.date(p.end)} · ${fmt.moneyShort(p.budget)}</small>
                    <span style="display:block;max-width:280px;margin-top:6px">${pbar(p.progress, p.status === 'en_retard' ? 'pbar__fill--danger' : p.status === 'termine' ? 'pbar__fill--ok' : '', true)}</span>
                  </span>
                  <span class="list-row__end">${badge('project', p.status)}<div class="small muted num" style="margin-top:5px">${p.progress} %</div></span>
                </button>`).join('') : '<div class="empty" style="padding:30px">Aucun projet enregistré pour ce client.</div>'}
            </div>
          </section>

          <section class="card">
            <div class="card__head"><h3>Historique commercial</h3>
              ${c.quotes.length ? `<span class="tag num">${c.quotes.length} devis établi${c.quotes.length > 1 ? 's' : ''}</span>` : ''}
              <span class="spacer"></span>
              <button class="btn btn--sm btn--accent" data-quote2 type="button">${icon('plus', 17)} Devis</button></div>
            <div class="card__body card__body--flush"><div class="table-wrap">
              <table class="tbl"><thead><tr><th>Type</th><th>Référence</th><th>Date</th><th class="t-right">Montant</th><th>Détail</th><th class="t-right">Action</th></tr></thead>
                <tbody>${c.history.map(h => `<tr>
                  <td><span class="list-row__ico ${TONE[h.tone]}" style="width:30px;height:30px;display:inline-grid">${icon(h.type === 'Paiement' ? 'wallet' : h.type === 'Échange' ? 'phone' : 'file', 16)}</span>
                      <span style="margin-left:8px;font-weight:600">${h.type}</span></td>
                  <td class="num">${h.ref}</td>
                  <td class="num">${fmt.date(h.date)}</td>
                  <td class="t-right money num">${h.amount ? fmt.money(h.amount) : '—'}</td>
                  <td class="small muted">${esc(h.note || '—')}</td>
                  <td class="t-right">${h.quoteId ? (quoteById(c, h.quoteId).projectId
                    ? `<a class="btn btn--sm btn--ghost" href="#/projets/${quoteById(c, h.quoteId).projectId}">Voir le projet</a>`
                    : `<button class="btn btn--sm btn--accent" data-convert="${h.quoteId}" type="button">Convertir en projet</button>`) : '—'}</td>
                  </tr>`).join('')}</tbody></table>
            </div></div>
          </section>
        </div>

        <section class="card" style="align-self:start">
          <div class="card__head"><h3>Coordonnées</h3><span class="spacer"></span>
            <button class="btn btn--sm btn--ghost" data-edit type="button">${icon('edit', 17)}</button>
            <button class="btn btn--sm btn--ghost" data-del-client type="button" style="color:var(--danger)">${icon('trash', 17)}</button></div>
          <div class="card__body">
            <dl class="props" style="grid-template-columns:1fr">
              <div class="prop"><dt>Société</dt><dd>${esc(c.company)}</dd></div>
              <div class="prop"><dt>Interlocuteur</dt><dd>${esc(c.contact)}</dd></div>
              <div class="prop"><dt>Téléphone</dt><dd class="num">${esc(c.phone)}</dd></div>
              <div class="prop"><dt>E-mail</dt><dd style="font-size:14px">${esc(c.email)}</dd></div>
              <div class="prop"><dt>Adresse</dt><dd style="font-size:14px;font-weight:500">${esc(c.address)}</dd></div>
            </dl>
          </div>
        </section>
      </div>`;

    view.querySelector('[data-back]').onclick = () => window.history.back();
    view.querySelector('[data-call]').onclick = () => toast('Appel vers ' + c.phone + ' (simulé)', 'info');
    view.querySelector('[data-mail]').onclick = () => toast('Brouillon d\'e-mail ouvert (simulé)', 'info');
    const reload = () => renderDetail(params, view);
    view.querySelector('[data-quote]').onclick = () => openQuote(c, reload);
    view.querySelector('[data-quote2]').onclick = () => openQuote(c, reload);
    on(view, 'click', '[data-convert]', async (e, b) => convertQuote(b.dataset.convert, reload));
    view.querySelector('[data-edit]').onclick = () => openForm(() => renderDetail(params, view), c);
    view.querySelector('[data-del-client]').onclick = async () => {
      const ok = await confirm({
        title: 'Supprimer ce client ?', danger: true, confirmLabel: 'Supprimer',
        text: `<b>${esc(c.company)}</b> sera retiré du portefeuille. Les projets liés ne sont pas supprimés.`
      });
      if (!ok) return;
      await ERP.Api.clients.remove(c.id);
      toast('Client supprimé', 'ok');
      ERP.Router.go('/clients');
    };
    on(view, 'click', '[data-project]', (e, t) => ERP.Router.go('/projets/' + t.dataset.project));
  }

  /* =======================================================
     DEVIS DE PROJET
     Établi depuis la fiche client, converti ensuite en chantier.
     ======================================================= */
  function quoteById(c, id) { return c.quotes.find(q => q.id === id) || {}; }

  function openQuote(c, done) {
    const lines = [
      { label: 'Gros œuvre', qty: 1, price: 0 }
    ];

    const m = ERP.UI.modal({
      title: 'Nouveau devis', sub: esc(c.company), size: 'modal--wide',
      body: `<div class="form-grid">
          <div class="field field--full"><label for="q-title">Objet du devis</label>
            <input id="q-title" placeholder="Ex. : Construction d'un immeuble R+3 — Ariana"></div>
          <div class="field"><label for="q-city">Ville des travaux</label><input id="q-city" placeholder="Tunis"></div>
          <div class="field"><label for="q-valid">Validité de l'offre</label>
            <input id="q-valid" type="date" value="${ERP.dt.add(ERP.DB.today, 30)}"></div>
          <div class="field"><label for="q-start">Démarrage envisagé</label>
            <input id="q-start" type="date" value="${ERP.dt.add(ERP.DB.today, 45)}"></div>
          <div class="field"><label for="q-months">Durée estimée (mois)</label>
            <input id="q-months" type="number" min="1" max="60" value="8"></div>
        </div>

        <h3 style="margin:22px 0 10px">Postes du devis</h3>
        <div class="table-wrap"><table class="tbl" style="min-width:560px">
          <thead><tr><th>Désignation</th><th style="width:110px" class="t-right">Qté</th>
            <th style="width:170px" class="t-right">Prix unitaire (DT)</th>
            <th style="width:150px" class="t-right">Total</th><th style="width:60px"></th></tr></thead>
          <tbody id="q-lines"></tbody>
        </table></div>
        <button class="btn btn--sm" id="q-addline" type="button" style="margin-top:12px">${icon('plus', 17)} Ajouter un poste</button>

        <div class="stat-band" style="margin-top:20px;grid-template-columns:repeat(3,1fr)">
          <div><dt>Total HT</dt><div class="money money--lg num" id="q-ht">0 DT</div></div>
          <div><dt>TVA 19 %</dt><div class="money money--lg num" id="q-tva">0 DT</div></div>
          <div><dt>Total TTC</dt><div class="money money--xl num" id="q-ttc" style="color:var(--orange)">0 DT</div></div>
        </div>`,
      footer: `<button class="btn" data-cancel type="button">Annuler</button>
               <button class="btn btn--primary" data-save type="button">${icon('save', 18)} Établir le devis</button>`
    });

    const q = (sel) => m.body.querySelector(sel);

    function drawLines() {
      q('#q-lines').innerHTML = lines.map((l, i) => `
        <tr data-line="${i}">
          <td><input class="input--flat" data-f="label" value="${esc(l.label)}" placeholder="Désignation du poste"></td>
          <td><input class="input--flat t-right num" data-f="qty" type="number" min="0" step="0.5" value="${l.qty}"></td>
          <td><input class="input--flat t-right num" data-f="price" type="number" min="0" step="500" value="${l.price}"></td>
          <td class="t-right money num" data-total>${fmt.money(l.qty * l.price)}</td>
          <td>${lines.length > 1 ? `<button class="icon-btn icon-btn--sm icon-btn--danger" data-rmline="${i}" type="button" aria-label="Retirer">${icon('trash', 16)}</button>` : ''}</td>
        </tr>`).join('');
      totals();
    }

    function totals() {
      const ht = lines.reduce((s, l) => s + l.qty * l.price, 0);
      q('#q-ht').textContent = fmt.money(ht);
      q('#q-tva').textContent = fmt.money(Math.round(ht * 0.19));
      q('#q-ttc').textContent = fmt.money(Math.round(ht * 1.19));
      return ht;
    }

    on(m.body, 'input', '[data-f]', (e, input) => {
      const i = +input.closest('[data-line]').dataset.line;
      const f = input.dataset.f;
      lines[i][f] = f === 'label' ? input.value : (+input.value || 0);
      input.closest('tr').querySelector('[data-total]').textContent = fmt.money(lines[i].qty * lines[i].price);
      totals();
    });
    on(m.body, 'click', '[data-rmline]', (e, b) => { lines.splice(+b.dataset.rmline, 1); drawLines(); });
    q('#q-addline').onclick = () => { lines.push({ label: '', qty: 1, price: 0 }); drawLines(); };
    drawLines();

    m.foot.querySelector('[data-cancel]').onclick = m.close;
    m.foot.querySelector('[data-save]').onclick = async () => {
      const title = q('#q-title').value.trim();
      if (!title) { toast('Indiquez l\'objet du devis', 'danger'); return; }
      const ht = totals();
      if (ht <= 0) { toast('Renseignez au moins un poste chiffré', 'danger'); return; }

      const quote = await ERP.Api.quotes.create({
        clientId: c.id, title, city: q('#q-city').value.trim() || c.city || 'Tunis',
        validUntil: q('#q-valid').value, startDate: q('#q-start').value,
        months: +q('#q-months').value || 8,
        lines: lines.filter(l => l.label.trim())
      });
      m.close();
      toast(`Devis ${quote.id} établi — ${fmt.money(quote.total)}`, 'ok', 3200);
      done && done();
    };
  }

  /** Transforme un devis accepté en chantier prêt à démarrer. */
  async function convertQuote(quoteId, done) {
    const quote = await ERP.Api.quotes.get(quoteId);
    if (!quote) return;

    const ok = await ERP.UI.confirm({
      title: 'Convertir ce devis en projet ?', confirmLabel: 'Créer le chantier', icon: 'building',
      text: `<b>${esc(quote.title)}</b><br>Un chantier sera ouvert pour ${fmt.money(quote.total)},
             avec une tâche par poste du devis. Le devis passera au statut « accepté ».`
    });
    if (!ok) return;

    // Chaque poste du devis devient une tâche, enchaînée sur la durée annoncée
    const totalDays = quote.months * 30;
    const share = quote.lines.length ? Math.max(7, Math.round(totalDays / quote.lines.length)) : 0;
    let cursor = quote.startDate;
    const tasks = quote.lines.map(l => {
      const t = { name: l.label, start: cursor, end: ERP.dt.add(cursor, share - 1) };
      cursor = ERP.dt.add(t.end, 1);
      return t;
    });

    const p = await ERP.Api.projects.create({
      name: quote.title, clientId: quote.clientId, type: 'Issu du devis ' + quote.id,
      city: quote.city, address: quote.city, manager: ERP.DB.user.name,
      start: quote.startDate, end: ERP.dt.add(quote.startDate, totalDays),
      budget: quote.total, status: 'en_preparation', tasks
    });
    await ERP.Api.quotes.update(quote.id, { status: 'accepte', projectId: p.id });

    toast(`Chantier « ${p.name} » ouvert depuis le devis ${quote.id}`, 'ok', 3500);
    done && done();
    ERP.Router.go('/projets/' + p.id);
  }

  /* ---------- Formulaire client ---------- */
  function openForm(done, client = null) {
    const m = ERP.UI.modal({
      title: client ? 'Modifier le client' : 'Nouveau client',
      sub: client ? esc(client.company) : 'Créer une fiche dans le portefeuille',
      body: `<div class="form-grid">
          <div class="field field--full"><label for="c-company">Société</label><input id="c-company" value="${client ? esc(client.company) : ''}" placeholder="Ex. : Immobilière El Yasmine"></div>
          <div class="field"><label for="c-contact">Interlocuteur</label><input id="c-contact" value="${client ? esc(client.contact) : ''}"></div>
          <div class="field"><label for="c-city">Ville</label><input id="c-city" value="${client ? esc(client.city) : ''}"></div>
          <div class="field"><label for="c-phone">Téléphone</label><input id="c-phone" value="${client ? esc(client.phone) : '+216 '}"></div>
          <div class="field"><label for="c-email">E-mail</label><input id="c-email" type="email" value="${client ? esc(client.email) : ''}"></div>
          <div class="field field--full"><label for="c-address">Adresse</label><input id="c-address" value="${client ? esc(client.address) : ''}"></div>
          <div class="field"><label for="c-status">Statut</label><select id="c-status">
            ${['actif', 'prospect', 'inactif'].map(s => `<option value="${s}" ${client && client.status === s ? 'selected' : ''}>${ERP.UI.label('client', s)}</option>`).join('')}
          </select></div>
        </div>`,
      footer: `<button class="btn" data-cancel>Annuler</button>
               <button class="btn btn--primary" data-save>${icon('save', 18)} ${client ? 'Enregistrer' : 'Créer le client'}</button>`
    });
    m.foot.querySelector('[data-cancel]').onclick = m.close;
    m.foot.querySelector('[data-save]').onclick = async () => {
      const g = (id) => m.body.querySelector(id).value.trim();
      if (!g('#c-company')) { toast('Le nom de la société est obligatoire', 'danger'); return; }
      const payload = {
        company: g('#c-company'), contact: g('#c-contact'), city: g('#c-city'),
        phone: g('#c-phone'), email: g('#c-email'), address: g('#c-address'), status: g('#c-status')
      };
      try {
        if (client) {
          await ERP.Api.clients.update(client.id, payload);
          toast('Fiche client mise à jour', 'ok');
        } else {
          await ERP.Api.clients.create(payload);
          toast('Client créé', 'ok');
        }
        m.close();
        if (done) done();
      } catch (err) {
        toast('Erreur : ' + (err.message || err), 'danger');
      }
    };
  }

  ERP.Router.add('/clients', { title: 'Clients', sub: 'Portefeuille et historique commercial', render: renderList });
  ERP.Router.add('/clients/:id', { title: 'Fiche client', sub: 'Projets et échanges', render: renderDetail });
})(window.ERP);

</script>
<script>
/* ===== js/articles.js ===== */
/* =========================================================
   BâtiPilot — Module ARTICLES / MATÉRIAUX
   ========================================================= */
window.ERP = window.ERP || {};
window.ERP.Components = window.ERP.Components || {};

(function (ERP) {
  'use strict';
  const { icon, fmt, badge, on, esc, toast, confirm } = ERP.UI;

  const state = { category: 'tous', stockStatus: 'tous', q: '', view: 'cards' };
  const STOCK_FILTERS = [['tous', 'Tous'], ['ok', 'Disponible'], ['faible', 'Stock faible'], ['rupture', 'Rupture']];
  const stockColor = (s) => s === 'rupture' ? 'var(--danger)' : s === 'faible' ? 'var(--warn)' : 'var(--ok)';

  async function renderList(params, view) {
    const categories = [...new Set(ERP.DB.articles.map(a => a.category))].sort();

    view.innerHTML = `
      <div class="toolbar">
        <div class="chips" id="arFilters"></div>
        <span class="spacer"></span>
        <div class="field" style="min-width:180px">
          <select id="arCat" aria-label="Filtrer par catégorie">
            <option value="tous">Toutes catégories</option>
            ${categories.map(c => `<option value="${c}" ${state.category === c ? 'selected' : ''}>${c}</option>`).join('')}
          </select>
        </div>
        <div class="search-field" style="flex:0 1 260px">
          <span class="ico">${icon('search', 19)}</span>
          <input type="search" id="arSearch" placeholder="Désignation, référence, fournisseur…" value="${esc(state.q)}">
        </div>
        <div class="segmented" id="arView">
          <button data-v="cards" class="${state.view === 'cards' ? 'is-active' : ''}">${icon('kanban', 17)}</button>
          <button data-v="table" class="${state.view === 'table' ? 'is-active' : ''}">${icon('list', 17)}</button>
        </div>
        <button class="btn btn--accent" id="arAdd">${icon('plus', 20)} Nouvel article</button>
      </div>

      <div id="arAlerts"></div>
      <div id="arResults"></div>`;

    async function refresh() {
      const all = await ERP.Api.articles.list({ q: state.q, category: state.category });
      view.querySelector('#arFilters').innerHTML = STOCK_FILTERS.map(([k, l]) => {
        const n = k === 'tous' ? all.length : all.filter(a => a.stockStatus === k).length;
        return `<button class="chip ${state.stockStatus === k ? 'is-active' : ''}" data-f="${k}">${l}<span class="chip__n num">${n}</span></button>`;
      }).join('');

      const low = all.filter(a => a.stockStatus !== 'ok');
      view.querySelector('#arAlerts').innerHTML = low.length ? `
        <div class="alert-band" style="margin-bottom:var(--gap)">
          <div style="flex:1">
            <strong>${low.length} article${low.length > 1 ? 's' : ''} à réapprovisionner</strong>
            <p>${low.slice(0, 4).map(a => esc(a.name) + (a.stockStatus === 'rupture' ? ' (rupture)' : ` (${a.stock} ${a.unit})`)).join(' · ')}${low.length > 4 ? ' …' : ''}</p>
          </div>
          <button class="btn btn--sm" data-order style="margin-right:16px">${icon('truck', 17)} Créer une commande</button>
        </div>` : '';

      const list = state.stockStatus === 'tous' ? all : all.filter(a => a.stockStatus === state.stockStatus);
      const results = view.querySelector('#arResults');

      if (!list.length) {
        results.innerHTML = ERP.UI.empty('Aucun article', 'Aucun matériau ne correspond à ces critères.');
        return;
      }

      results.innerHTML = state.view === 'cards'
        ? `<div class="article-grid">${list.map(a => `
            <button class="article-card" data-id="${a.id}" type="button">
              <div class="row" style="justify-content:space-between">
                <span class="article-card__ref num">${a.ref}</span>
                ${badge('stock', a.stockStatus)}
              </div>
              <h3>${esc(a.name)}</h3>
              <div class="row" style="justify-content:space-between;align-items:flex-end">
                <div><div class="article-card__qty num">${fmt.int(a.stock)} <small>${a.unit}</small></div>
                  <div class="small muted">Seuil : ${fmt.int(a.min)} ${a.unit}</div></div>
                <div style="text-align:right"><div class="money num">${fmt.dec(a.price, 2)} DT</div>
                  <div class="small muted">/ ${a.unit}</div></div>
              </div>
              <div class="stock-bar"><div class="stock-bar__fill" style="width:${Math.min(100, a.stock / Math.max(a.min * 2, 1) * 100)}%;background:${stockColor(a.stockStatus)}"></div></div>
              <div class="small muted row" style="gap:6px">${icon('truck', 14)} ${esc(a.supplier)}</div>
            </button>`).join('')}</div>`
        : `<section class="card"><div class="table-wrap"><table class="tbl">
            <thead><tr><th>Référence</th><th>Désignation</th><th>Catégorie</th><th>Unité</th>
              <th class="t-right">Stock</th><th class="t-right">Seuil</th><th class="t-right">Prix unitaire</th>
              <th>Fournisseur</th><th>Statut</th></tr></thead>
            <tbody>${list.map(a => `<tr class="is-clickable" data-id="${a.id}">
              <td class="num cell-main">${a.ref}</td>
              <td>${esc(a.name)}</td>
              <td><span class="tag">${a.category}</span></td>
              <td>${a.unit}</td>
              <td class="t-right"><b class="num" style="color:${stockColor(a.stockStatus)}">${fmt.int(a.stock)}</b></td>
              <td class="t-right num muted">${fmt.int(a.min)}</td>
              <td class="t-right num">${fmt.dec(a.price, 2)} DT</td>
              <td class="small">${esc(a.supplier)}</td>
              <td>${badge('stock', a.stockStatus)}</td>
            </tr>`).join('')}</tbody></table></div></section>`;
    }

    await refresh();

    on(view, 'click', '.chip[data-f]', (e, t) => { state.stockStatus = t.dataset.f; refresh(); });
    view.querySelector('#arCat').onchange = (e) => { state.category = e.target.value; refresh(); };
    view.querySelector('#arSearch').addEventListener('input', ERP.UI.debounce(e => { state.q = e.target.value; refresh(); }, 200));
    on(view, 'click', '#arView button', (e, t) => {
      state.view = t.dataset.v;
      view.querySelectorAll('#arView button').forEach(b => b.classList.toggle('is-active', b === t));
      refresh();
    });
    view.querySelector('#arAdd').onclick = () => openForm(refresh);
    on(view, 'click', '[data-order]', () => toast('Commande fournisseur préparée (module achats simulé)', 'info'));
    on(view, 'click', '[data-id]', (e, t) => openSheet(t.dataset.id, refresh));
